      ['방출구 설계압력 환산수두 기본값', `${s.foamTank.h3} m`, '보조포소화전 노즐선단 방사압력 0.35MPa 기준'],
      ['고정포방출구 [포수용액량 L/㎡, 방출률 L/min·㎡]', Object.entries(s.foamTank.outlet).map(([k, o]) => `${k === 'special' ? '특형' : k + '형'}: ${o.lt21.join('/')} · ${o.f21to70.join('/')} · ${o.ge70.join('/')}`).join('<br>'), '인화점 21℃ 미만 · 21℃ 이상 70℃ 미만 · 70℃ 이상 순'],
      ['펌프 토출량', '고정포방출구 방출량 + 보조포 접속구 수 × 400 L/min', ''],
    ]],
    ['옥외탱크 배치', [
      ['방유제 ~ 탱크 옆판', `지름 ${s.dike.dia}m 미만: 높이 × 1/3 / ${s.dike.dia}m 이상: 높이 × 1/2`, '인화점 200℃ 이상은 제외'],
      ['보유공지', s.openSpace.tbl.map(([x, m], i) => `${i ? `${fx(s.openSpace.tbl[i - 1][0])}배 초과 ` : ''}${fx(x)}배 이하 ${m}m`).join(' / ') + ` / 4,000배 초과: 지름·높이 중 큰 값 이상 (${s.openSpace.min}m 미만이면 ${s.openSpace.min}m, ${s.openSpace.max}m 초과면 ${s.openSpace.max}m로 할 수 있음)`, '지정수량의 배수 기준'],
      ['탱크 사이 최소 거리', '보유공지 (두 탱크 중 큰 값)', ''],
    ]],
    ['포소화설비 (헤드식)', [
      ['포헤드 1㎡당 방사량', `차고·주차장·항공기 격납고: 단백포 ${f.rate.protein} / 합성계면활성제포 ${f.rate.synthetic} / 수성막포 ${f.rate.afff} · 특수가연물: 모두 ${f.rateSpecial} L/min·㎡`, `방사시간 ${f.time}분`],
      ['동시 방사 면적', `바닥면적 ${f.zoneMax}㎡ 초과 시 ${f.zoneMax}㎡`, '항공기 격납고는 전체 (초안)'],
      ['헤드 1개당 바닥면적', `포헤드 ${f.perHead}㎡ / 포워터스프링클러 ${f.perHeadFW}㎡ / 압축공기포: 유류탱크 주위 ${f.caf.perTank}㎡, 특수가연물 저장소 ${f.caf.perSpecial}㎡ / 감지용 스프링클러헤드 ${f.sensorArea}㎡`, ''],
      ['포워터스프링클러 표준방사량', `헤드 1개당 ${f.fwQ} L/min`, ''],
      ['압축공기포 설계방출밀도', `일반가연물·탄화수소류 ${f.caf.density.general} / 특수가연물·알코올류·케톤류 ${f.caf.density.special} L/min·㎡`, `${f.time}분`],
      ['호스릴포·포소화전', `방수구 1개당 ${f.reelQ} L/min (200㎡ 이하 층 ${f.reelQsmall}) × ${f.reelT}분, 최대 ${f.reelMax}개`, '차고·주차장은 설비별 수원 중 큰 값'],
    ]],
    ['물분무', [
      ...Object.values(s.spray.kinds).map((k) => [k.label, `${k.q} L/min·㎡`, '']),
      ['방사시간', `${s.spray.time}분`, ''],
    ]],
    ['이산화탄소', [
      ['전역·표면화재 [체적 미만, kg/㎥, 최저량 kg]', s.co2.surface.map(([v_, k, m]) => `${v_ === Infinity ? '그 이상' : v_ + '㎥ 미만'} ${k} (${m})`).join(' / '), `개구부 ${s.co2.surfaceOpen} kg/㎡`],
      ['전역·심부화재', Object.values(s.co2.deep).map(([k, l]) => `${l} ${k}`).join(' / '), `kg/㎥, 개구부 ${s.co2.deepOpen} kg/㎡`],
      ['국소·평면화재', `표면적 1㎡당 ${s.co2.local.surface} kg × 고압식 ${s.co2.local.k.high} / 저압식 ${s.co2.local.k.low}`, ''],
      ['국소·입면화재', `방호공간 1㎥당 ${s.co2.local.X} − ${s.co2.local.Y} × a/A (kg) × 고압식 ${s.co2.local.k.high} / 저압식 ${s.co2.local.k.low}`, `방호공간: 방호대상물에서 ${s.co2.local.gap}m`],
      ['충전비', `고압식 ${s.co2.fill.high[0]} 이상 ${s.co2.fill.high[1]} 이하 / 저압식 ${s.co2.fill.low[0]} 이상 ${s.co2.fill.low[1]} 이하`, `저장용기 기본 ${s.co2.bottleL} L`],
    ]],
    ['할론 (전역방출)', [
      ...Object.values(s.halon.kinds).map(([l, tbl]) => [l, Object.entries(tbl).sort((a, b) => ['2402', '1211', '1301'].indexOf(a[0]) - ['2402', '1211', '1301'].indexOf(b[0])).map(([n, [k, a]]) => `할론 ${n}: ${k} kg/㎥, 개구부 ${a} kg/㎡`).join('<br>'), '체적 1㎥당 양은 표의 최솟값']),
      ['충전비', `할론 1301: 0.9 이상 1.6 이하<br>할론 1211: 0.7 이상 1.4 이하<br>할론 2402 가압식: 0.51 이상 0.67 미만 / 축압식: 0.67 이상 2.75 이하`, '1병 충전량(kg)은 직접 입력'],
    ]],
    ['할로겐화합물 및 불활성기체', [
      ...Object.entries(s.clean.halo).map(([k, [a, b]]) => [k, `K₁ ${a}, K₂ ${b}`, '할로겐화합물']),
      ...Object.entries(s.clean.inert).map(([k, [a, b]]) => [k, `K₁ ${a}, K₂ ${b}`, '불활성기체']),
      ['안전계수', `A·C급 ${s.clean.safety.AC} / B급 ${s.clean.safety.B}`, ''],
      ['95% 방출 시간', `할로겐화합물 ${s.clean.timeHalo}초 / 불활성기체 A·C급 ${s.clean.timeInert.AC}초, B급 ${s.clean.timeInert.B}초`, '최소설계농도의 95%'],
    ]],
    ['분말', [
      ...Object.entries(s.powder).map(([k, a]) => [`제${k}종 전역`, `${a[0]} kg/㎥, 개구부 ${a[1]} kg/㎡, 충전비 ${a[2]} L/kg`, '']),
      ...Object.entries(s.powderLocal).map(([k, a]) => [`제${k}종 국소`, `평면 ${a[0]} kg/㎡ / 입면 ${a[1]} − ${a[2]} × a/A kg/㎥`, `× ${s.powderLocalK}`]),
    ]],
    ['소화수조·저수조', [
      ['기준면적', `1·2층 합계 ${fx(s.cistern.bigArea)}㎡ 이상 ${fx(s.cistern.baseBig)}㎡ / 그 밖 ${fx(s.cistern.baseNormal)}㎡`, `기준면적마다 ${s.cistern.unit}㎥`],
      ['흡수관투입구', '80㎥ 미만 1개 / 80㎥ 이상 2개', ''], ['채수구', '40㎥ 미만 1개 / 100㎥ 미만 2개 / 100㎥ 이상 3개', ''],
      ['가압송수장치 양수량', '40㎥ 미만 1,100 / 100㎥ 미만 2,200 / 100㎥ 이상 3,300 L/min', `지표면에서 ${s.cistern.deep}m 이상 깊을 때`],
    ]],
    ['피난기구', Object.values(s.evac.kinds).map(([a, l]) => [l, a ? `${a}㎡마다 1개` : '세대마다 1개', ''])],
    ['소화기구', [
      ...Object.values(s.ext.kinds).map(([a, l]) => [l, `${a}㎡마다 능력단위 1`, '']),
      ['내화구조·불연재료 마감', `기준면적 ×${s.ext.fireproofMul}`, ''],
    ]],
  ];
  $('#view-std').innerHTML = `<p class="banner" style="margin:0">아래 값은 검토 중인 초안이에요. 틀린 값이 있으면 알려주세요. 코드 맨 위 <b>STD</b> 부분의 숫자만 바꾸면 계산에도 바로 반영돼요.</p>`
    + groups.map(([g, rows]) => `<section><h2>${g}</h2>${table(['항목', '값', '비고'], rows)}</section>`).join('');
}

/* ⑩ 사용자가 무언가 하면 */
$('#targets').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  current = b.dataset.t;
  renderTargets(); renderInputs(); renderResults();
});
$('#form').addEventListener('input', (e) => {
  const k = e.target.dataset.k;
  if (!k || e.target.type !== 'number') return;
  state[current][k] = e.target.value === '' ? null : Number(e.target.value);
  renderResults();
});
$('#form').addEventListener('change', (e) => {
  const k = e.target.dataset.k;
  if (!k || e.target.type === 'number') return;
  const before = layoutKey();
  state[current][k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  // 할론 종류를 바꿨는데 고른 방호대상에 그 약제 기준값이 없으면, 기준값이 있는 첫 방호대상으로 바꿔요
  if (current === 'gas' && k === 'halonType') {
    const g = state.gas, K = STD.halon.kinds;
    if (!K[g.halonKind][1][g.halonType]) g.halonKind = Object.keys(K).find((x) => K[x][1][g.halonType]);
  }
  // 보이는 입력칸이 바뀔 때만 다시 그려요. 고른 선택란을 다시 그리거나 포커스를 옮기면 모바일에서 목록이 한 번 더 떠요.
  if (layoutKey() !== before) renderInputs();
  renderResults();
});
$('#results').addEventListener('click', (e) => {
  const b = e.target.closest('button.val.has, button.ex-x');
  if (!b) return;
  const card = b.dataset.card;
  if (b.classList.contains('ex-x') || openVal.get(card) === b.dataset.l) openVal.delete(card);
  else openVal.set(card, b.dataset.l);
  renderResults();
  const again = [...document.querySelectorAll('#results button.val.has')].find((x) => x.dataset.card === card && x.dataset.l === b.dataset.l);
  if (again) again.focus({ preventScroll: true });
});
$('#results').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.matches || !d.matches('details.steps')) return;
  if (d.open) openSteps.add(d.dataset.card); else openSteps.delete(d.dataset.card);
}, true);
function showTab(std) {
  $('#tab-calc').setAttribute('aria-selected', String(!std));
  $('#tab-std').setAttribute('aria-selected', String(std));
  $('#view-calc').hidden = std;
  $('#view-std').hidden = !std;
  if (std) renderStd();
}
$('#tab-calc').addEventListener('click', () => showTab(false));
$('#tab-std').addEventListener('click', () => showTab(true));

renderTargets(); renderInputs(); renderResults();
</script>
</body>
</html>
