      steps.push(step({ t: '방사시간', sub: `${v.hT > 0 ? `직접 입력 ${fx(ts)}초` : `기준값: ${tm.why}`} → 식에는 분 단위로 t = ${fx(tmin, 3)}분을 넣어요` }));
      if (bad(v.hA) || bad(v.hQ)) {
        heads = NaN;
        warns.push('헤드 1개 분구면적과 방출률을 넣으면 분사헤드 수가 나와요.');
      } else {
        const per = v.hA * v.hQ * tmin;
        heads = up(Wt / per);
        steps.push(step({ t: '분사헤드 수', f: 'n<sub>h</sub> = ⌈W ÷ (a × q × t)⌉', sym: [['n<sub>h</sub>', '분사헤드 수 (개)'], ['W', `약제량 (${unit})`], ['a', '헤드 1개 분구면적 (㎟)'], ['q', `방출률 (${unit}/㎟·min)`], ['t', '방사시간 (min)'], ['⌈ ⌉', '올림']], sub: `n<sub>h</sub> = ⌈${fx(Wt)} ÷ (${fx(v.hA)} × ${fx(v.hQ)} × ${fx(tmin, 3)})⌉ = ⌈${fx(Wt)} ÷ ${fx(per)}⌉`, ans: `${heads}개` }));

        if (lay) {
          [hx, hy] = lay[0].split('x').map(Number);
          if (lay[1] !== heads) drawNote = `토너먼트 배관은 헤드 수가 2, 4, 8, 16…개여야 고르게 나뉘어서, 배관도는 ${heads}개 이상인 가장 작은 배치인 ${lay[1]}개(가로 ${hx} × 세로 ${hy})로 그렸어요.`;
        } else { hx = hy = 0; drawNote = '헤드가 64개를 넘으면 배관도는 그리지 않아요.'; }

    cards.push(head);
    if (hx > 0 && Number.isFinite(heads)) {
      const dc = gasDrawingCard(v.L, v.W, hx, hy);
      if (drawNote) dc.notes = [drawNote, ...(dc.notes || [])];

    } else if (drawNote) cards.push({ title: '분사헤드 배관도 (토너먼트)', notes: [drawNote] });

    head.tiles = tiles;
    cards.push(head);
    if (space) cards.push(space.card);

function gasDrawingCard(L, W, nx, ny) {
  const s = Math.min(720 / L, 430 / W);
  const pad = { l: 46, r: 24, t: 44, b: 70 };
  const w = L * s, h = W * s, VW = w + pad.l + pad.r, VH = h + pad.t + pad.b;
  const X = (x) => +(pad.l + x * s).toFixed(1), Y = (y) => +(pad.t + (W - y) * s).toFixed(1);
  const segs = [], heads = [];
  let first = null;
  // H자 모양으로 가로·세로 번갈아 둘로 나눠서, 모든 헤드까지 배관 길이가 같게 해요
  (function rec(x0, y0, x1, y1, cx, cy, prev) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    if (cx === 1 && cy === 1) { heads.push([mx, my]); return; }
    const dir = cx > cy ? 'h' : cy > cx ? 'v' : (prev === 'h' ? 'v' : 'h');
    if (!first) first = dir;
    if (dir === 'h') {
      segs.push({ a: [(x0 + mx) / 2, my], b: [(mx + x1) / 2, my], n: cx * cy });
      rec(x0, y0, mx, y1, cx / 2, cy, 'h'); rec(mx, y0, x1, y1, cx / 2, cy, 'h');
    } else {
      segs.push({ a: [mx, (y0 + my) / 2], b: [mx, (my + y1) / 2], n: cx * cy });
      rec(x0, y0, x1, my, cx, cy / 2, 'v'); rec(x0, my, x1, y1, cx, cy / 2, 'v');
    }
  })(0, 0, L, W, nx, ny, null);
  const r = Math.max(4, Math.min(7, s * 0.15));
  let o = `<rect class="room" x="${X(0)}" y="${Y(W)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
  // 저장용기실에서 들어오는 주배관
  const feedFrom = first === 'v' ? [0, W / 2] : [L / 2, 0];
  const boxY = Y(0) + 14;
  o += `<line class="feed" x1="${X(feedFrom[0])}" y1="${first === 'v' ? Y(feedFrom[1]) : boxY}" x2="${X(L / 2)}" y2="${Y(W / 2)}"/>`;
  if (first !== 'v') {
    o += `<rect class="box" x="${X(L / 2) - 46}" y="${boxY}" width="92" height="26" rx="4"/><text class="lk" x="${X(L / 2)}" y="${boxY + 17}" text-anchor="middle" style="stroke:none">저장용기실</text>`;
  }
  segs.forEach((g, k) => {
    o += `<line class="${k === 0 ? 'cross' : 'branch'}" x1="${X(g.a[0])}" y1="${Y(g.a[1])}" x2="${X(g.b[0])}" y2="${Y(g.b[1])}"/>`;
    const mxp = (X(g.a[0]) + X(g.b[0])) / 2, myp = (Y(g.a[1]) + Y(g.b[1])) / 2;
    const horiz = g.a[1] === g.b[1];
    [[(X(g.a[0]) + mxp) / 2, (Y(g.a[1]) + myp) / 2], [(X(g.b[0]) + mxp) / 2, (Y(g.b[1]) + myp) / 2]].forEach(([tx, ty]) => {
      o += `<text class="lb" x="${tx.toFixed(1)}" y="${(horiz ? ty - 5 : ty + 3).toFixed(1)}" ${horiz ? 'text-anchor="middle"' : `dx="6"`}>${g.n / 2}</text>`;
    });
  });
  heads.forEach(([hx_, hy_], i) => {
    o += `<circle class="head" cx="${X(hx_)}" cy="${Y(hy_)}" r="${r}"/>`;
    if (heads.length <= 64) o += `<text class="hn" x="${(X(hx_) + r + 1).toFixed(1)}" y="${(Y(hy_) + r + 8).toFixed(1)}">${i + 1}</text>`;
  });
  const yd = pad.t - 22, xd = pad.l - 22;
  o += `<line class="dim" x1="${X(0)}" y1="${yd}" x2="${X(L)}" y2="${yd}"/><text class="lk" x="${X(L / 2)}" y="${yd - 6}" text-anchor="middle">가로 ${fx(L)} m</text>`;
  o += `<line class="dim" x1="${xd}" y1="${Y(0)}" x2="${xd}" y2="${Y(W)}"/><text class="lk" x="${xd - 6}" y="${Y(W / 2)}" text-anchor="middle" transform="rotate(-90 ${xd - 6} ${Y(W / 2)})">세로 ${fx(W)} m</text>`;
  const svg = `<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" role="img" aria-label="가스계 분사헤드 토너먼트 배관도">${o}</svg>`;
  return {
    title: '분사헤드 배관도 (토너먼트)',
    notes: [`헤드 ${nx * ny}개를 가로 ${nx}열 × 세로 ${ny}행으로 균등 배치했어요. 갈라질 때마다 양쪽으로 같은 수의 헤드가 가도록 배관했어요.`, '배관 옆 숫자는 그 가지가 맡는 헤드 수예요. 배관 구경은 아직 계산하지 않아요.'],
    extraTop: `<div class="drawing">${svg}</div><div class="legend"><span><i class="lg-cross"></i>주배관</span><span><i class="lg-branch"></i>분기배관</span><span><i class="lg-head"></i>분사헤드</span></div>`,
  };
}

/* =========================================================
   ⑦ 계산 — 포소화설비 (헤드식)

function calcFoam(v) {
  if (bad(v.L) || bad(v.W)) return { error: '가로와 세로에 0보다 큰 값을 넣어 주세요.' };
  const c = STD.foam, A = v.L * v.W, S = Number(v.S) / 100, steps = [], tiles = [], notes = [];
  const placeName = { parking: '차고·주차장', hangar: '항공기 격납고', special: '특수가연물 저장·취급 공장·창고' }[v.place];
  steps.push(step({ t: '바닥면적', f: 'A = L × W', sym: [['A', '바닥면적 (㎡)'], ['L', '가로 (m)'], ['W', '세로 (m)']], sub: `A = ${fx(v.L)} × ${fx(v.W)}`, ans: `${fx(A)} ㎡` }));
  let heads, headName, flowHead, solHead, sysName;

  if (v.sys === 'caf') {
    sysName = '압축공기포소화설비'; headName = '분사헤드';
    const per = v.cafArea === 'tank' ? c.caf.perTank : c.caf.perSpecial;
    heads = up(A / per);
    steps.push(step({ t: '분사헤드 개수', f: `n = ⌈A ÷ ${per}⌉`, sym: [['n', '분사헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(per), `${v.cafArea === 'tank' ? '유류탱크 주위' : '특수가연물 저장소'} 헤드 1개당 바닥면적 (㎡)`], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${per}⌉`, ans: `${heads}개` }));
    const q = c.caf.density[v.cafDensity], Az = v.zone > 0 ? v.zone : A;
    flowHead = Az * q; solHead = flowHead * c.time;
    steps.push(step({ t: '방출량', f: 'Q₁ = A<sub>z</sub> × q', sym: [['Q₁', '포수용액 방출량 (L/min)'], ['A<sub>z</sub>', '방호구역 면적 (㎡)'], ['q', `설계방출밀도: ${v.cafDensity === 'special' ? '특수가연물·알코올류·케톤류' : '일반가연물·탄화수소류'} (L/min·㎡)`]], sub: `Q₁ = ${fx(Az)} × ${q}`, ans: `${fx(flowHead)} L/min` }));
  } else {
    const capped = v.place !== 'hangar';
    const Az = capped ? Math.min(A, c.zoneMax) : A;
    steps.push(step({ t: '동시 방사 면적', sub: capped ? `바닥면적 ${fx(A)}㎡ → ${c.zoneMax}㎡를 넘으면 ${c.zoneMax}㎡ 안의 헤드만 동시에 방사` : '항공기 격납고: 헤드가 가장 많이 설치된 격납고의 헤드 전체가 동시에 방사 (격납고가 여러 동이면 그 격납고 크기를 넣으세요)', ans: `${fx(Az)} ㎡` }));
    if (v.sys === 'fw') {
      sysName = '포워터스프링클러설비'; headName = '포워터스프링클러헤드';
      heads = up(A / c.perHeadFW);
      const Nz = up(Az / c.perHeadFW);
      steps.push(step({ t: '헤드 개수', f: `n = ⌈A ÷ ${c.perHeadFW}⌉`, sym: [['n', '포워터스프링클러헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.perHeadFW), '헤드 1개당 바닥면적 (㎡)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${c.perHeadFW}⌉`, ans: `${heads}개` }));
      steps.push(step({ t: '동시 방사 헤드 수', f: `N = ⌈A<sub>z</sub> ÷ ${c.perHeadFW}⌉`, sym: [['N', '동시 방사 헤드 수 (개)'], ['A<sub>z</sub>', '동시 방사 면적 (㎡)']], sub: `N = ⌈${fx(Az)} ÷ ${c.perHeadFW}⌉`, ans: `${Nz}개` }));
      flowHead = Nz * c.fwQ; solHead = flowHead * c.time;
      steps.push(step({ t: '방사량', f: `Q₁ = N × ${c.fwQ}`, sym: [['Q₁', '포수용액 방사량 (L/min)'], ['N', '동시 방사 헤드 수 (개)'], [String(c.fwQ), '헤드 1개당 표준방사량 (L/min)']], sub: `Q₁ = ${Nz} × ${c.fwQ}`, ans: `${fx(flowHead)} L/min` }));
    } else {
      sysName = '포헤드설비'; headName = '포헤드';
      heads = up(A / c.perHead);
      steps.push(step({ t: '헤드 개수', f: `n = ⌈A ÷ ${c.perHead}⌉`, sym: [['n', '포헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.perHead), '헤드 1개당 바닥면적 (㎡)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${c.perHead}⌉`, ans: `${heads}개` }));
      const rate = v.place === 'special' ? c.rateSpecial : c.rate[v.agentType];
      const rateWhy = v.place === 'special' ? '특수가연물 저장·취급: 약제 종류와 관계없이' : { protein: '단백포', synthetic: '합성계면활성제포', afff: '수성막포' }[v.agentType];
      flowHead = Az * rate; solHead = flowHead * c.time;
      steps.push(step({ t: '방사량', f: 'Q₁ = A<sub>z</sub> × q', sym: [['Q₁', '포수용액 방사량 (L/min)'], ['A<sub>z</sub>', '동시 방사 면적 (㎡)'], ['q', `바닥 1㎡당 방사량: ${rateWhy} (L/min·㎡)`]], sub: `Q₁ = ${fx(Az)} × ${rate}`, ans: `${fx(flowHead)} L/min` }));
    }
  }
  steps.push(step({ t: `${sysName} 포수용액량`, f: `V₁ = Q₁ × ${c.time}`, sym: [['V₁', '포수용액량 (L)'], ['Q₁', '방사량 (L/min)'], [String(c.time), '방사시간 (min)']], sub: `V₁ = ${fx(flowHead)} × ${c.time}`, ans: `${fx(solHead)} L` }));
  tiles.push({ l: '바닥면적', v: fx(A), u: '㎡' }, { l: headName, v: fx(heads), u: '개' });

  if (v.sensor && v.sys !== 'caf') {
    const ns = up(A / c.sensorArea);
    steps.push(step({ t: '감지용 스프링클러헤드', f: `n<sub>s</sub> = ⌈A ÷ ${c.sensorArea}⌉`, sym: [['n<sub>s</sub>', '자동기동용 감지 스프링클러헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.sensorArea), '헤드 1개당 경계면적 (㎡)']], sub: `n<sub>s</sub> = ⌈${fx(A)} ÷ ${c.sensorArea}⌉`, ans: `${ns}개` }));
    tiles.push({ l: '감지용 헤드', v: fx(ns), u: '개' });
  }

  let flowReel = 0, solReel = 0;
  if (v.place !== 'special' && n0(v.reelN) > 0) {
    const Nr = Math.min(n0(v.reelN), c.reelMax);
    const small = v.place === 'parking' && A <= c.zoneMax, qr = small ? c.reelQsmall : c.reelQ;
    flowReel = Nr * qr; solReel = flowReel * c.reelT;
    if (v.place === 'hangar') steps.push(step({ t: '호스릴포·포소화전 포수용액량', f: `V₂ = N × ${fx(qr * c.reelT / 1000)}`, sym: [['V₂', '호스릴포 포수용액량 (㎥)'], ['N', `호스릴포방수구가 가장 많은 격납고의 방수구 수 (최대 ${c.reelMax}개)`], [fx(qr * c.reelT / 1000), `방수구 1개당 수원 = ${qr} L/min × ${c.reelT}분 (㎥)`]], sub: `V₂ = ${Nr} × ${fx(qr * c.reelT / 1000)}`, ans: `${fx(solReel / 1000)} ㎥ (${fx(solReel)} L)` }));
    else steps.push(step({ t: '호스릴포·포소화전 포수용액량', f: `V₂ = N × ${qr} × ${c.reelT}`, sym: [['V₂', '호스릴포·포소화전 포수용액량 (L)'], ['N', `방수구 수 (최대 ${c.reelMax}개)`], [String(qr), `방수구 1개당 방사량 (L/min)${small ? ', 1개층 바닥면적 200㎡ 이하' : ''}`], [String(c.reelT), '방사시간 (min)']], sub: `V₂ = ${Nr} × ${qr} × ${c.reelT}`, ans: `${fx(solReel)} L` }));
  }
  let sol, flow;
  if (v.place === 'parking' && solReel > 0) {
    sol = Math.max(solHead, solReel); flow = Math.max(flowHead, flowReel);
    steps.push(step({ t: '포수용액량 (차고·주차장)', f: 'V = max(V₁, V₂)', sym: [['V', '포수용액량 (L)'], ['V₁', `${sysName} (L)`], ['V₂', '호스릴포·포소화전 (L)']], sub: `V = max(${fx(solHead)}, ${fx(solReel)})`, ans: `${fx(sol)} L`, note: '차고·주차장에 여러 설비를 같이 두면 설비별 수원 중 큰 값을 써요.' }));
  } else {
    sol = solHead + solReel; flow = flowHead + flowReel;
    if (solReel > 0) steps.push(step({ t: '포수용액량 합계', f: 'V = V₁ + V₂', sym: [['V', '포수용액량 합계 (L)']], sub: `V = ${fx(solHead)} + ${fx(solReel)}`, ans: `${fx(sol)} L`, note: v.place === 'hangar' ? '항공기 격납고: 헤드(또는 고정포방출구)가 가장 많은 격납고의 10분 방사량에 호스릴포 수원을 더해요.' : '' }));
  }
  const agent = sol * S, water = sol * (1 - S);
  steps.push(step({ t: '포 약제량', f: 'W = V × S', sym: [['W', '포 약제량 (L)'], ['V', '포수용액량 (L)'], ['S', '포 약제 농도']], sub: `W = ${fx(sol)} × ${fx(S)}`, ans: `${fx(agent)} L` }));
  steps.push(step({ t: '물 (약제 제외)', f: 'Q<sub>w</sub> = V × (1 − S)', sym: [['Q<sub>w</sub>', '약제를 뺀 물의 양 (L)']], sub: `Q<sub>w</sub> = ${fx(sol)} × ${fx(1 - S)}`, ans: `${fx(water)} L` }));
  steps.push(step({ t: '펌프 토출량', sub: v.place === 'parking' && solReel > 0 ? `큰 쪽 설비 기준: max(${fx(flowHead)}, ${fx(flowReel)})` : `${fx(flowHead)}${flowReel ? ` + ${fx(flowReel)}` : ''}`, ans: `${fx(flow)} L/min` }));
  const p = pump('fh', v, flow, null, '방출구 설계압력 환산수두');
  tiles.push({ l: '포수용액량', v: fx(sol / 1000), u: '㎥', tone: 'key' }, { l: '포 약제량', v: fx(agent), u: 'L', tone: 'key' }, { l: '물 (약제 제외)', v: fx(water / 1000), u: '㎥' }, ...pumpTiles(flow, p));
  if (n0(v.reelN) > c.reelMax && v.place !== 'special') notes.push(`호스릴포·포소화전 방수구는 최대 ${c.reelMax}개까지만 계산에 넣었어요.`);
  return { cards: [{ title: `${placeName} ${sysName}`, tiles, warns: [p.warn].filter(Boolean), notes, steps: [...steps, ...p.steps] }] };
}

/* =========================================================
   ⑧ 계산 — 물분무, 소화수조, 피난기구, 소화기구
   ========================================================= */
function calcSpray(v) {
  const k = STD.spray.kinds[v.kind], steps = [];
  let A;
  if (v.kind === 'transformer') {
    if (bad(v.tL) || bad(v.tW) || bad(v.tH)) return { error: '변압기 가로·세로·높이에 0보다 큰 값을 넣어 주세요.' };
    A = v.tL * v.tW + 2 * (v.tL + v.tW) * v.tH;
    steps.push(step({ t: '바닥을 뺀 표면적', f: 'A = a × b + 2 × (a + b) × h', sym: [['A', '바닥을 뺀 표면적 (㎡)'], ['a', '가로 (m)'], ['b', '세로 (m)'], ['h', '높이 (m)']], sub: `A = ${fx(v.tL)} × ${fx(v.tW)} + 2 × (${fx(v.tL)} + ${fx(v.tW)}) × ${fx(v.tH)}`, ans: `${fx(A)} ㎡` }));
  } else {
    if (bad(v.A)) return { error: '면적에 0보다 큰 값을 넣어 주세요.' };
    A = v.A;
  }
  const Aeff = Math.max(A, k.min), flow = Aeff * k.q, vol = flow * STD.spray.time / 1000;
  steps.push(step({ t: '펌프 토출량', f: `Q = A × ${k.q}`, sym: [['Q', '펌프 토출량 (L/min)'], ['A', k.min ? `면적 (㎡, 최소 ${k.min}㎡)` : '면적 (㎡)'], [String(k.q), '1㎡당 방사량 (L/min·㎡)']], sub: `Q = ${fx(Aeff)} × ${k.q}`, ans: `${fx(flow)} L/min`, note: A < k.min ? `면적이 ${k.min}㎡보다 작아서 ${k.min}㎡로 계산했어요.` : '' }));
  steps.push(step({ t: '수원', f: `V = Q × ${STD.spray.time} ÷ 1000`, sym: [['V', '수원 (㎥)'], ['Q', '토출량 (L/min)'], [String(STD.spray.time), '방사시간 (min)'], ['1000', 'L → ㎥ 환산']], sub: `V = ${fx(flow)} × ${STD.spray.time} ÷ 1000`, ans: `${fx(vol)} ㎥` }));
  const p = pump('ws', v, flow);
  return { cards: [{
    title: '물분무소화설비',
    tiles: [{ l: '면적', v: fx(Aeff), u: '㎡' }, { l: '수원', v: fx(vol), u: '㎥', tone: 'key' }, ...pumpTiles(flow, p)],
    warns: [p.warn].filter(Boolean),
    notes: [k.label],
    steps: [...steps, ...p.steps],
  }] };
}

function calcCistern(v) {
  if (bad(v.total)) return { error: '연면적에 0보다 큰 값을 넣어 주세요.' };
  const c = STD.cistern, f12 = n0(v.f12);
  const base = f12 >= c.bigArea ? c.baseBig : c.baseNormal;
  const units = up(v.total / base), Q = units * c.unit;
  const suction = pickLT(c.suction, Q)[1], intake = pickLT(c.intake, Q)[1], pumpQ = pickLT(c.pump, Q)[1];
  const steps = [
    step({ t: '기준면적', sub: `1층과 2층 바닥면적 합계 ${fx(f12)}㎡ → ${f12 >= c.bigArea ? `${fx(c.bigArea)}㎡ 이상` : `${fx(c.bigArea)}㎡ 미만`}`, ans: `${fx(base)} ㎡` }),
    step({ t: '저수량', f: `Q = ⌈A ÷ B⌉ × ${c.unit}`, sym: [['Q', '저수량 (㎥)'], ['A', '연면적 (㎡)'], ['B', '기준면적 (㎡)'], [String(c.unit), '기준면적당 저수량 (㎥)'], ['⌈ ⌉', '올림']], sub: `Q = ⌈${fx(v.total)} ÷ ${fx(base)}⌉ × ${c.unit} = ${units} × ${c.unit}`, ans: `${fx(Q)} ㎥` }),
    step({ t: '흡수관투입구', sub: `저수량 ${fx(Q)}㎥ → ${Q < 80 ? '80㎥ 미만' : '80㎥ 이상'}`, ans: `${suction}개` }),
    step({ t: '채수구', sub: `저수량 ${fx(Q)}㎥ → ${Q < 40 ? '40㎥ 미만' : Q < 100 ? '40㎥ 이상 100㎥ 미만' : '100㎥ 이상'}`, ans: `${intake}개` }),
  ];
  if (v.deep) steps.push(step({ t: '가압송수장치 양수량', sub: `지표면에서 ${c.deep}m 이상 깊은 지하 → 저수량 ${fx(Q)}㎥`, ans: `${fx(pumpQ)} L/min 이상` }));
  return { cards: [{
    title: '소화수조·저수조',
    tiles: [{ l: '저수량', v: fx(Q), u: '㎥', tone: 'key' }, { l: '흡수관투입구', v: suction, u: '개' }, { l: '채수구', v: intake, u: '개' }, { l: '가압송수장치 양수량', v: v.deep ? fx(pumpQ) : '해당 없음', u: v.deep ? 'L/min' : '' }],
    steps,
  }] };
}

function calcEvac(v) {
  const [base, label] = STD.evac.kinds[v.kind], steps = [];
  if (!(v.floors >= 1)) return { error: '설치 대상 층수를 1 이상으로 넣어 주세요.' };
  let perFloor;
  if (v.kind === 'apt') {
    if (bad(v.units)) return { error: '층당 세대 수를 넣어 주세요.' };
    perFloor = v.units;
    steps.push(step({ t: '층당 설치개수', sub: `계단실형 아파트: 각 세대마다 1개 → ${fx(v.units)}세대`, ans: `${perFloor}개` }));
  } else {
    if (bad(v.area)) return { error: '층 바닥면적에 0보다 큰 값을 넣어 주세요.' };
    perFloor = up(v.area / base);
    steps.push(step({ t: '층당 설치개수', f: `n = ⌈A ÷ ${base}⌉`, sym: [['n', '층당 피난기구 개수 (개)'], ['A', '층 바닥면적 (㎡)'], [String(base), `${label}의 기준면적 (㎡)`], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(v.area)} ÷ ${base}⌉`, ans: `${perFloor}개` }));
  }
  const rooms = v.kind === 'lodging' ? n0(v.rooms) : 0;
  const total = perFloor * v.floors + rooms;
  steps.push(step({ t: '전체 설치개수', f: 'n<sub>T</sub> = n × F + R', sym: [['n<sub>T</sub>', '전체 피난기구 개수 (개)'], ['n', '층당 개수 (개)'], ['F', '설치 대상 층수 (층)'], ['R', '숙박시설 객실마다 추가하는 완강기 (개)']], sub: `n<sub>T</sub> = ${perFloor} × ${fx(v.floors)} + ${rooms}`, ans: `${fx(total)}개` }));
  return { cards: [{
    title: '피난기구',
    tiles: [{ l: '층당 개수', v: fx(perFloor), u: '개' }, { l: '추가 완강기', v: fx(rooms), u: '개' }, { l: '전체 개수', v: fx(total), u: '개', tone: 'key' }],
    notes: [label],
    steps,
  }] };
}

function calcExt(v) {
  if (bad(v.area)) return { error: '층 바닥면적에 0보다 큰 값을 넣어 주세요.' };
  if (!(v.floors >= 1)) return { error: '층수를 1 이상으로 넣어 주세요.' };
  if (bad(v.unit)) return { error: '소화기 1개 능력단위에 0보다 큰 값을 넣어 주세요.' };
  const [base0, label] = STD.ext.kinds[v.kind];
  const mul = v.fireproof ? STD.ext.fireproofMul : 1, base = base0 * mul;
  const units = up(v.area / base), perFloor = up(units / v.unit), rooms = n0(v.rooms), total = perFloor * v.floors + rooms;
  const steps = [
    step({ t: '능력단위 기준면적', f: 'B = B₀ × m', sym: [['B', '능력단위 1당 바닥면적 (㎡)'], ['B₀', `${label} 기준 (㎡)`], ['m', v.fireproof ? '내화구조·불연재료 마감 배수' : '배수 (해당 없음)']], sub: `B = ${base0} × ${mul}`, ans: `${fx(base)} ㎡` }),

function accCard(v) {
  const c = STD.ext.acc, A = n0(v.acc_area);
  if (!(A > 0)) return { title: '부속용도 추가 소화기구', error: '해당 용도 바닥면적에 0보다 큰 값을 넣어 주세요.' };
  const U = up(A / c.perUnit), n = up(U / v.unit), auto = A <= c.autoSmall ? 1 : 2, kitchen = v.acc_kind === 'kitchen';
  const steps = [
    step({ t: '추가 능력단위', f: `U = ⌈A ÷ ${c.perUnit}⌉`, sym: [['U', '추가로 필요한 능력단위'], ['A', '해당 용도 바닥면적 (㎡)'], [String(c.perUnit), `바닥면적 ${c.perUnit}㎡마다 능력단위 1단위 이상`], ['⌈ ⌉', '올림']], sub: `U = ⌈${fx(A)} ÷ ${c.perUnit}⌉`, ans: `${U}단위` }),
    step({ t: '추가 소화기 개수', f: 'n = ⌈U ÷ u⌉', sym: [['n', '추가 소화기 개수 (개)'], ['U', '추가 능력단위'], ['u', '소화기 1개 능력단위']], sub: `n = ⌈${U} ÷ ${fx(v.unit)}⌉`, ans: `${n}개` }),
    step({ t: '자동확산소화기', sub: v.acc_exempt ? '스프링클러설비 등이 설치돼 있어서 설치하지 않을 수 있어요.' : `바닥면적 ${fx(A)}㎡ → ${A <= c.autoSmall ? `${c.autoSmall}㎡ 이하라서 1개` : `${c.autoSmall}㎡ 초과라서 2개 이상`}`, ans: v.acc_exempt ? '생략 가능' : `${auto}개` }),
  ];
  return {
    title: '부속용도 추가 소화기구', badge: kitchen ? '주방' : '보일러실 등',
    tiles: [{ l: '자동확산소화기', v: v.acc_exempt ? '생략 가능' : fx(auto), u: v.acc_exempt ? '' : '개', tone: 'key' }, { l: '추가 능력단위', v: fx(U), u: '단위' }, { l: '추가 소화기', v: fx(n), u: '개' }],
    notes: [
      kitchen ? '추가 소화기 중 1개 이상은 주방화재용 소화기(K급)로 설치해야 해요.' : '',
      v.acc_exempt ? '' : `자동확산소화기는 ${c.autoSmall}㎡ 초과면 2개 이상을, 보일러·조리기구 등 방호대상에 유효하게 분사될 수 있는 위치에 배치될 수 있는 수량으로 설치해요.`,

}

function fieldHTML(f, val) {

    return `<div class="fld${f.wide ? ' wide' : ''}"><span class="fl" id="${id}_l">${f.label}</span><button type="button" class="cs-btn" id="${id}" data-cs="${f.id}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${id}_l ${id}"><span class="cs-v">${on ? on[1] : ''}</span><svg class="cs-ar" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>${hint}</div>`;
  }
  const val_ = (x) => (typeof x === 'function' ? x() : x);
  const lim = `${f.min != null ? ` min="${val_(f.min)}"` : ''}${f.max != null ? ` max="${val_(f.max)}"` : ''} step="${f.step || 'any'}"`;
  const list = f.list ? `<datalist id="dl_${f.id}">${val_(f.list).map((o) => `<option value="${o}"></option>`).join('')}</datalist>` : '';
  const uv = f.units ? (state[current][f.id + '_u'] || f.units[0]) : null;

}

// 편집 화면 이벤트 (화면은 처음 열 때 만들어지니까 document에 걸어요)
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-act="plan"]')) { openPlan(); return; }
  const m = e.target.closest('#plan');
  if (!m) return;
  if (e.target.closest('.plan-x')) { closePlan(); return; }
  const tb = e.target.closest('[data-tool]');
  if (tb) { PL.tool = tb.dataset.tool; PL.draft = null; plDraw(true); return; }
  const pick = e.target.closest('.pl-pick');
  if (pick) { PL.sel = pick.dataset.id; PL.tool = 'select'; plDraw(true); return; }
  const b = e.target.closest('[data-pl]');
  if (b) {
    const a = b.dataset.pl, s = PL.data.shapes.find((x) => x.id === b.dataset.id);
    if (a === 'undo') plUndo();
    if (a === 'clear' && PL.data.shapes.length) { plPush(); PL.data.shapes = []; PL.sel = null; plDraw(true); }
    if (a === 'del' && s) { plPush(); PL.data.shapes = PL.data.shapes.filter((x) => x !== s); if (PL.sel === s.id) PL.sel = null; plDraw(true); }
    if (a === 'toggle' && s) { plPush(); plFlip(s); plDraw(true); }
    if (a === 'finish') plFinishPoly();
    if (a === 'back' && PL.draft) { PL.draft.pts.pop(); if (!PL.draft.pts.length) PL.draft = null; plDraw(); }
    if (a === 'cancel') { PL.draft = null; plDraw(); }
    if (a === 'quick') {
      const w = Number($('#pl-aw').value), h = Number($('#pl-ah').value);
      if (!(w > 0 && h > 0)) { $('#pl-aw').focus(); return; }
      const right = PL.data.shapes.reduce((mx, sh) => Math.max(mx, ...ptsOf(sh).map((p) => p[0])), 0);
      const x = right + w <= PL.data.W ? right : 0;
      if (w > PL.data.W) PL.data.W = $('#pl-W').value = Math.ceil(w);
      if (h > PL.data.H) PL.data.H = $('#pl-H').value = Math.ceil(h);
      plAdd({ type: 'rect', x, y: 0, w, h, sub: false });
      $('#pl-aw').value = $('#pl-ah').value = '';

    return;
  }
  if (e.target.closest('#pl-apply')) {
    const st = plStats(PL.data), v = cur();
    if (!(st.area > 0)) return;
    v.sm_use = true; v.sm_A = r2(st.area); v.sm_D = r2(st.D); v.sm_fromPlan = true;
    closePlan();
    const el = document.getElementById('f_sm_A');
    if (el) { el.closest('fieldset').scrollIntoView({ behavior: 'smooth', block: 'center' }); flash(el.closest('.fld')); }
  }
});
document.addEventListener('change', (e) => {

  if (e.target.dataset.pe === 'sub') { const s = PL.data.shapes.find((x) => x.id === PL.sel); if (s && s.sub !== e.target.checked) { plPush(); plFlip(s); plDraw(true); } }

document.addEventListener('input', (e) => {

document.addEventListener('keydown', (e) => {

// 그리기
document.addEventListener('pointerdown', (e) => {
  const svg = e.target.closest('#pl-canvas svg');
  if (!svg || e.button > 0) return;
  e.preventDefault();
  const raw = plPoint(e), p = plSnap(raw);
  if (PL.tool === 'rect') { PL.draft = { type: 'rect', a: p, b: p }; svg.setPointerCapture(e.pointerId); plDraw(); return; }
  if (PL.tool === 'poly') {
    if (!PL.draft) PL.draft = { type: 'poly', pts: [p] };
    else {
      const P = PL.draft.pts, f = P[0], last = P[P.length - 1];
      if (P.length >= 3 && Math.hypot(raw[0] - f[0], raw[1] - f[1]) <= Math.max(PL.data.grid * 0.6, plPx(16))) { plFinishPoly(); return; }
      if (!(p[0] === last[0] && p[1] === last[1])) P.push(p);
    }
    plDraw(); return;
  }
  // 고르기·옮기기
  const sel = PL.data.shapes.find((x) => x.id === PL.sel);
  if (sel) {
    const P = ptsOf(sel), r = plPx(14);
    const vi = P.findIndex((q) => Math.hypot(q[0] - raw[0], q[1] - raw[1]) <= r);
    if (vi >= 0) { PL.drag = { kind: 'v', i: vi, snap: JSON.stringify(PL.data.shapes), moved: false, opp: P[(vi + 2) % 4] }; svg.setPointerCapture(e.pointerId); return; }
  }
  const hit = [...PL.data.shapes].reverse().find((s) => inPoly(raw, ptsOf(s)));
  PL.sel = hit ? hit.id : null;
  if (hit) { PL.drag = { kind: 'm', start: p, orig: JSON.parse(JSON.stringify(hit)), snap: JSON.stringify(PL.data.shapes), moved: false }; svg.setPointerCapture(e.pointerId); }
  plDraw(true);
});
document.addEventListener('pointermove', (e) => {
  const svg = $('#pl-canvas svg');
  if (!svg || $('#plan').hidden) return;
  if (!e.target.closest('#pl-canvas svg') && !PL.draft && !PL.drag) { if (PL.hover) { PL.hover = null; plDraw(); } return; }
  const p = plSnap(plPoint(e));
  if (PL.draft && PL.draft.type === 'rect') { PL.draft.b = p; plDraw(); return; }
  if (PL.drag) {
    const s = PL.data.shapes.find((x) => x.id === PL.sel);
    if (!s) return;
    if (PL.drag.kind === 'm') {
      const dx = p[0] - PL.drag.start[0], dy = p[1] - PL.drag.start[1], o = PL.drag.orig;
      if (s.type === 'rect') { s.x = r2(o.x + dx); s.y = r2(o.y + dy); } else s.pts = o.pts.map((q) => [r2(q[0] + dx), r2(q[1] + dy)]);
      PL.drag.moved = PL.drag.moved || dx !== 0 || dy !== 0;
    } else if (s.type === 'rect') {
      const [ox, oy] = PL.drag.opp, w = Math.abs(p[0] - ox), h = Math.abs(p[1] - oy);
      if (w > 0 && h > 0) { s.x = Math.min(p[0], ox); s.y = Math.min(p[1], oy); s.w = w; s.h = h; PL.drag.moved = true; }
    } else { s.pts[PL.drag.i] = p; PL.drag.moved = true; }
    plDraw(); plList();
    return;
  }
  const h = PL.hover;
  if (!h || h[0] !== p[0] || h[1] !== p[1]) { PL.hover = p; plDraw(); }
});
document.addEventListener('pointerup', (e) => {
  if (!$('#plan') || $('#plan').hidden) return;
  if (PL.draft && PL.draft.type === 'rect') {
    const { a, b } = PL.draft, w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    PL.draft = null;
    if (w > 0 && h > 0) plAdd({ type: 'rect', x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w, h, sub: false });

  }

document.addEventListener('dblclick', (e) => { if (e.target.closest('#pl-canvas svg') && PL.draft && PL.draft.type === 'poly') plFinishPoly(); });

/* =========================================================
   ⑪ 배관 수리계산 (도면): 뼈대를 자동으로 그리고, 도면에서 고쳐 써요
   - 배관: 하젠-윌리엄스 ΔP = 6.053 × 10⁴ × Q^1.85 ÷ (C^1.85 × d^4.87) × (L + Le)  [MPa, Q L/min, d mm]
   - 정밀: 헤드마다 Q = K√(10P), 가장 압력이 낮은 헤드가 최소 방수압이 되게 맞춤
   - 간단: 열린 헤드 모두 같은 방수량
   ========================================================= */
const FR = STD.fric;
const fIdx = (size) => FR.sizes.indexOf(size);
const range = (a, b) => Array.from({ length: Math.max(0, b - a) }, (_, i) => a + i);

function netDefaults(kind) {
  const common = {
    kind, mode: 'precise', C: FR.C, dia: 'nom', conv: 'std', follow: true,
    fitOn: Object.fromEntries(Object.keys(FR.types).map((k) => [k, FR.defOn.includes(k)])),
    fitLe: Object.fromEntries(Object.entries(FR.types).map(([k, [, a]]) => [k, a.slice()])),
    tankOn: false, tankPos: 'below', tankH: 3, sucLoss: 0, pumpL: 0,
    openMode: 'base', openSet: {}, ov: {}, kMode: 'qp',
  };
  if (kind === 'pt') return { ...common, openMode: 'all' };
  return { ...common, nf: 5, FH: 3.5, outH: 1.5, perFloor: 1, out2L: 20, outL: 1, pumpZ: 0, K: 99.71, nozD: 13, Pmin: 0.17, qS: 130, hoseOn: false, hoseType: 'r40', hoseLen: 15, hoseRate: 12 };
}

function netModel(kind) { return { kind, nodes: new Map(), segs: [], segById: new Map(), leaves: [], root: 'P' }; }
function nAdd(M, id, o) { const n = { id, kids: [], ...o }; M.nodes.set(id, n); if (o.leaf) M.leaves.push(id); return n; }
function sAdd(M, net, id, a, b, o) {
  const ov = net.ov[id] || {};
  const s = {
    id, a, b, ...o,
    L: ov.L != null ? ov.L : o.L, size: ov.size || o.size,
    fit: { ...(o.fit || {}), ...(ov.fit || {}) }, edited: !!net.ov[id],
  };
  M.segs.push(s); M.segById.set(id, s);
  M.nodes.get(a).kids.push(id); M.nodes.get(b).up = id;
  return s;
}

/* 스프링클러 일정지점: 시작점 → 수직배관 → 교차배관 → 가지배관 → (회향식) → 헤드. 시험 문제처럼 작은 배관망 */
const circ = (i) => (i >= 1 && i <= 20 ? String.fromCharCode(0x245f + i) : `(${i})`);
const clampI = (x, a, b, d) => Math.max(a, Math.min(b, Math.round(x) || d));
function netBuildPT(n) {
  const M = netModel('pt');
  const L = clampI(n.lines, 1, 8, 2), H = clampI(n.heads, 1, 12, 5);
  const S = n.S > 0 ? n.S : 3, first = n0(n.first), Sb = n.Sb > 0 ? n.Sb : 3, c0 = n0(n.c0);
  const center = n.feed === 'center' && H >= 2;
  const zB = n0(n.rH), rL = n0(n.rL);
  const cmin = STD.sp.crossMin, rsz = Math.max(pipeSize(L * H), cmin);
  M.geo = { L, H, S, first, Sb, c0, zB, rL, center };
  nAdd(M, 'P', { x: 0, y: -rL, z: 0, label: '시작점' });
  let top = 'P';
  if (rL > 0) { nAdd(M, 'B', { x: 0, y: 0, z: 0 }); sAdd(M, n, 'rh', 'P', 'B', { L: r2(rL), size: rsz, fit: { elbow: zB > 0 ? 1 : 0 }, role: 'riser', label: '시작점 → 수직배관' }); top = 'B'; }
  if (zB > 0) { nAdd(M, 'R', { x: 0, y: 0, z: zB }); sAdd(M, n, 'riser', top, 'R', { L: r2(zB), size: rsz, fit: { elbow: 1 }, role: 'riser', label: '수직배관' }); top = 'R'; }
  let prev = top, prevSize = rsz, px = 0;
  const lines = [];
  for (let i = 0; i < L; i++) {
    const x = c0 + i * Sb, size = Math.max(pipeSize((L - i) * H), cmin), J = `J${i}`;
    if (x - px > 1e-9 || i > 0) {
      nAdd(M, J, { x, y: 0, z: zB });
      sAdd(M, n, `c${i}`, prev, J, { L: r2(x - px), size, fit: { teeR: i > 0 ? 1 : 0, red: size !== prevSize ? 1 : 0 }, role: 'cross', label: `교차배관 ${i === 0 ? '→ 1번 가지배관' : `${i}번 → ${i + 1}번 가지배관`}` });
      prev = J;
    } else M.nodes.get(prev).x = x;
    prevSize = size; px = x;
    const jn = prev, sides = center ? [[1, range(0, Math.ceil(H / 2))], [-1, range(0, Math.floor(H / 2))]] : [[1, range(0, H)]];
    sides.forEach(([dir, ks]) => {
      let bp = jn, by = 0, bs = size;
      ks.forEach((k) => {
        const y = dir * (first + k * S), nD = ks.length - k, s = pipeSize(nD), T = `T${i}_${dir}_${k}`, Hd = `H${i}_${dir}_${k}`, D = `d${i}_${dir}_${k}`, last = k === ks.length - 1;
        nAdd(M, T, { x, y, z: zB });
        sAdd(M, n, `b${i}_${dir}_${k}`, bp, T, { L: r2(Math.abs(y - by)), size: s, fit: k === 0 ? { teeB: 1 } : { teeR: 1, red: s !== bs ? 1 : 0 }, role: 'branch', label: '' });
        const o = n.ov[D] || {};
        const ri = n.dropOn ? (o.rise != null ? o.rise : n0(n.rise)) : 0, fa = n.dropOn ? (o.fall != null ? o.fall : n0(n.fall)) : 0, ov = n.dropOn ? n0(n.over) : 0;
        nAdd(M, Hd, { x, y: y + dir * ov, z: r2(zB + ri - fa), leaf: true, line: i, dir, k, tee: T });
        sAdd(M, n, D, T, Hd, { L: r2(ri + ov + fa), size: n.dropOn ? n.dropSize : s, fit: n.dropOn ? (last ? { elbow: 3, red: 1 } : { teeB: 1, elbow: 2, red: 1 }) : {}, role: 'drop', label: '', rise: ri, fall: fa });
        bp = T; by = y; bs = s;
      });
    });
    lines.push(jn);
  }
  // 헤드 번호: 가장 먼 가지배관의 끝에서부터 ①, ②, … (시험 도면처럼)
  const order = M.leaves.slice().sort((a, b) => { const A = M.nodes.get(a), B = M.nodes.get(b); return B.line - A.line || B.dir - A.dir || B.k - A.k; });
  order.forEach((id, r) => { const h = M.nodes.get(id); h.rank = r + 1; h.label = circ(r + 1); });
  M.segs.forEach((sg) => {
    if (sg.role === 'branch') { const t = M.nodes.get(sg.b), up = M.nodes.get(sg.a), hb = M.nodes.get(`H${t.id.slice(1)}`), ha = up.id[0] === 'T' ? M.nodes.get(`H${up.id.slice(1)}`) : null; sg.label = `${ha ? ha.label : '교차배관'} → ${hb.label}`; }
    if (sg.role === 'drop') sg.label = `헤드 ${M.nodes.get(sg.b).label} 연결${n.dropOn ? ' (회향식)' : ''}`;
  });
  return M;
}

/* 45° 정도에서 본 입체 도면: 가지배관은 오른쪽(살짝 아래), 교차배관은 오른쪽 위(안쪽), 높이는 위 */
function netSvgPT(M, R, n, open, o) {
  const g = M.geo, sel = o.sel || {}, op = new Set(open);
  const AX = [0.64, -0.46], AY = [1, 0.17];   // x(교차배관) 1 m, y(가지배관) 1 m의 화면 방향
  const raw = (x, y, z) => [x * AX[0] + y * AY[0], x * AX[1] + y * AY[1] - z];
  const pts = [...M.nodes.values()].map((q) => raw(q.x, q.y, q.z));
  const minX = Math.min(...pts.map((p) => p[0])), maxX = Math.max(...pts.map((p) => p[0]));
  const minY = Math.min(...pts.map((p) => p[1])), maxY = Math.max(...pts.map((p) => p[1]));
  const s = Math.max(14, Math.min(64, 720 / Math.max(1, maxX - minX), 380 / Math.max(1, maxY - minY)));
  const pad = { l: 64, r: 70, t: 46, b: 70 };
  const VW = +((maxX - minX) * s + pad.l + pad.r).toFixed(1), VH = +((maxY - minY) * s + pad.t + pad.b).toFixed(1);
  const P = (x, y, z) => { const [a, b] = raw(x, y, z); return [+(pad.l + (a - minX) * s).toFixed(1), +(pad.t + (b - minY) * s).toFixed(1)]; };
  const at = (id) => { const q = M.nodes.get(id); return P(q.x, q.y, q.z); };
  const cls = (sg) => `nt-p r-${sg.role}${R && R.Q.get(sg.id) > 0 ? '' : ' dry'}${sg.edited ? ' ed' : ''}${sel.t === 'seg' && sel.id === sg.id ? ' sel' : ''}`;
  let pipes = '', drops = '', labels = '', hits = '';
  const lab = (sg, a, b) => {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len < 40 || sg.role === 'drop') return;
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, vert = Math.abs(b[0] - a[0]) < 2;
    const t = `${sg.size}A (${fx(sg.L)}m)`;
    if (vert) labels += `<text class="nt-lb" x="${mx - 8}" y="${my + 4}" text-anchor="end">${t}</text>`;
    else {
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, a2 = ang > 90 || ang < -90 ? ang + 180 : ang;
      labels += `<text class="nt-lb" transform="translate(${mx},${my}) rotate(${a2.toFixed(1)})" y="-6" text-anchor="middle">${t}</text>`;
    }
  };
  // 먼 가지배관부터 그려서 가까운 배관이 위에 오게
  const segs = M.segs.slice().sort((a, b) => (M.nodes.get(b.b).x - M.nodes.get(a.b).x));
  segs.forEach((sg) => {
    const a = at(sg.a), b = at(sg.b);
    if (sg.role === 'drop') {
      const h = M.nodes.get(sg.b), t = at(sg.a), on = op.has(sg.b);
      const dr = n.dropOn, up = dr ? Math.max(10, n0(sg.rise) * s) : 0, dn = dr ? Math.max(20, n0(sg.fall) * s + 8) : 16, ov = dr ? Math.max(10, n0(n.over) * s) * h.dir : 0;
      const p1 = [t[0], t[1] - up], p2 = [t[0] + ov, t[1] - up], p3 = [t[0] + ov, t[1] - up + dn];
      const path = dr ? `${t.join(',')} ${p1.join(',')} ${p2.join(',')} ${p3.join(',')}` : `${t.join(',')} ${p3.join(',')}`;
      drops += `<polyline class="${cls(sg)} r-drop" points="${path}"/>`;
      const gov = R && R.gov === sg.b, hs = sel.t === 'head' && sel.id === sg.b;
      drops += `<path class="nt-hd${on ? ' on' : ''}${hs ? ' sel' : ''}" d="M${p3[0] - 6},${p3[1]} h12 l-6,9 z"/><line class="nt-hdl" x1="${p3[0] - 6}" y1="${p3[1] + 10}" x2="${p3[0] + 6}" y2="${p3[1] + 10}"/>`;
      if (gov) drops += `<circle class="nt-gov" cx="${p3[0]}" cy="${p3[1] + 4}" r="11"/>`;
      labels += `<text class="nt-hn${on ? ' on' : ''}" x="${p3[0] + 9}" y="${p3[1] - 2}">${h.label}</text>`;

/* 옥내소화전: 펌프 → 수직배관(층마다) → 방수구(앵글밸브) → 호스 → 노즐, 입면 */
function netBuildIN(n, ctx) {
  const M = netModel('in');
  const f = n.follow && ctx;
  const nf = Math.max(1, Math.min(60, Math.round(f && ctx.nf > 0 ? ctx.nf : n.nf) || 1));
  const m = Math.max(1, Math.min(5, Math.round(f && ctx.per > 0 ? ctx.per : n.perFloor) || 1));
  const reel = !!(ctx && ctx.reel), pp = STD.indoor.pipe;
  const rs = reel ? pp.riserReel : pp.riser, bsz = reel ? pp.branchReel : pp.branch;
  const FH = n.FH > 0 ? n.FH : 3, oh = n0(n.outH), pz = n0(n.pumpZ);
  M.geo = { nf, m, FH, oh, pz };
  nAdd(M, 'P', { x: 0, z: pz, label: '펌프' });
  let prev = 'P';
  for (let k = 1; k <= nf; k++) {
    const z = (k - 1) * FH + oh, N = `N${k}`, top = k === nf;
    nAdd(M, N, { x: 0, z, floor: k });
    sAdd(M, n, `r${k}`, prev, N, k === 1
      ? { L: r2(n0(n.pumpL) + Math.abs(z - pz)), size: rs, fit: { elbow: n0(n.pumpL) > 0 ? 1 : 0 }, role: 'riser', label: '수직배관 (펌프 → 1층 방수구)' }
      : { L: r2(FH), size: rs, fit: { teeR: 1 }, role: 'riser', label: `수직배관 ${k - 1}층 → ${k}층` });
    prev = N;
    let hp = N;
    for (let i = 1; i <= m; i++) {
      if (i > 1) {
        const F = `F${k}_${i}`;
        nAdd(M, F, { x: i - 1, z, floor: k });
        sAdd(M, n, `h${k}_${i}`, hp, F, { L: r2(n0(n.out2L)), size: rs, fit: i === 2 ? { teeB: 1 } : { teeR: 1 }, role: 'floor', col: i, label: `${k}층 수평배관 → ${i}번째 방수구` });
        hp = F;
      }
      const O = `O${k}_${i}`, Z = `Z${k}_${i}`, nm = `${k}층${m > 1 ? ' ' + i + '번' : ''}`;
      nAdd(M, O, { x: i - 1, z, floor: k });
      sAdd(M, n, `o${k}_${i}`, hp, O, { L: r2(n0(n.outL)), size: bsz, fit: { ...(top && i === m ? { elbow: 1 } : { teeB: 1 }), angle: 1 }, role: 'outlet', col: i, label: `${nm} 방수구 연결 배관` });
      nAdd(M, Z, { x: i - 1, z, floor: k, leaf: true, label: nm });
      sAdd(M, n, `z${k}_${i}`, O, Z, { L: n0(n.hoseLen), size: bsz, fit: {}, role: 'hose', hose: true, col: i, label: `${nm} 호스` });
    }
  }
  return M;
}
const netBuild = (n, ctx) => (n.kind === 'pt' ? netBuildPT(n) : netBuildIN(n, ctx));

// 펌프에서 먼 순서 (옥내소화전은 높은 층 먼저)
function netRemote(M) {
  const d = new Map([[M.root, 0]]);
  M.segs.forEach((s) => d.set(s.b, d.get(s.a) + n0(s.L)));
  if (M.kind === 'in') M.leaves.forEach((id) => d.set(id, M.nodes.get(id).z * 1e4 + d.get(id)));
  return d;
}
function netOpen(M, n, nBase) {
  const far = netRemote(M);
  const order = M.kind === 'pt' ? M.leaves.slice().sort((a, b) => M.nodes.get(a).rank - M.nodes.get(b).rank) : M.leaves.slice().sort((a, b) => far.get(b) - far.get(a));
  if (n.openMode === 'line') { const L = Math.max(...order.map((id) => M.nodes.get(id).line)); return order.filter((id) => M.nodes.get(id).line === L); }
  if (n.openMode === 'custom') return order.filter((id) => n.openSet[id]);
  if (n.openMode === 'all') return order;
  if (n.openMode === 'last') return order.slice(0, 1);
  return order.slice(0, Math.max(1, Math.min(order.length, Math.round(nBase) || 1)));
}

function netLoss(s, Q, n, k) {
  if (s.hose) {
    const hm = n.hoseOn && Q > 0 ? n0(n.hoseLen) * n0(n.hoseRate) / 100 * Math.pow(Q / 130, 1.85) : 0;
    return { hm, hf: hm / k, Le: 0, d: NaN, vel: NaN, parts: [] };
  }
  const d = n.dia === 'spp' ? (FR.idSPP[s.size] || s.size) : n.dia === 'table' ? (n0(n.idT && n.idT[s.size]) || s.size) : s.size, ix = fIdx(s.size);
  const parts = Object.keys(FR.types).filter((t) => n.fitOn[t] && s.fit[t] > 0).map((t) => [t, s.fit[t], ix >= 0 ? n0(n.fitLe[t][ix]) : 0]);
  const Le = parts.reduce((a, [, c, le]) => a + c * le, 0);
  const perM = !(Q > 0) ? 0 : n.formula === 'sq' ? 6e4 * Q * Q / (120 * 120 * Math.pow(d, 5)) : 6.053e4 * Math.pow(Q, 1.85) / (Math.pow(n0(n.C), 1.85) * Math.pow(d, 4.87));
  const hf = perM * (n0(s.L) + Le);
  return { hf, hm: hf * k, Le, d, perM, vel: Q / 60000 / (Math.PI / 4 * (d / 1000) ** 2), parts };
}

// 방출계수 K: 기준 방수량·방수압으로 구하거나, 직접 넣거나, 노즐 구경으로
const netK = (n) => (n.kMode === 'k' ? n0(n.K) : n.kMode === 'd' ? 0.653 * n0(n.nozD) ** 2 : n0(n.qS) / Math.sqrt(10 * n0(n.Pmin)));
function netSolve(M, n, open) {
  const k = STD.headPerMPa[n.conv] || STD.headPerMPa.std, simple = n.mode === 'simple', fixed = n.basis === 'start';
  const K = netK(n), Pmin = n0(n.Pmin);
  const q = new Map(open.map((id) => [id, simple ? n0(n.qS) : K * Math.sqrt(10 * Pmin)]));
  const Q = new Map(), loss = new Map(), rel = new Map();
  let Proot = NaN, gov = open[0], ok = true, it = 0;
  const pass = () => {
    for (let i = M.segs.length - 1; i >= 0; i--) {
      const s = M.segs[i];
      Q.set(s.id, (q.get(s.b) || 0) + M.nodes.get(s.b).kids.reduce((a, c) => a + Q.get(c), 0));
    }
    rel.set(M.root, 0);
    M.segs.forEach((s) => {
      const L = netLoss(s, Q.get(s.id), n, k);
      loss.set(s.id, L);
      rel.set(s.b, rel.get(s.a) - L.hf - (M.nodes.get(s.b).z - M.nodes.get(s.a).z) / k);
    });
    if (fixed) { Proot = n0(n.Pstart); gov = open.reduce((a, id) => (rel.get(id) < rel.get(a) ? id : a), open[0]); }
    else { Proot = -Infinity; open.forEach((id) => { const need = Pmin - rel.get(id); if (need > Proot) { Proot = need; gov = id; } }); }
  };
  pass();
  if (!simple) {
    for (it = 1; it <= 500; it++) {
      let dmax = 0;
      open.forEach((id) => {
        const P = Math.max(0, Proot + rel.get(id)), nq = 0.5 * q.get(id) + 0.5 * K * Math.sqrt(10 * P);
        dmax = Math.max(dmax, Math.abs(nq - q.get(id))); q.set(id, nq);
      });
      pass();
      if (dmax < 1e-7) break;
    }
    if (it > 500) ok = false;
  }
  const P = new Map([...rel].map(([id, r]) => [id, Proot + r]));
  const path = [];
  for (let id = gov; id !== M.root;) { const s = M.segById.get(M.nodes.get(id).up); path.unshift(s); id = s.a; }
  const zP = M.nodes.get(M.root).z;
  const zw = n.tankOn ? (n.tankPos === 'above' ? n0(n.tankH) : -n0(n.tankH)) : 0;   // 펌프 기준
  const zg = M.nodes.get(gov).z - zP;
  const h2pipe = path.reduce((a, s) => a + loss.get(s.id).hm, 0);
  const h1 = zg - zw, h2 = h2pipe + n0(n.sucLoss), h3 = Pmin * k;
  return { ok, Q, q, loss, P, Proot, gov, path, zg, zw, h1, h2, h2pipe, h3, H: h1 + h2 + h3, flow: open.reduce((a, id) => a + q.get(id), 0), k };
}

function netRun(v, kind, ctx) {
  if (kind === 'pt') ptSync(v);
  else if (!v.net || v.net.kind !== kind) v.net = netDefaults(kind);
  v._netctx = ctx;
  const n = v.net, M = netBuild(n, ctx);
  const nBase = ctx.nBase > 0 ? ctx.nBase : (kind === 'sp' ? 10 : 2);
  const open = netOpen(M, n, nBase);
  const u = kind === 'in' ? '노즐' : '헤드';
  let err = '';
  if (!open.length) err = `열린 ${u}가 없어요. 도면에서 ${u}를 골라 열어 주세요.`;
  else if (n.basis === 'start' && !(n.Pstart > 0)) err = '시작점 압력에 0보다 큰 값을 넣어 주세요.';
  else if (!(n.Pmin > 0) && !(n.basis === 'start' && n.mode === 'simple')) err = '헤드 기준 방수압에 0보다 큰 값을 넣어 주세요.';
  else if ((n.mode === 'simple' || n.kMode === 'qp') && !(n.qS > 0)) err = `기준 방수량에 0보다 큰 값을 넣어 주세요.`;
  else if (n.mode !== 'simple' && n.kMode === 'k' && !(n.K > 0)) err = '방출계수 K에 0보다 큰 값을 넣어 주세요.';
  else if (n.mode !== 'simple' && n.kMode === 'd' && !(n.nozD > 0)) err = '노즐 구경에 0보다 큰 값을 넣어 주세요.';
  else if (n.formula !== 'sq' && !(n.C > 0)) err = '조도계수 C에 0보다 큰 값을 넣어 주세요.';
  return { n, M, open, nBase, err, R: err ? null : netSolve(M, n, open) };
}

/* 결과 카드 */
function netCard(v, kind, ctx) {
  const X = netRun(v, kind, ctx), { n, M, open, R } = X;
  const title = '배관 수리계산 (도면)', u = kind === 'sp' ? '헤드' : '노즐';
  const btn = `<p class="net-open"><button type="button" class="btn-act" data-act="net">도면 열어서 고치기</button></p>`;
  if (X.err) return { title, error: X.err, extraTop: btn };
  const pw = power(R.flow, R.H, v[ctx.pre + '_eta'], v[ctx.pre + '_k']);
  const k = R.k, simple = n.mode === 'simple';
  const no = new Map(open.map((id, i) => [id, i + 1]));
  const name = (id) => `${M.nodes.get(id).label}`;
  const steps = [];
  const presetTxt = { base: `기준개수 ${open.length}개 (펌프에서 먼 ${u}부터)`, last: `최말단 ${u} 1개`, all: `모든 ${u}`, custom: '도면에서 직접 고름' }[n.openMode];
  steps.push(step({ t: kind === 'sp' ? '동시 개방 헤드' : '동시 개방 노즐', sub: presetTxt, ans: `${open.length}개` }));
  if (simple) steps.push(step({ t: '헤드 방수량', sub: `열린 ${u} 모두 같은 방수량으로 봤어요 (간단 계산)`, ans: `${fx(n.qS)} L/min` }));
  else {
    const show = open.slice(0, 6), K = netK(n);
    if (n.kMode === 'qp') steps.push(step({ t: '방출계수 K', f: 'K = Q ÷ √(10P)', sym: [['K', '방출계수'], ['Q', `기준 방수량 (L/min)`], ['P', '최소 방수압 (MPa)']], sub: `K = ${fx(n.qS)} ÷ √(10 × ${fx(n.Pmin)})`, ans: fx(K) }));
    else if (n.kMode === 'd') steps.push(step({ t: '방출계수 K', f: 'K = 0.653 × d²', sym: [['K', '방출계수'], ['0.653', '0.6597 × 유량계수 0.99'], ['d', '노즐 구경 (mm)']], sub: `K = 0.653 × ${fx(n.nozD)}²`, ans: fx(K) }));
    else steps.push(step({ t: '방출계수 K', sub: '직접 넣은 값', ans: fx(K) }));
    steps.push(step({
      t: '헤드 방수량', f: 'Q = K × √(10P)',
      sym: [['Q', `${u} 방수량 (L/min)`], ['K', `방출계수 (${fx(K)})`], ['P', `${u} 방수압 (MPa)`]],
      sub: show.map((id) => `${no.get(id)}번 (${name(id)}): Q = ${fx(K)} × √(10 × ${fx(R.P.get(id), 4)}) = ${fx(R.q.get(id))}`).join('<br>') + (open.length > 6 ? `<br>나머지 ${open.length - 6}개는 아래 표에 있어요` : ''),
      note: `압력이 가장 낮은 ${u}(${name(R.gov)})가 최소 방수압 ${fx(n.Pmin)} MPa가 되게 맞추고, 나머지 ${u}는 배관을 따라 걸리는 압력으로 방수량을 구했어요.`,
    }));
  }
  steps.push(step({ t: '펌프 토출량', f: 'Q<sub>p</sub> = ΣQ<sub>i</sub>', sym: [['Q<sub>p</sub>', '펌프 토출량 (L/min)'], ['Q<sub>i</sub>', `열린 ${u}마다 방수량 (L/min)`]], sub: `Q<sub>p</sub> = ${open.length <= 8 ? open.map((id) => fx(R.q.get(id))).join(' + ') : `${open.length}개 방수량의 합`}`, ans: `${fx(R.flow)} L/min` }));
  const pipes = R.path.filter((s) => !s.hose && R.loss.get(s.id).hf > 0);
  const ex = pipes[pipes.length - 1];
  if (ex) {
    const L = R.loss.get(ex.id), Qe = R.Q.get(ex.id);
    steps.push(step({
      t: '하젠-윌리엄스 식', f: 'ΔP = 6.053 × 10⁴ × Q<sup>1.85</sup> ÷ (C<sup>1.85</sup> × d<sup>4.87</sup>) × (L + L<sub>e</sub>)',
      sym: [['ΔP', '마찰손실 압력 (MPa)'], ['Q', '그 구간 유량 (L/min)'], ['C', '조도계수'], ['d', '배관 안지름 (mm)'], ['L', '직관 길이 (m)'], ['L<sub>e</sub>', '관부속 상당길이 합 (m)']],
      sub: `예) ${ex.label}<br>ΔP = 6.053 × 10⁴ × ${fx(Qe)}<sup>1.85</sup> ÷ (${fx(n.C)}<sup>1.85</sup> × ${fx(L.d)}<sup>4.87</sup>) × (${fx(ex.L)} + ${fx(L.Le)}) = ${fx(L.hf, 5)} MPa<br>수두로: ${fx(L.hf, 5)} × ${fx(k)}`,
      ans: `${fx(L.hm, 3)} m`, note: '다른 구간도 같은 식으로 구했어요. 구간별 값은 아래 표에 있어요.',
    }));
  }
  const parts = R.path.filter((s) => R.loss.get(s.id).hm > 0);
  steps.push(step({
    t: '마찰손실 h₂', f: 'h₂ = Σh<sub>f</sub>' + (n0(n.sucLoss) > 0 ? ' + h<sub>s</sub>' : ''),
    sym: [['h₂', '마찰손실양정 (m)'], ['h<sub>f</sub>', `펌프에서 최말단 ${u}까지 구간별 마찰손실수두 (m)${kind === 'in' && n.hoseOn ? ', 호스 포함' : ''}`], ...(n0(n.sucLoss) > 0 ? [['h<sub>s</sub>', '흡입측 마찰손실 (m)']] : [])],
    sub: `h₂ = ${parts.length && parts.length <= 10 ? parts.map((s) => fx(R.loss.get(s.id).hm, 3)).join(' + ') : `${parts.length}개 구간의 합 ${fx(R.h2pipe, 3)}`}${n0(n.sucLoss) > 0 ? ` + ${fx(n.sucLoss)}` : ''}`, ans: `${fx(R.h2)} m`,
  }));
  steps.push(step({ t: '실양정 h₁', f: 'h₁ = z<sub>h</sub> − z<sub>w</sub>', sym: [['h₁', '실양정 (m)'], ['z<sub>h</sub>', `최말단 ${u} 높이 (펌프 = 0, m)`], ['z<sub>w</sub>', n.tankOn ? '수조 수면 높이 (펌프 = 0, 아래면 −, m)' : '물을 빨아들이는 높이 = 펌프 (0 m)']], sub: `h₁ = ${fx(R.zg)} − (${fx(R.zw)})`, ans: `${fx(R.h1)} m` }));
  steps.push(step({ t: '방사압 환산수두 h₃', f: 'h₃ = P × k', sym: [['h₃', '최말단 방사압 환산수두 (m)'], ['P', `최말단 ${u} 방수압 (MPa)`], ['k', n.conv === 'std' ? `1 MPa = ${fx(k)} m (표준대기압 0.101325 MPa = 10.332 m)` : '1 MPa = 100 m (간략)']], sub: `h₃ = ${fx(n.Pmin)} × ${fx(k)}`, ans: `${fx(R.h3)} m` }));
  steps.push(step({ t: '전양정', f: 'H = h₁ + h₂ + h₃', sym: [['H', '전양정 (m)'], ['h₁', '실양정 (m)'], ['h₂', '마찰손실양정 (m)'], ['h₃', '방사압 환산수두 (m)']], sub: `H = ${fx(R.h1)} + ${fx(R.h2)} + ${fx(R.h3)}`, ans: `${fx(R.H)} m` }));
  steps.push(...pw.steps);

  const fitTxt = (s) => R.loss.get(s.id).parts.map(([t, c]) => `${FR.types[t][0]} ${c}`).join(', ');
  const segRow = (s) => {
    const L = R.loss.get(s.id), Q = R.Q.get(s.id);
    if (s.hose) return [s.label, '호스', fx(Q), '-', fx(n.hoseLen), '-', fx(L.hm, 3)];
    return [s.label, `φ${s.size}`, fx(Q), fx(L.vel), fx(s.L), L.Le ? `${fx(L.Le)}<br><small class="muted">${fitTxt(s)}</small>` : '0', fx(L.hm, 3)];
  };
  const head = ['구간', '구경', '유량 (L/min)', '유속 (m/s)', '직관 (m)', '상당길이 (m)', '마찰손실 (m)'];
  const onPath = new Set(R.path.map((s) => s.id));
  const shown = (s) => !s.hose || n.hoseOn;
  const big = M.segs.filter((s) => !s.hose && R.Q.get(s.id) > 0 && fIdx(s.size) < 0 && Object.keys(FR.types).some((t) => n.fitOn[t] && s.fit[t] > 0));
  const others = M.segs.filter((s) => !onPath.has(s.id) && R.Q.get(s.id) > 0 && shown(s));
  const vlim = (s) => (kind === 'sp' ? (s.role === 'branch' ? 6 : s.role === 'drop' ? 0 : 10) : (s.role === 'riser' || s.role === 'floor' ? 4 : 0));
  const fast = M.segs.filter((s) => !s.hose && vlim(s) && R.loss.get(s.id).vel > vlim(s));
  const off = Object.keys(FR.types).filter((t) => !n.fitOn[t]).map((t) => FR.types[t][0]);
  const warns = [pw.warn];
  if (big.length) warns.push(`관부속 상당길이 표에 없는 구경 구간 ${big.length}개는 관부속을 빼고 직관 길이만 계산했어요.`);
  if (!R.ok) warns.push('방수량 계산이 끝까지 맞춰지지 않았어요. 배관 구경이나 길이를 확인해 주세요.');
  if (fast.length) warns.push(`유속이 기준(${kind === 'sp' ? '가지배관 6 m/s 이하, 그 밖 10 m/s 이하' : '펌프 토출측 주배관 4 m/s 이하'})보다 빠른 구간: ${fast.slice(0, 3).map((s) => `${s.label} ${fx(R.loss.get(s.id).vel)} m/s`).join(', ')}${fast.length > 3 ? ` 외 ${fast.length - 3}개` : ''}. 구경을 키워 보세요.`);
  const legend = kind === 'sp'
    ? '<div class="legend"><span><i class="lg-riser"></i>수직배관</span><span><i class="lg-cross"></i>교차배관</span><span><i class="lg-branch"></i>가지배관</span><span><i class="lg-open"></i>열린 헤드 (번호: 펌프에서 먼 순서)</span><span><i class="lg-head"></i>닫힌 헤드</span><span><i class="lg-gov"></i>압력이 가장 낮은 헤드</span></div>'
    : '<div class="legend"><span><i class="lg-riser"></i>수직배관</span><span><i class="lg-branch"></i>방수구 배관</span><span><i class="lg-open"></i>열린 노즐</span><span><i class="lg-head"></i>닫힌 노즐</span><span><i class="lg-gov"></i>압력이 가장 낮은 노즐</span></div>';
  return {
    title, badge: simple ? `간단: 모두 ${fx(n.qS)} L/min` : `정밀: Q = K√(10P), K = ${fx(netK(n))}`,
    tiles: [
      ...pumpTiles(R.flow, { H: R.H, ...pw }),
      { l: '펌프 토출압력', v: fx(R.Proot, 3), u: 'MPa' },
      { l: '실양정 h₁', v: fx(R.h1), u: 'm' }, { l: '마찰손실 h₂', v: fx(R.h2), u: 'm' }, { l: '방사압 환산수두 h₃', v: fx(R.h3), u: 'm' },
      { l: kind === 'sp' ? '개방 헤드' : '개방 노즐', v: fx(open.length), u: '개' },
    ],
    warns: warns.filter(Boolean),
    extraTop: `<div class="drawing net-fig">${netSVG(M, R, n, open, {})}</div>${legend}${btn}`,
    notes: [
      `조도계수 C = ${fx(n.C)}, 안지름은 ${n.dia === 'spp' ? '배관용 탄소강관(SPP) 안지름' : '호칭경 그대로'}, 1 MPa = ${fx(k)} m${off.length ? `, 계산에서 뺀 관부속: ${off.join('·')}` : ''}${kind === 'in' ? (n.hoseOn ? `, 호스 ${fx(n.hoseLen)} m × 100 m당 ${fx(n.hoseRate)} m (130 L/min 기준, 유량의 1.85제곱에 비례)` : ', 호스 마찰손실은 넣지 않았어요 (도면 화면에서 체크하면 넣어요)') : ''}`,
      '관부속 상당길이는 흔히 쓰는 표 값을 기본으로 넣었어요. 문제에 값이 주어지면 도면 화면의 마찰손실 설정에서 고쳐 쓰세요.',
    ],
    steps,
    extra: `<div><h4 class="sub-h">열린 ${u} (1번이 펌프에서 가장 먼 ${u}${kind === 'sp' ? ', 이름은 행-열' : ''})</h4>${table(['번호', u, '방수압 (MPa)', '방수량 (L/min)'], open.map((id) => [no.get(id), name(id) + (id === R.gov ? ' · 압력 최저' : ''), fx(R.P.get(id), 4), fx(R.q.get(id))]))}</div>
      <div><h4 class="sub-h">펌프 → 압력이 가장 낮은 ${u}까지 구간</h4>${table(head, [...R.path.filter(shown).map(segRow), ['합계', '', '', '', '', '', `<b>${fx(R.h2pipe, 3)}</b>`]])}</div>
      ${others.length ? `<details class="more"><summary>나머지 구간 ${others.length}개</summary>${table(head, others.map(segRow))}</details>` : ''}`,
  };
}

/* 도면 SVG */
const netSVG = (M, R, n, open, o) => (M.kind === 'pt' ? netSvgPT(M, R, n, open, o) : netSvgIN(M, R, n, open, o));
function netSvgIN(M, R, n, open, o) {
  const g = M.geo, sel = o.sel || {}, op = new Set(open), no = new Map(open.map((id, i) => [id, i + 1]));
  const zw = n.tankOn ? g.pz + (n.tankPos === 'above' ? n0(n.tankH) : -n0(n.tankH)) : g.pz;
  const zTop = (g.nf - 1) * g.FH + Math.max(g.oh, 0) + Math.max(1.4, g.FH * 0.6), zBot = Math.min(0, g.pz, zw) - 1;
  const s = Math.min(34, 470 / (zTop - zBot));
  const colW = 180, x0 = 160, VW = x0 + (g.m - 1) * colW + 190, VH = +((zTop - zBot) * s + 34).toFixed(1);
  const Y = (z) => +(16 + (zTop - z) * s).toFixed(1);
  const xj = (i) => x0 + (i - 1) * colW, xo = (i) => xj(i) + 56, xz = (i) => xo(i) + 92, pX = x0 - 76;
  let out = '', hits = '', labels = '';
  const every = g.FH * s >= 16 ? 1 : Math.ceil(16 / (g.FH * s));
  for (let k = 1; k <= g.nf; k++) {
    const y = Y((k - 1) * g.FH);
    out += `<line class="nt-fl" x1="8" y1="${y}" x2="${VW - 8}" y2="${y}"/>`;
    if (k === 1 || k === g.nf || k % every === 0) labels += `<text class="nt-fn" x="12" y="${y - 4}">${k}층</text>`;
  }
  const P = (pts) => pts.map((p) => p.join(',')).join(' ');
  M.segs.forEach((sg) => {
    const a = M.nodes.get(sg.a), b = M.nodes.get(sg.b);
    let pts;
    if (sg.role === 'riser') pts = sg.a === 'P' ? [[pX + 13, Y(a.z)], [x0, Y(a.z)], [x0, Y(b.z)]] : [[x0, Y(a.z)], [x0, Y(b.z)]];
    else if (sg.role === 'floor') pts = [[xj(sg.col - 1), Y(a.z)], [xj(sg.col - 1), Y(a.z) - 12], [xj(sg.col), Y(a.z) - 12], [xj(sg.col), Y(b.z)]];
    else if (sg.role === 'outlet') pts = [[xj(sg.col), Y(b.z)], [xo(sg.col), Y(b.z)]];
    else pts = [[xo(sg.col) + 14, Y(b.z)], [xz(sg.col) - 7, Y(b.z)]];
    const cls = sg.hose ? `nt-hose${R && R.Q.get(sg.id) > 0 ? '' : ' dry'}${sel.t === 'seg' && sel.id === sg.id ? ' sel' : ''}` : `nt-p r-${sg.role}${R && R.Q.get(sg.id) > 0 ? '' : ' dry'}${sg.edited ? ' ed' : ''}${sel.t === 'seg' && sel.id === sg.id ? ' sel' : ''}`;
    out += `<polyline class="${cls}" points="${P(pts)}"/>`;
    if (o.edit) hits += `<polyline class="nt-hit" data-seg="${sg.id}" points="${P(pts)}"><title>${sg.label}${sg.hose ? '' : ` · φ${sg.size}`} · ${fx(sg.L)} m</title></polyline>`;
    const ln = Math.abs(pts[pts.length - 1][1] - pts[0][1]) + Math.abs(pts[pts.length - 1][0] - pts[0][0]);
    if (sg.role === 'riser' && ln >= 24) labels += `<text class="nt-lb" x="${x0 - 6}" y="${(Y(a.z) + Y(b.z)) / 2 + 3}" text-anchor="end">φ${sg.size}</text>`;
    if (sg.role === 'outlet') labels += `<text class="nt-lb" x="${(xj(sg.col) + xo(sg.col)) / 2}" y="${Y(b.z) + 14}" text-anchor="middle">φ${sg.size}</text>`;
    if (sg.role === 'outlet') out += `<rect class="nt-cab" x="${xo(sg.col)}" y="${Y(b.z) - 13}" width="14" height="24" rx="2"/>`;
  });
  M.leaves.forEach((id) => {
    const h = M.nodes.get(id), i = h.x + 1, cx = xz(i), cy = Y(h.z), on = op.has(id), gov = R && R.gov === id;
    out += `<circle class="nt-h${on ? ' on' : ''}${sel.t === 'head' && sel.id === id ? ' sel' : ''}" cx="${cx}" cy="${cy}" r="6"/>`;

document.addEventListener('pointermove', (e) => {

  if (!r) return;
  const nx = Math.max(0, Math.min(LKW - r.w, lkSnap(px - LK.drag.dx))), ny = Math.max(0, Math.min(LKH - r.h, lkSnap(py - LK.drag.dy)));

document.addEventListener('pointerup', () => { if (!LK.drag) return; if (LK.drag.moved) { LK.hist.push(LK.drag.snap); } LK.drag = null; });
document.addEventListener('click', (e) => {

document.addEventListener('input', (e) => {

document.addEventListener('change', (e) => {

document.addEventListener('keydown', (e) => {
  if (!$('#lk') || $('#lk').hidden) return;
  if (e.target.closest('input, select')) { if (e.key === 'Escape') e.target.blur(); return; }

});

/* ⑩ 사용자가 무언가 하면 */
$('#targets').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t], button[data-m]');
  if (!b) return;
  if (b.dataset.m) { const m = MENUS.find((x) => x.id === b.dataset.m); curMenu = m.id; current = lastIn[m.id] || m.items[0]; }
  else current = b.dataset.t;
  showTab(false);
  renderTargets(); renderInputs(); renderResults();
});
$('#form').addEventListener('input', (e) => {
  const k = e.target.dataset.k;
  if (!k || e.target.type !== 'number') return;
  state[current][k] = e.target.value === '' ? null : Number(e.target.value);
  if (k === 'sm_A' || k === 'sm_D') cur().sm_fromPlan = false;
  renderResults();
});
function fixHalon(k) {
  // 할론 종류를 바꿨는데 고른 방호대상에 그 약제 기준값이 없으면, 기준값이 있는 첫 방호대상으로 바꿔요
  if (k === 'halonType' && cur().agent === 'halon') {
    const g = cur(), K = STD.halon.kinds;
    if (!K[g.halonKind][1][g.halonType]) g.halonKind = Object.keys(K).find((x) => K[x][1][g.halonType]);
  }
}
// 선택란·칩에서 고른 값 넣기: 입력칸을 다시 그리고, 고른 칸에 포커스를 돌려줘요
function setField(k, val) {
  state[current][k] = val;
  fixHalon(k);
  renderInputs(); renderResults();
  const el = document.getElementById('f_' + k);
  const f = el && (el.dataset.cs ? el : el.querySelector(`[aria-checked="true"]`));
  if (f) f.focus({ preventScroll: true });
}
$('#form').addEventListener('change', (e) => {
  const k = e.target.dataset.k;
  if (k && e.target.type === 'number') { if (layoutKey() !== lastLK) { renderInputs(); renderResults(); } return; }
  if (!k) return;
  const before = layoutKey();
  state[current][k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  fixHalon(k);
  if (layoutKey() !== before) renderInputs();
  renderResults();
});
$('#form').addEventListener('click', (e) => {
  const c = e.target.closest('.chip[data-chip]');
  if (c) { if (c.getAttribute('aria-checked') !== 'true') setField(c.dataset.chip, c.dataset.v); return; }
  const b = e.target.closest('.cs-btn');
  if (b) { if (CS.btn === b) csClose(false); else csOpen(b); }
});
$('#form').addEventListener('keydown', (e) => {
  const b = e.target.closest('.cs-btn');
  if (b) {
    const open = CS.btn === b;
    if (!open && ['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); csOpen(b); return; }
    if (open) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); CS.act = Math.max(0, Math.min(CS.opts.length - 1, CS.act + (e.key === 'ArrowDown' ? 1 : -1))); csHi(); }
      else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); CS.act = e.key === 'Home' ? 0 : CS.opts.length - 1; csHi(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); csPick(CS.act); }
      else if (e.key === 'Escape') { e.preventDefault(); csClose(true); }
      else if (e.key === 'Tab') csClose(false);
    }
    return;
  }
  const c = e.target.closest('.chip[data-chip]');
  if (c && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const all = [...c.parentNode.querySelectorAll('.chip')], i = all.indexOf(c), n = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
    setField(n.dataset.chip, n.dataset.v);
  }
});
/* 직접 만든 선택 목록 (기본 선택 목록 대신) */
const CS = { btn: null, k: null, opts: [], act: -1 };
const fieldOf = (k) => { for (const s of target().sections) { const f = s.fields.find((x) => x.id === k); if (f) return f; } return null; };
function csOpen(btn) {
  if (CS.btn) csClose(false);
  const k = btn.dataset.cs, f = fieldOf(k);
  if (!f) return;
  let pop = $('#cs-pop');
  if (!pop) { document.body.insertAdjacentHTML('beforeend', '<div class="cs-pop" id="cs-pop" role="listbox" hidden></div>'); pop = $('#cs-pop'); }
  CS.opts = optsOf(f); CS.btn = btn; CS.k = k;
  const v = String(state[current][k]);
  CS.act = Math.max(0, CS.opts.findIndex(([x]) => String(x) === v));
  pop.setAttribute('aria-label', plain(f.label));
  pop.innerHTML = CS.opts.map(([x, l], i) => `<div class="cs-opt${String(x) === v ? ' sel' : ''}" role="option" id="cs-o${i}" data-i="${i}" aria-selected="${String(x) === v}"><span>${l}</span><svg class="cs-ck" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg></div>`).join('');
  pop.hidden = false;
  csPlace(btn, true);
  pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show');
  btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-controls', 'cs-pop');
  csHi();
}
// 목록 위치: 칸 바로 아래 (아래 자리가 모자라면 위)
function csPlace(btn, first) {
  const pop = $('#cs-pop'), r = btn.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  if (r.bottom < 0 || r.top > vh) { csClose(false); return; }
  const w = Math.min(Math.max(r.width, 240), vw - 16), left = Math.max(8, Math.min(r.left, vw - w - 8));
  pop.style.width = w + 'px'; pop.style.left = left + 'px';
  const below = vh - r.bottom - 12, above = r.top - 12;
  if (first) CS.up = below < 220 && above > below;
  pop.style.maxHeight = Math.max(160, Math.min(360, CS.up ? above : below)) + 'px';
  pop.classList.toggle('up', CS.up);
  pop.style.top = CS.up ? '' : (r.bottom + 6) + 'px';
  pop.style.bottom = CS.up ? (vh - r.top + 6) + 'px' : '';
}
function csHi() {
  const pop = $('#cs-pop');
  pop.querySelectorAll('.cs-opt').forEach((o, i) => o.classList.toggle('act', i === CS.act));
  const a = pop.querySelector('.cs-opt.act');
  if (a) {
    if (a.offsetTop < pop.scrollTop) pop.scrollTop = a.offsetTop - 6;
    else if (a.offsetTop + a.offsetHeight > pop.scrollTop + pop.clientHeight) pop.scrollTop = a.offsetTop + a.offsetHeight - pop.clientHeight + 6;

}
function csClose(focus) {

}
function csPick(i) {
  const k = CS.k, o = CS.opts[i];

  if (k && o && String(state[current][k]) !== String(o[0])) setField(k, typeof o[0] === 'number' ? o[0] : String(o[0]));
}
document.addEventListener('click', (e) => {
  const o = e.target.closest('#cs-pop .cs-opt');

});
document.addEventListener('mousemove', (e) => { const o = e.target.closest && e.target.closest('#cs-pop .cs-opt'); if (o && +o.dataset.i !== CS.act) { CS.act = +o.dataset.i; csHi(); } });
window.addEventListener('resize', () => { if (CS.btn) csPlace(CS.btn); });
document.addEventListener('scroll', (e) => { if (CS.btn && !(e.target.closest && e.target.closest('#cs-pop'))) csPlace(CS.btn); }, true);
$('#results').addEventListener('click', (e) => {
