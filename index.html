/* =========================================================
   ④ 계산 — 건축물
   ========================================================= */
function roofTank(v, isHigh) {
  const ex = [];
  // 고층건축물(NFTC 604)은 고가수조 방식, 수원이 최상층 방수구보다 높은 경우만 제외
  if (v.rt_elevated) ex.push('고가수조를 가압송수장치로 설치');
  if (v.rt_above) ex.push('수원이 최상층 방수구보다 높음');
  if (!isHigh) {
    if (v.rt_basement) ex.push('지하층만 있는 건축물');
    if (n0(v.height) > 0 && v.height <= 10) ex.push('건축물 높이 10m 이하');
    if (v.rt_backup) ex.push('주펌프와 동등 이상의 별도 펌프');
    if (v.rt_pressure) ex.push('가압수조를 가압송수장치로 설치');
    if (v.rt_freeze) ex.push('학교·공장·창고시설 동결 우려 (기동스위치 보호판)');
  }
  return { need: ex.length === 0, ex };
}

function indoorGrid(L, W, D2) {
  let best = null;
  for (let nx = 1; nx <= 500; nx++) {
    const a = L / nx;
    if (a >= D2) continue;
    const ny = up(W / Math.sqrt(D2 ** 2 - a ** 2));
    const n = nx * ny;
    if (!best || n < best.n) best = { nx, ny, n, a, b: W / ny };
    if (a < D2 / 10) break;
  }
  return best;
}

function spBase(v) {
  const b = STD.sp.base;
  if (v.use === 'apt') return { n: b.apt, why: '아파트 (공동주택)' };
  if (v.use === 'underground') return { n: b.high, why: '지하가·지하역사' };
  if (v.fa >= 11) return { n: b.high, why: '지하층을 제외한 층수가 11층 이상' };
  switch (v.use) {
    case 'factorySpecial': return { n: b.factorySpecial, why: '10층 이하 공장 (특수가연물 저장·취급)' };
    case 'factory': return { n: b.factory, why: '10층 이하 공장 (그 밖)' };
    case 'sales': case 'mixedSales': return { n: b.sales, why: '10층 이하 판매시설 또는 판매시설이 있는 복합건축물' };
    case 'neighborhood': case 'transport': case 'mixed': return { n: b.neighborhood, why: '10층 이하 근린생활시설·운수시설·복합건축물' };
  }
  return v.highMount ? { n: b.highMount, why: '10층 이하 그 밖의 것, 헤드 부착높이 8m 이상' } : { n: b.normal, why: '10층 이하 그 밖의 것, 헤드 부착높이 8m 미만' };
}

function calcBuilding(v) {
  if (bad(v.L) || bad(v.W)) return { error: '건물 가로와 세로에 0보다 큰 값을 넣어 주세요.' };
  if (!(v.fa >= 1)) return { error: '지상 층수를 1 이상으로 넣어 주세요.' };
  const L = v.L, W = v.W, A = L * W, fa = v.fa, fb = n0(v.fb), floors = fa + fb;
  const factor = fa >= 50 ? STD.highRise.f50 : (fa >= 30 || n0(v.height) >= STD.highRise.heightM) ? STD.highRise.f30 : 1;
  const isHigh = factor > 1;
  const rt = roofTank(v, isHigh);
  const cards = [], pool = [];

  cards.push({
    title: '건물 개요', flat: true,
    tiles: [
      { l: '한 층 바닥면적', v: fx(A), u: '㎡' },
      { l: '연면적 (층별 동일 가정)', v: fx(A * floors), u: '㎡' },
      { l: '고층 구분', v: factor === 3 ? '50층 이상' : factor === 2 ? '고층건축물' : '일반' },
      { l: '옥상수조', v: rt.need ? '설치' : '제외', tone: rt.need ? 'key' : '' },
    ],
    notes: [
      rt.need ? '옥상수조 제외 조건에 해당하지 않아서, 유효수량의 1/3을 옥상수조에 추가해요.' : `옥상수조 제외: ${rt.ex.join(', ')}`,
      isHigh ? '고층건축물 기준을 적용했어요. 수원 배수가 커지고, 옥내소화전은 최대 5개까지 계산에 넣어요.' : '',
      !(v.in_use || v.out_use || v.sp_use || v.sm_use) ? '왼쪽(폰에서는 위쪽) 입력칸에서 옥내소화전·옥외소화전·스프링클러·거실제연 중 계산할 설비를 체크하세요.' : '',
    ].filter(Boolean),
    steps: [step({ t: '한 층 바닥면적', f: 'A = L × W', sym: [['A', '한 층 바닥면적 (㎡)'], ['L', '가로 (m)'], ['W', '세로 (m)']], sub: `A = ${fx(L)} × ${fx(W)}`, ans: `${fx(A)} ㎡` })],
  });

  /* ── 옥내소화전 ── */
  if (v.in_use) {
    const c = STD.indoor, steps = [];
    let nFloor;
    if (v.in_n > 0) {
      nFloor = v.in_n;
      steps.push(step({ t: '설치개수', sub: `직접 입력: 가장 많이 설치된 층 ${fx(nFloor)}개` }));
    } else {
      // 바닥을 같은 크기 칸으로 나눠서, 칸 대각선이 2R 이하가 되는 가장 적은 칸 수
      const D2 = 2 * c.R, d = Math.hypot(L, W);
      steps.push(step({ t: '바닥 대각선', f: 'd = √(L² + W²)', sym: [['d', '바닥 대각선 (m)'], ['L', '가로 (m)'], ['W', '세로 (m)']], sub: `d = √(${fx(L)}² + ${fx(W)}²)`, ans: `${fx(d)} m`, note: `d가 2R(${D2} m) 이하면 가운데 1개로 모든 지점이 ${c.R} m 안에 들어와요.` }));
      if (d <= D2) {
        nFloor = 1;
        steps.push(step({ t: '층당 설치개수', sub: `d = ${fx(d)} m ≤ 2R = ${D2} m`, ans: '1개' }));
      } else {
        const g = indoorGrid(L, W, D2);
        nFloor = g.n;
        steps.push(step({ t: '층당 설치개수 (칸 나누기)', f: 'n = n<sub>x</sub> × n<sub>y</sub>, √(a² + b²) ≤ 2R', sym: [['n', '층당 옥내소화전 개수 (개)'], ['n<sub>x</sub>', '가로 칸 수'], ['n<sub>y</sub>', '세로 칸 수'], ['a', '한 칸 가로 = L ÷ n<sub>x</sub> (m)'], ['b', '한 칸 세로 = W ÷ n<sub>y</sub> (m)'], ['2R', `칸 대각선 한도 (${D2} m)`]], sub: `${g.nx} × ${g.ny}칸, 한 칸 ${fx(g.a)} × ${fx(g.b)} m → 대각선 ${fx(Math.hypot(g.a, g.b))} m ≤ ${D2} m`, ans: `${nFloor}개`, note: '칸 대각선이 2R 이하가 되는 가장 적은 칸 수예요. 칸 가운데에 1개씩 둔다고 본 최소 개수예요.' }));
      }
    }
    const nMax = isHigh ? c.nMaxHigh : c.nMax, N = Math.min(nFloor, nMax);
    const whIndoor = v.use === 'warehouse' || (v.sp_use && v.sp_rack && v.sp_type !== 'simple');
    const per = Math.max(c.vol * factor, whIndoor ? c.volWarehouse : 0), minutes = per * 1000 / c.q;
    const Q = N * per, roof = rt.need ? Q * STD.roofRatio : 0, flow = N * c.q;
    if (whIndoor) steps.push(step({ t: '창고시설 수원 기준', sub: `창고시설 옥내소화전은 1개당 ${c.volWarehouse} ㎥ (130 L/min × 40분)`, ans: `${fx(per)} ㎥` }));
    steps.push(step({ t: '수원 (유효수량)', f: `Q = N × ${fx(per)}`, sym: [['Q', '유효수량 (㎥)'], ['N', `가장 많이 설치된 층의 개수 (최대 ${nMax}개)`], [fx(per), `1개당 수원: ${c.q} L/min × ${minutes}분 (㎥)`]], sub: `Q = ${N} × ${fx(per)}`, ans: `${fx(Q)} ㎥` }));
    if (rt.need) steps.push(...roofSteps(Q, roof));
    steps.push(step({ t: '펌프 토출량', f: `Q<sub>p</sub> = N × ${c.q}`, sym: [['Q<sub>p</sub>', '펌프 토출량 (L/min)'], ['N', '가장 많이 설치된 층의 개수 (개)'], [String(c.q), '1개당 방수량 (L/min)']], sub: `Q<sub>p</sub> = ${N} × ${c.q}`, ans: `${fx(flow)} L/min` }));
    const p = pump('in', v, flow, '배관·호스 마찰손실');
    const pp = c.pipe;
    cards.push({
      title: '옥내소화전', badge: v.in_share ? '겸용' : '단독',
      tiles: [
        { l: '층당 설치개수', v: fx(nFloor), u: '개' }, { l: '유효수량', v: fx(Q), u: '㎥' },
        { l: '옥상수조', v: rt.need ? fx(roof) : '제외', u: rt.need ? '㎥' : '' }, { l: '수원 합계', v: fx(Q + roof), u: '㎥', tone: 'key' },
        ...pumpTiles(flow, p),
      ],
      warns: [p.warn].filter(Boolean),
      steps: [...steps, ...p.steps],
      extra: `<div><h4 class="sub-h">최소 배관 구경</h4>${table(['배관', '최소 구경'], [
        ['가지배관', v.in_reel ? `${pp.branchReel} mm (호스릴)` : `${pp.branch} mm`],
        ['주배관 중 수직배관', v.in_reel ? `${pp.riserReel} mm (호스릴)` : `${pp.riser} mm`],
        ['연결송수관 겸용 주배관', `${pp.mainStandpipe} mm`],
        ['연결송수관 겸용 방수구로 연결되는 배관', `${pp.outletStandpipe} mm`],
      ])}</div>`,
    });
    pool.push({ name: '옥내소화전', share: v.in_share, Q, roof, flow, H: p.H });
  }

  /* ── 옥외소화전 ── */
  if (v.out_use) {
    const c = STD.outdoor, steps = [];
    let n, r = 0, outWarn = '';
    if (v.out_n > 0) {
      n = v.out_n;
      steps.push(step({ t: '설치개수', sub: `직접 입력: ${fx(n)}개` }));
    } else {
      const per = 2 * (L + W), x = n0(v.out_x);
      if (x >= c.R) {
        n = NaN;
        outWarn = `소화전이 외벽에서 ${c.R}m 이상 떨어지면 수평거리 ${c.R}m 안에 건물이 들어오지 않아요. x를 ${c.R}m보다 작게 넣어 주세요.`;
      } else if (x > 0) {
        r = Math.sqrt(c.R ** 2 - x ** 2);
        n = up(per / (2 * r));
        steps.push(step({ t: '유효 수평거리', f: 'r = √(R² − x²)', sym: [['r', '외벽을 따라 소화전 1개가 닿는 거리 (m)'], ['R', `수평거리 ${c.R} (m)`], ['x', '건물 외벽에서 소화전까지 거리 (m)']], sub: `r = √(${c.R}² − ${fx(x)}²)`, ans: `${fx(r)} m` }));
        steps.push(step({ t: '설치개수', f: 'n = ⌈ℓ ÷ (2 × r)⌉', sym: [['n', '옥외소화전 개수 (개)'], ['ℓ', '건물 외곽 둘레 = 2 × (L + W) (m)'], ['r', '유효 수평거리 (m)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(per)} ÷ (2 × ${fx(r)})⌉`, ans: `${n}개` }));
      } else {
        n = up(per / (2 * c.R));
        steps.push(step({ t: '설치개수', f: 'n = ⌈ℓ ÷ (2 × R)⌉', sym: [['n', '옥외소화전 개수 (개)'], ['ℓ', '건물 외곽 둘레 = 2 × (L + W) (m)'], ['R', `수평거리 ${c.R} (m)`], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(per)} ÷ ${2 * c.R}⌉`, ans: `${n}개`, note: '소화전을 외벽에 붙여 설치한 경우예요. 떨어져 있으면 거리 x를 넣으세요.' }));
      }
    }
    const N = Math.min(n, c.nMax), Q = N * c.vol, flow = N * c.q;
    steps.push(step({ t: '수원', f: `Q = N × ${c.vol}`, sym: [['Q', '수원 (㎥)'], ['N', `설치개수 (최대 ${c.nMax}개)`], [String(c.vol), `1개당 수원: ${c.q} L/min × 20분 (㎥)`]], sub: `Q = ${N} × ${c.vol}`, ans: `${fx(Q)} ㎥` }));
    steps.push(step({ t: '펌프 토출량', f: `Q<sub>p</sub> = N × ${c.q}`, sym: [['Q<sub>p</sub>', '펌프 토출량 (L/min)'], ['N', '설치개수 (개)'], [String(c.q), '1개당 방수량 (L/min)']], sub: `Q<sub>p</sub> = ${N} × ${c.q}`, ans: `${fx(flow)} L/min` }));
    const p = pump('out', v, flow, '배관·호스 마찰손실');
    cards.push({
      title: '옥외소화전', badge: v.out_share ? '겸용' : '단독',
      tiles: [{ l: '설치개수', v: fx(n), u: '개' }, { l: '수원', v: fx(Q), u: '㎥', tone: 'key' }, { l: '옥상수조', v: '해당 없음' }, ...pumpTiles(flow, p),
        ...(r > 0 ? [{ l: '유효 수평거리', v: fx(r), u: 'm' }] : [])],
      warns: [outWarn, p.warn].filter(Boolean),
      steps: [...steps, ...p.steps],
    });
    pool.push({ name: '옥외소화전', share: v.out_share, Q, roof: 0, flow, H: p.H });
  }

  /* ── 스프링클러 ── */
  if (v.sp_use) {
    const c = STD.sp, steps = [];
    const simple = v.sp_type === 'simple';
    const rack = !simple && !!v.sp_rack;
    const wh = !simple && (v.use === 'warehouse' || rack);
    const Rkey = v.sp_R === 'auto' ? (v.use === 'apt' ? 'apt' : v.fireproof ? 'fireproof' : 'normal') : v.sp_R;
    const R = simple ? STD.simple.R : c.R[Rkey];
    let Sx, Sy, spErr = '';
    if (v.sp_layout === 'rect') {
      Sx = v.sp_a;
      if (bad(Sx) || Sx >= 2 * R) spErr = `가로 방향 헤드 간격 a는 0보다 크고 2R(${fx(2 * R)} m)보다 작아야 해요.`;
      else {
        Sy = Math.sqrt((2 * R) ** 2 - Sx ** 2);
        steps.push(step({ t: '장방형 헤드 간격', f: 'b = √((2R)² − a²)', sym: [['b', '세로 방향 헤드 간격 (m)'], ['R', '수평거리 (m)'], ['a', '가로 방향 헤드 간격 (m)']], sub: `b = √((2 × ${R})² − ${fx(Sx)}²)`, ans: `${fx(Sy)} m`, note: '헤드 4개가 만드는 직사각형의 대각선이 2R 이하가 돼요.' }));
      }
    } else {
      Sx = Sy = 2 * R * Math.cos(Math.PI / 4);
      steps.push(step({ t: '정방형 헤드 간격', f: 'S = 2 × R × cos45°', sym: [['S', '헤드 간격 (m)'], ['R', '수평거리 (m)']], sub: `S = 2 × ${R} × cos45°`, ans: `${fx(Sx)} m` }));
    }
    if (spErr) {
      cards.push({ title: '스프링클러', error: spErr });
    } else {
      const nx = up(L / Sx), ny = up(W / Sy), perFloor = nx * ny, total = perFloor * floors;
      steps.push(step({ t: '층당 헤드 수', f: 'n = ⌈L ÷ S<sub>x</sub>⌉ × ⌈W ÷ S<sub>y</sub>⌉', sym: [['n', '층당 헤드 수 (개)'], ['L', '가로 (m)'], ['W', '세로 (m)'], ['S<sub>x</sub>', '가로 방향 간격 (m)'], ['S<sub>y</sub>', '세로 방향 간격 (m)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(L)} ÷ ${fx(Sx)}⌉ × ⌈${fx(W)} ÷ ${fx(Sy)}⌉ = ${nx} × ${ny}`, ans: `${perFloor}개` }));
      steps.push(step({ t: '전체 헤드 수', f: 'n<sub>T</sub> = n × F', sym: [['n<sub>T</sub>', '전체 헤드 수 (개)'], ['n', '층당 헤드 수 (개)'], ['F', '지상 + 지하 층수 (층)']], sub: `n<sub>T</sub> = ${perFloor} × ${floors}`, ans: `${total}개`, note: '모든 층 평면이 같다고 보고 계산했어요.' }));
      let N, q, per, minutes, Q, roof, flow, title = '스프링클러', maxSide = c.maxSide;
      const extraTiles = [], spNotes = [];
      if (simple) {
        const [nCase, mins] = STD.simple.cases[v.sp_simpleCase];
        q = STD.simple.q;
        N = Math.min(nCase, perFloor); minutes = mins; per = q * minutes / 1000;
        Q = N * per; roof = 0; flow = N * q; title = '간이스프링클러';
        steps.push(step({ t: '동시 개방 간이헤드 수', sub: `${v.sp_simpleCase === 'special' ? '근린생활시설·숙박시설·복합건축물' : '일반'} → ${nCase}개${perFloor < nCase ? `, 설치개수(${perFloor}개)가 더 적어서 ${perFloor}개 적용` : ''}`, ans: `${N}개` }));
        steps.push(step({ t: '수원', f: 'Q = N × q × T ÷ 1000', sym: [['Q', '수원 (㎥)'], ['N', '동시 개방 간이헤드 수 (개)'], ['q', '헤드 1개당 방수량 (L/min)'], ['T', '방수시간 (min)'], ['1000', 'L → ㎥ 환산']], sub: `Q = ${N} × ${q} × ${minutes} ÷ 1000`, ans: `${fx(Q)} ㎥` }));
      } else if (wh) {
        const w = c.warehouse;
        q = w.q; minutes = rack ? 60 : 20; per = rack ? w.volRack : w.vol; maxSide = w.maxSide;
        const base = v.sp_base > 0 ? v.sp_base : w.base;
        N = Math.min(base, perFloor);
        Q = N * per; roof = rt.need ? Q * STD.roofRatio : 0; flow = N * q;
        title = rack ? '스프링클러 (랙식 창고)' : '스프링클러 (창고시설)';
        steps.push(step({ t: '기준개수', sub: `창고시설 라지드롭형: 설치개수가 가장 많은 방호구역 (최대 ${base}개)${perFloor < base ? `, 설치개수(${perFloor}개)가 더 적어서 ${perFloor}개 적용` : ''}`, ans: `${N}개` }));
        steps.push(step({ t: '수원 (유효수량)', f: `Q = N × ${fx(per)}`, sym: [['Q', '유효수량 (㎥)'], ['N', '기준개수 (개)'], [fx(per), `헤드 1개당 수원: ${q} L/min × ${minutes}분 (㎥)`]], sub: `Q = ${N} × ${fx(per)}`, ans: `${fx(Q)} ㎥` }));
        if (rack) {
          if (bad(v.sp_rackH)) spNotes.push('랙 높이를 넣으면 헤드 설치 단 수가 나와요.');
          else {
            const inRack = up(v.sp_rackH / w.rackStep), tiers = inRack + 1;
            steps.push(step({ t: '헤드 설치 단 수', f: `n<sub>단</sub> = ⌈h ÷ ${w.rackStep}⌉ + 1`, sym: [['n<sub>단</sub>', '헤드 설치 단 수 (천장 포함)'], ['h', '랙 높이 (m)'], [String(w.rackStep), `랙 높이 ${w.rackStep}m 이하마다 설치`], ['1', '천장 1단'], ['⌈ ⌉', '올림']], sub: `n<sub>단</sub> = ⌈${fx(v.sp_rackH)} ÷ ${w.rackStep}⌉ + 1 = ${inRack} + 1`, ans: `${tiers}단` }));
            extraTiles.push({ l: '헤드 설치 단 수', v: fx(tiers), u: '단' });
          }
        }
      } else {
        const bc = v.sp_base > 0 ? { n: v.sp_base, why: '직접 지정' } : spBase(v);
        N = Math.min(bc.n, perFloor); q = c.q; minutes = 20 * factor; per = c.vol * factor;
        Q = N * per; roof = rt.need ? Q * STD.roofRatio : 0; flow = N * q;
        steps.push(step({ t: '기준개수', sub: `${bc.why} → ${bc.n}개${perFloor < bc.n ? `, 설치개수(${perFloor}개)가 더 적어서 ${perFloor}개 적용` : ''}`, ans: `${N}개` }));
        steps.push(step({ t: '수원 (유효수량)', f: `Q = N × ${fx(per)}`, sym: [['Q', '유효수량 (㎥)'], ['N', '기준개수 (개)'], [fx(per), `헤드 1개당 수원: ${q} L/min × ${minutes}분 (㎥)`]], sub: `Q = ${N} × ${fx(per)}`, ans: `${fx(Q)} ㎥` }));
      }
      if (roof > 0) steps.push(...roofSteps(Q, roof));
      steps.push(step({ t: '펌프 토출량', f: `Q<sub>p</sub> = N × ${q}`, sym: [['Q<sub>p</sub>', '펌프 토출량 (L/min)'], ['N', simple ? '동시 개방 헤드 수 (개)' : '기준개수 (개)'], [String(q), '헤드 1개당 방수량 (L/min)']], sub: `Q<sub>p</sub> = ${N} × ${q}`, ans: `${fx(flow)} L/min` }));
      const p = pump('sp', v, flow);
      cards.push({
        title, badge: v.sp_share ? '겸용' : '단독',
        tiles: [
          { l: '수평거리 R', v: fx(R), u: 'm' },
          { l: '헤드 간격', v: v.sp_layout === 'rect' ? `${fx(Sx)} × ${fx(Sy)}` : fx(Sx), u: 'm' },
          { l: '층당 헤드', v: fx(perFloor), u: '개' }, { l: '전체 헤드', v: fx(total), u: '개' }, ...extraTiles,
          { l: simple ? '동시 개방 헤드' : '기준개수', v: fx(N), u: '개' }, { l: '방수시간', v: fx(minutes), u: '분' }, { l: '유효수량', v: fx(Q), u: '㎥' },
          { l: '옥상수조', v: roof > 0 ? fx(roof) : (simple ? '해당 없음' : '제외'), u: roof > 0 ? '㎥' : '' }, { l: '수원 합계', v: fx(Q + roof), u: '㎥', tone: 'key' },
          ...pumpTiles(flow, p),
        ],
        warns: [p.warn].filter(Boolean),
        notes: spNotes,
        steps: [...steps, ...p.steps],
      });
      pool.push({ name: title, share: v.sp_share, Q, roof, flow, H: p.H });
      cards.push(spDrawingCard(L, W, nx, ny, maxSide, simple ? '' : wh ? '창고시설 전용 구경표는 아직 반영하지 않아서 일반 스프링클러 표로 표시했어요.' : ''));
    }
  }

  /* ── 거실제연 ── */
  if (v.sm_use) cards.push(smokeCard(v, A, Math.hypot(L, W)));

  /* ── 최종값 (겸용 합산) ── */
  const sh = pool.filter((p) => p.share), solo = pool.filter((p) => !p.share);
  if (sh.length >= 2) {
    const Q = sum(sh, 'Q'), roof = sum(sh, 'roof'), flow = sum(sh, 'flow'), H = Math.max(...sh.map((p) => p.H));
    const pw = power(flow, H, v.sum_eta, v.sum_k);
    const names = sh.map((p) => p.name).join(' + ');
    const steps = [
      step({ t: '유효수량 합계', f: 'Q = ΣQ<sub>i</sub>', sym: [['Q', '겸용 설비 유효수량 합계 (㎥)'], ['Q<sub>i</sub>', '설비별 유효수량 (㎥)']], sub: `Q = ${sh.map((p) => `${fx(p.Q)} (${p.name})`).join(' + ')}`, ans: `${fx(Q)} ㎥` }),
      step({ t: '옥상수조 합계', f: "Q' = ΣQ'<sub>i</sub>", sym: [["Q'", '겸용 설비 옥상수조 합계 (㎥)'], ["Q'<sub>i</sub>", '설비별 옥상수조 수원 (㎥)']], sub: `Q' = ${sh.map((p) => fx(p.roof)).join(' + ')}`, ans: `${fx(roof)} ㎥` }),
      step({ t: '수원 합계', f: "Q<sub>T</sub> = Q + Q'", sym: [['Q<sub>T</sub>', '옥상수조를 포함한 수원 합계 (㎥)'], ['Q', '유효수량 합계 (㎥)'], ["Q'", '옥상수조 합계 (㎥)']], sub: `Q<sub>T</sub> = ${fx(Q)} + ${fx(roof)}`, ans: `${fx(Q + roof)} ㎥` }),
      step({ t: '펌프 토출량 합계', f: 'Q<sub>p</sub> = ΣQ<sub>p,i</sub>', sym: [['Q<sub>p</sub>', '겸용 펌프 토출량 (L/min)'], ['Q<sub>p,i</sub>', '설비별 펌프 토출량 (L/min)']], sub: `Q<sub>p</sub> = ${sh.map((p) => fx(p.flow)).join(' + ')}`, ans: `${fx(flow)} L/min` }),
      step({ t: '전양정', f: 'H = max(H<sub>i</sub>)', sym: [['H', '겸용 펌프 전양정 (m)'], ['H<sub>i</sub>', '설비별 전양정 (m)']], sub: `H = max(${sh.map((p) => fx(p.H)).join(', ')})`, ans: `${fx(H)} m`, note: '가장 큰 전양정을 적용했어요.' }),
      ...pw.steps,
    ];
    cards.push({
      title: '최종값 (겸용 합산)', kind: 'total', badge: names, badgeOn: true,
      tiles: [
        { l: '유효수량 합계', v: fx(Q), u: '㎥' }, { l: '옥상수조 합계', v: fx(roof), u: '㎥' }, { l: '수원 합계', v: fx(Q + roof), u: '㎥', tone: 'key' },
        ...pumpTiles(flow, { H, ...pw }),
      ],
      warns: [pw.warn].filter(Boolean),
      notes: solo.length ? [`따로 계산한 설비: ${solo.map((p) => `${p.name} (수원 ${fx(p.Q + p.roof)} ㎥, 토출량 ${fx(p.flow)} L/min, 전양정 ${fx(p.H)} m)`).join(' / ')}`] : [],
      steps,
    });
  }

  return { cards };
}

/* 스프링클러 도면: 수직주배관(한 변 중앙) → 교차배관(가운데) → 가지배관(양쪽), 토너먼트 아님 */
function spPlan(L, W, nx, ny) {
  const dx = L / nx, dy = W / ny;
  const xs = Array.from({ length: nx }, (_, i) => (i + 0.5) * dx);
  const ys = Array.from({ length: ny }, (_, j) => (j + 0.5) * dy);
  const nl = Math.floor(nx / 2), nr = nx - nl;
  const xc = nl === 0 ? xs[0] - dx / 4 : (xs[nl - 1] + xs[nl]) / 2;
  const cross = [];
  let prev = 0;
  ys.forEach((y, j) => {
    const n = nx * (ny - j);
    cross.push({ y1: prev, y2: y, n, d: Math.max(pipeSize(n), STD.sp.crossMin) });
    prev = y;
  });
  const branchR = [], branchL = [];
  let px = xc;
  for (let i = nl; i < nx; i++) { const n = nx - i; branchR.push({ x1: px, x2: xs[i], n, d: pipeSize(n) }); px = xs[i]; }
  px = xc;
  for (let i = nl - 1; i >= 0; i--) { const n = i + 1; branchL.push({ x1: px, x2: xs[i], n, d: pipeSize(n) }); px = xs[i]; }
  return { dx, dy, xs, ys, nl, nr, xc, cross, branchL, branchR, far: { i: nx - 1, j: ny - 1, no: nx * ny } };
}

function spSvg(L, W, P) {
  const nx = P.xs.length, ny = P.ys.length;
  const s = Math.min(720 / L, 470 / W);
  const pad = { l: 46, r: 24, t: 44, b: 52 };
  const w = L * s, h = W * s, VW = w + pad.l + pad.r, VH = h + pad.t + pad.b;
  const X = (x) => +(pad.l + x * s).toFixed(1), Y = (y) => +(pad.t + (W - y) * s).toFixed(1);
  const r = Math.max(2.5, Math.min(6, s * 0.12));
  const lblB = nx <= 16 && s * P.dx >= 24;
  const lblN = nx * ny <= 220 && s * P.dx >= 16;
  let o = `<rect class="room" x="${X(0)}" y="${Y(W)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
  P.ys.forEach((y) => {
    [...P.branchL, ...P.branchR].forEach((b) => {
      o += `<line class="branch" x1="${X(b.x1)}" y1="${Y(y)}" x2="${X(b.x2)}" y2="${Y(y)}"/>`;
      if (lblB) o += `<text class="lb" x="${((X(b.x1) + X(b.x2)) / 2).toFixed(1)}" y="${(Y(y) - 4).toFixed(1)}" text-anchor="middle">${b.d}</text>`;
    });
  });
  P.cross.forEach((c) => {
    o += `<line class="cross" x1="${X(P.xc)}" y1="${Y(c.y1)}" x2="${X(P.xc)}" y2="${Y(c.y2)}"/>`;
    o += `<text class="lc" x="${(X(P.xc) + 7).toFixed(1)}" y="${((Y(c.y1) + Y(c.y2)) / 2 + 4).toFixed(1)}">${c.d}</text>`;
  });
  P.ys.forEach((y, j) => P.xs.forEach((x, i) => {
    const no = j * nx + i + 1, far = i === P.far.i && j === P.far.j;
    o += `<circle class="head${far ? ' far' : ''}" cx="${X(x)}" cy="${Y(y)}" r="${far ? r + 1.5 : r}"/>`;
    if (lblN) o += `<text class="hn" x="${(X(x) + r + 1).toFixed(1)}" y="${(Y(y) + r + 8).toFixed(1)}">${no}</text>`;
  }));
  const fx_ = X(P.xs[P.far.i]), fy_ = Y(P.ys[P.far.j]);
  o += `<text class="far" x="${(fx_ - r - 4).toFixed(1)}" y="${(fy_ - r - 6).toFixed(1)}" text-anchor="end">최말단 헤드 (${P.far.no}번)</text>`;
  o += `<circle class="riser" cx="${X(P.xc)}" cy="${Y(0)}" r="7"/>`;
  o += `<text class="lk" x="${X(P.xc)}" y="${(Y(0) + 24).toFixed(1)}" text-anchor="middle">수직주배관</text>`;
  const yd = pad.t - 22, xd = pad.l - 22;
  o += `<line class="dim" x1="${X(0)}" y1="${yd}" x2="${X(L)}" y2="${yd}"/><line class="dim" x1="${X(0)}" y1="${yd - 5}" x2="${X(0)}" y2="${yd + 5}"/><line class="dim" x1="${X(L)}" y1="${yd - 5}" x2="${X(L)}" y2="${yd + 5}"/>`;
  o += `<text class="lk" x="${X(L / 2)}" y="${yd - 6}" text-anchor="middle">가로 ${fx(L)} m</text>`;
  o += `<line class="dim" x1="${xd}" y1="${Y(0)}" x2="${xd}" y2="${Y(W)}"/><line class="dim" x1="${xd - 5}" y1="${Y(0)}" x2="${xd + 5}" y2="${Y(0)}"/><line class="dim" x1="${xd - 5}" y1="${Y(W)}" x2="${xd + 5}" y2="${Y(W)}"/>`;
  o += `<text class="lk" x="${xd - 6}" y="${Y(W / 2)}" text-anchor="middle" transform="rotate(-90 ${xd - 6} ${Y(W / 2)})">세로 ${fx(W)} m</text>`;
  return `<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" role="img" aria-label="스프링클러 배관 평면도">${o}</svg>`;
}

function spDrawingCard(L, W, nx, ny, maxSide = STD.sp.maxSide, extraNote = '') {
  const P = spPlan(L, W, nx, ny);
  const warns = [];
  if (Math.max(P.nl, P.nr) > maxSide) warns.push(`한쪽 가지배관 헤드가 ${Math.max(P.nl, P.nr)}개로 ${maxSide}개를 넘어요. 교차배관을 더 두거나 구역을 나눠야 해요.`);
  if (extraNote) warns.push(extraNote);
  if (P.nl !== P.nr) warns.push(`헤드 열이 홀수(${nx}열)라서 교차배관을 가운데에서 반 칸 옮겼어요. 왼쪽 ${P.nl}개, 오른쪽 ${P.nr}개예요.`);
  const crossRows = P.cross.map((c, j) => [j === 0 ? '수직주배관 → 1행' : `${j}행 → ${j + 1}행`, `${c.n}개`, `${c.d} mm`]);
  const brText = (arr, side) => arr.length ? `${side} (헤드 ${arr.length}개): ${arr.map((b) => `${b.n}개 → <b>${b.d}</b>`).join(' · ')}` : '';
  return {
    title: '스프링클러 도면 (1개 층)',
    notes: [`헤드 간격 가로 ${fx(P.dx)} m · 세로 ${fx(P.dy)} m, 벽에서 첫 헤드까지 가로 ${fx(P.dx / 2)} m · 세로 ${fx(P.dy / 2)} m`, '배관 옆 숫자는 구경(mm)이에요. 담당 헤드 수로 구경을 정했고, 교차배관은 최소 ' + STD.sp.crossMin + ' mm를 적용했어요.'],
    warns,
    extraTop: `<div class="drawing">${spSvg(L, W, P)}</div>
      <div class="legend"><span><i class="lg-riser"></i>수직주배관</span><span><i class="lg-cross"></i>교차배관</span><span><i class="lg-branch"></i>가지배관</span><span><i class="lg-head"></i>헤드</span><span><i class="lg-far"></i>최말단 헤드</span></div>`,
    extra: `<div><h4 class="sub-h">교차배관 구경</h4>${table(['구간', '담당 헤드', '구경'], crossRows)}</div>
      <div><h4 class="sub-h">가지배관 구경 (한 줄, 교차배관 쪽부터)</h4><p class="hint" style="margin:0;font-size:13px">${[brText(P.branchL, '왼쪽'), brText(P.branchR, '오른쪽')].filter(Boolean).join('<br>')}</p></div>`,
  };
}

function smokeCard(v, floorA, diag) {
  const c = STD.smoke, steps = [];
  const A = v.sm_A > 0 ? v.sm_A : floorA, D = v.sm_D > 0 ? v.sm_D : diag;
  let Qh;
  if (A < c.bigArea) {
    const q0 = A * c.perM2 * 60;
    Qh = Math.max(q0, c.minSmall);
    steps.push(step({ t: `배출량 (${c.bigArea}㎡ 미만)`, f: 'Q = A × 1 × 60', sym: [['Q', '배출량 (㎥/h)'], ['A', '거실 바닥면적 (㎡)'], ['1', '바닥 1㎡당 배출량 (㎥/min)'], ['60', '분 → 시간 환산']], sub: `Q = ${fx(A)} × 1 × 60 = ${fx(q0)}${q0 < c.minSmall ? ` → 최저 ${fx(c.minSmall)} 적용` : ''}`, ans: `${fx(Qh)} ㎥/h` }));
  } else {
    const within = D <= c.diaLimit;
    if (v.sm_div === 'wall') {
      Qh = within ? c.wallWithin : c.wallOver;
      steps.push(step({ t: `배출량 (${c.bigArea}㎡ 이상, 벽으로 구획)`, sub: `직경 ${fx(D)} m → ${within ? `${c.diaLimit}m 이내` : `${c.diaLimit}m 초과`}`, ans: `${fx(Qh)} ㎥/h` }));
    } else {
      const row = pickLE(within ? c.within40 : c.over40, n0(v.sm_h));
      Qh = row[1];
      steps.push(step({ t: `배출량 (${c.bigArea}㎡ 이상, 제연경계)`, sub: `직경 ${fx(D)} m (${within ? `${c.diaLimit}m 이내` : `${c.diaLimit}m 초과`}), 수직거리 ${fx(n0(v.sm_h))} m`, ans: `${fx(Qh)} ㎥/h` }));
    }
  }
  const Qm = Qh / 60, e = n0(v.sm_eta) / 100, k = n0(v.sm_k), pt = n0(v.sm_pt);
  const P = e > 0 ? pt * Qm / (c.pConst * e) * k : NaN;
  steps.push(step({ t: '배출량 (분당)', f: 'Q<sub>m</sub> = Q ÷ 60', sym: [['Q<sub>m</sub>', '배출량 (㎥/min)'], ['Q', '배출량 (㎥/h)']], sub: `Q<sub>m</sub> = ${fx(Qh)} ÷ 60`, ans: `${fx(Qm)} ㎥/min` }));
  steps.push(step({ t: '배출기 동력', f: 'P = P<sub>t</sub> × Q<sub>m</sub> ÷ (6120 × η) × K', sym: [['P', '배출기 동력 (kW)'], ['P<sub>t</sub>', '배출기 전압 (mmAq)'], ['Q<sub>m</sub>', '배출량 (㎥/min)'], ['6120', '단위 환산 상수 (102 × 60)'], ['η', '배출기 효율'], ['K', '여유율']], sub: `P = ${fx(pt)} × ${fx(Qm)} ÷ (6120 × ${fx(e)}) × ${fx(k)}`, ans: `${fx(P)} kW` }));
  return {
    title: '거실제연',
    tiles: [{ l: '거실 바닥면적', v: fx(A), u: '㎡' }, { l: '직경', v: fx(D), u: 'm' }, { l: '배출량', v: fx(Qh), u: '㎥/h', tone: 'key' }, { l: '배출량 (분당)', v: fx(Qm), u: '㎥/min' }, { l: '배출기 동력', v: fx(P), u: 'kW', tone: 'key' }],
    warns: e > 0 ? [] : ['배출기 효율에 0보다 큰 값을 넣어 주세요.'],
    steps,
  };
}

/* =========================================================
   ⑤ 계산 — 옥외탱크저장소 (포)
   ========================================================= */
function calcTank(v) {
  if (bad(v.D)) return { error: '탱크 지름에 0보다 큰 값을 넣어 주세요.' };
  const c = STD.foamTank, D = v.D, S = Number(v.S) / 100, steps = [];
  let A;
  if (v.roof === 'floating') {
    if (bad(v.seal) || 2 * v.seal >= D) return { error: '측판~굽도리판 간격은 0보다 크고 지름의 절반보다 작아야 해요.' };
    A = Math.PI / 4 * (D ** 2 - (D - 2 * v.seal) ** 2);
    steps.push(step({ t: '포 방출 면적 (환상부분)', f: 'A = π/4 × (D² − (D − 2w)²)', sym: [['A', '환상부분 면적 (㎡)'], ['D', '탱크 지름 (m)'], ['w', '측판과 굽도리판 사이 간격 (m)']], sub: `A = π/4 × (${fx(D)}² − (${fx(D)} − 2 × ${fx(v.seal)})²)`, ans: `${fx(A)} ㎡` }));
  } else {
    A = Math.PI / 4 * D ** 2;
    steps.push(step({ t: '탱크 액표면적', f: 'A = π/4 × D²', sym: [['A', '액표면적 (㎡)'], ['D', '탱크 지름 (m)']], sub: `A = π/4 × ${fx(D)}²`, ans: `${fx(A)} ㎡` }));
  }
  const tbl = c.outlet[v.outlet][v.flash];
  const sol = v.sol > 0 ? v.sol : tbl[0], rate = v.rate > 0 ? v.rate : tbl[1], T = sol / rate;
  steps.push(step({ t: '방사시간', f: 'T = q ÷ Q', sym: [['T', '방사시간 (min)'], ['q', '단위면적당 포수용액량 (L/㎡)'], ['Q', '방출률 (L/min·㎡)']], sub: `T = ${fx(sol)} ÷ ${fx(rate)}`, ans: `${fx(T)} min` }));
  const Q1 = A * rate * T;
  steps.push(step({ t: '고정포방출구 포수용액량', f: 'Q₁ = A × Q × T', sym: [['Q₁', '고정포방출구 포수용액량 (L)'], ['A', '포 방출 면적 (㎡)'], ['Q', '방출률 (L/min·㎡)'], ['T', '방사시간 (min)']], sub: `Q₁ = ${fx(A)} × ${fx(rate)} × ${fx(T)}`, ans: `${fx(Q1)} L` }));
  const nOut = 2 * n0(v.Nd) + n0(v.Ns), N = Math.min(nOut, c.hydrantMax), Q2 = N * c.hydrantQ * c.hydrantT;
  steps.push(step({ t: '보조포소화전 호스접속구 수', f: 'n = 2 × N<sub>쌍</sub> + N<sub>단</sub>', sym: [['n', '호스접속구 수 (개)'], ['N<sub>쌍</sub>', '쌍구형 보조포소화전 개수 (1개에 접속구 2개)'], ['N<sub>단</sub>', '단구형 보조포소화전 개수']], sub: `n = 2 × ${fx(n0(v.Nd))} + ${fx(n0(v.Ns))}`, ans: `${nOut}개${nOut > c.hydrantMax ? ` → 최대 ${c.hydrantMax}개 적용` : ''}` }));
  steps.push(step({ t: '보조포소화전 포수용액량', f: `Q₂ = N × ${c.hydrantQ} × ${c.hydrantT}`, sym: [['Q₂', '보조포소화전 포수용액량 (L)'], ['N', `호스접속구 수 (최대 ${c.hydrantMax}개)`], [String(c.hydrantQ), '접속구 1개당 방사량 (L/min)'], [String(c.hydrantT), '방사시간 (min)']], sub: `Q₂ = ${N} × ${c.hydrantQ} × ${c.hydrantT}`, ans: `${fx(Q2)} L` }));
  const segs = [[v.d1, v.l1], [v.d2, v.l2], [v.d3, v.l3]].filter(([d, l]) => d > 0 && l > 0);
  const used = segs.filter(([d]) => d > c.lineMin);
  const Q3 = used.reduce((a, [d, l]) => a + Math.PI / 4 * (d / 1000) ** 2 * l * 1000, 0);
  steps.push(step({ t: '송액관 보정량', f: 'Q₃ = Σ(π/4 × d² × ℓ × 1000)', sym: [['Q₃', '송액관을 채우는 포수용액량 (L)'], ['d', `송액관 내경 (m), ${c.lineMin}mm 초과만`], ['ℓ', '송액관 길이 (m)'], ['1000', '㎥ → L 환산']], sub: used.length ? `Q₃ = ${used.map(([d, l]) => `π/4 × ${fx(d / 1000, 3)}² × ${fx(l)} × 1000`).join(' + ')}` : `Q₃ = 0 (${c.lineMin}mm 초과 송액관 없음)`, ans: `${fx(Q3)} L` }));
  const tot = Q1 + Q2 + Q3, agent = tot * S, water = tot * (1 - S);
  steps.push(step({ t: '포수용액량 합계', f: 'Q<sub>T</sub> = Q₁ + Q₂ + Q₃', sym: [['Q<sub>T</sub>', '포수용액량 합계 (L)']], sub: `Q<sub>T</sub> = ${fx(Q1)} + ${fx(Q2)} + ${fx(Q3)}`, ans: `${fx(tot)} L` }));
  steps.push(step({ t: '포 약제량', f: 'W = Q<sub>T</sub> × S', sym: [['W', '포 약제 저장량 (L)'], ['Q<sub>T</sub>', '포수용액량 합계 (L)'], ['S', '포 약제 농도']], sub: `W = ${fx(tot)} × ${fx(S)}`, ans: `${fx(agent)} L` }));
  steps.push(step({ t: '물 (약제 제외)', f: 'Q<sub>w</sub> = Q<sub>T</sub> × (1 − S)', sym: [['Q<sub>w</sub>', '약제를 뺀 물의 양 (L)'], ['Q<sub>T</sub>', '포수용액량 합계 (L)'], ['S', '포 약제 농도']], sub: `Q<sub>w</sub> = ${fx(tot)} × ${fx(1 - S)}`, ans: `${fx(water)} L` }));
  const flow = A * rate + N * c.hydrantQ;
  steps.push(step({ t: '펌프 토출량', f: `Q<sub>p</sub> = A × Q + N × ${c.hydrantQ}`, sym: [['Q<sub>p</sub>', '펌프 토출량 (L/min)'], ['A', '포 방출 면적 (㎡)'], ['Q', '고정포방출구 방출률 (L/min·㎡)'], ['N', '보조포소화전 호스접속구 수 (개)'], [String(c.hydrantQ), '접속구 1개당 방사량 (L/min)']], sub: `Q<sub>p</sub> = ${fx(A)} × ${fx(rate)} + ${N} × ${c.hydrantQ}`, ans: `${fx(flow)} L/min` }));
  const p = pump('fp', v, flow, null, '방출구 설계압력 환산수두');
  const cards = [{
    title: '옥외탱크저장소 포소화설비',
    tiles: [
      { l: '포 방출 면적', v: fx(A), u: '㎡' }, { l: '방사시간', v: fx(T), u: 'min' }, { l: '보조포 접속구', v: fx(N), u: '개' },
      { l: '포수용액량', v: fx(tot / 1000), u: '㎥', tone: 'key' }, { l: '포 약제량', v: fx(agent), u: 'L', tone: 'key' }, { l: '물 (약제 제외)', v: fx(water / 1000), u: '㎥' },
      ...pumpTiles(flow, p),
    ],
    warns: [p.warn].filter(Boolean),
    notes: segs.length > used.length ? [`내경 ${c.lineMin}mm 이하 송액관 ${segs.length - used.length}개는 보정량에서 뺐어요.`] : [],
    steps: [...steps, ...p.steps],
  }];
  if (v.lay_use) cards.push(tankLayoutCard(v));
  return { cards };
}

/* 보유공지 너비 */
function openSpace(X, D, H) {
  const o = STD.openSpace, row = o.tbl.find((r) => X <= r[0]);
  if (row) {
    const i = o.tbl.indexOf(row), lo = i === 0 ? null : o.tbl[i - 1][0];
    return { w: row[1], why: `지정수량 ${fx(X)}배 → ${lo ? `${fx(lo)}배 초과 ` : ''}${fx(row[0])}배 이하` };
  }
  const w = Math.min(Math.max(Math.max(D, H), o.min), o.max);
  return { w, why: `지정수량 ${fx(X)}배 → 4,000배 초과: 지름·높이 중 큰 값 이상 (${o.min}m 미만이면 ${o.min}m, ${o.max}m 초과면 ${o.max}m로 할 수 있음)` };
}

/* 방유제·보유공지 배치도 */
function tankLayoutCard(v) {
  const c = STD.dike, steps = [], warns = [], title = '탱크 배치 (방유제·보유공지)';
  const tanks = [{ no: 1, D: v.D, H: v.TH, X: v.TX }];
  if (v.two) tanks.push({ no: 2, D: v.D2, H: v.H2, X: v.X2 });
  for (const t of tanks) if (bad(t.D) || bad(t.H) || bad(t.X)) return { title, error: `${t.no}번 탱크의 지름·높이·지정수량 배수에 0보다 큰 값을 넣어 주세요.` };
  tanks.forEach((t) => {
    const small = t.D < c.dia;
    t.dike = v.hiFlash ? 0 : t.H * (small ? c.small : c.big);
    if (!v.hiFlash) steps.push(step({ t: `${t.no}번 탱크 ~ 방유제 거리`, f: small ? 'ℓ = H × 1/3' : 'ℓ = H × 1/2', sym: [['ℓ', '탱크 옆판에서 방유제까지 최소 거리 (m)'], ['H', '탱크 높이 (m)']], sub: `지름 ${fx(t.D)} m (${small ? `${c.dia}m 미만` : `${c.dia}m 이상`}) → ℓ = ${fx(t.H)} × ${small ? '1/3' : '1/2'}`, ans: `${fx(t.dike)} m` }));
    const os = openSpace(t.X, t.D, t.H);
    t.space = os.w;
    steps.push(step({ t: `${t.no}번 탱크 보유공지`, sub: os.why, ans: `${fx(t.space)} m 이상` }));
  });
  let gap = 0;
  if (tanks.length === 2) {
    gap = Math.max(tanks[0].space, tanks[1].space);
    steps.push(step({ t: '두 탱크 사이 거리', f: 'g = max(w₁, w₂)', sym: [['g', '두 탱크 옆판 사이 최소 거리 (m)'], ['w₁', '1번 탱크 보유공지 (m)'], ['w₂', '2번 탱크 보유공지 (m)']], sub: `g = max(${fx(tanks[0].space)}, ${fx(tanks[1].space)})`, ans: `${fx(gap)} m`, note: '탱크 사이 최소 거리는 보유공지로 봤어요.' }));
  }
  if (v.hiFlash) warns.push('인화점 200℃ 이상이라 방유제와 탱크 사이 거리 기준은 적용하지 않았어요.');

  // 도면 좌표 (m): 방유제 왼쪽 아래가 (0, 0)
  const t1 = tanks[0], t2 = tanks[1];
  const Wd = t1.dike + t1.D + (t2 ? gap + t2.D + t2.dike : t1.dike);
  const Hd = Math.max(t1.D + 2 * t1.dike, t2 ? t2.D + 2 * t2.dike : 0);
  const cy = Hd / 2;
  t1.cx = t1.dike + t1.D / 2;
  if (t2) t2.cx = t1.dike + t1.D + gap + t2.D / 2;
  let minX = 0, maxX = Wd, minY = 0, maxY = Hd;
  tanks.forEach((t) => { const R = t.D / 2 + t.space; minX = Math.min(minX, t.cx - R); maxX = Math.max(maxX, t.cx + R); minY = Math.min(minY, cy - R); maxY = Math.max(maxY, cy + R); });
  const s = Math.min(700 / (maxX - minX), 400 / (maxY - minY)), pad = 34;
  const X = (x) => +(pad + (x - minX) * s).toFixed(1), Y = (y) => +(pad + (maxY - y) * s).toFixed(1);
  const VW = (maxX - minX) * s + 2 * pad, VH = (maxY - minY) * s + 2 * pad;
  let g = '';
  tanks.forEach((t) => { g += `<circle class="space" cx="${X(t.cx)}" cy="${Y(cy)}" r="${((t.D / 2 + t.space) * s).toFixed(1)}"/>`; });
  g += `<rect class="dike" x="${X(0)}" y="${Y(Hd)}" width="${(Wd * s).toFixed(1)}" height="${(Hd * s).toFixed(1)}"/>`;
  tanks.forEach((t) => {
    g += `<circle class="tank" cx="${X(t.cx)}" cy="${Y(cy)}" r="${(t.D / 2 * s).toFixed(1)}"/>`;
    g += `<text class="lk" x="${X(t.cx)}" y="${Y(cy) - 4}" text-anchor="middle">${t.no}번 탱크</text><text x="${X(t.cx)}" y="${Y(cy) + 12}" text-anchor="middle">D ${fx(t.D)} · H ${fx(t.H)} m</text>`;
  });
  const dim = (x1, x2, y, label, up) => {
    if (x2 - x1 <= 0) return '';
    const yy = Y(y) + (up ? -10 : 10);
    return `<line class="dimr" x1="${X(x1)}" y1="${yy}" x2="${X(x2)}" y2="${yy}"/><line class="dimr" x1="${X(x1)}" y1="${yy - 4}" x2="${X(x1)}" y2="${yy + 4}"/><line class="dimr" x1="${X(x2)}" y1="${yy - 4}" x2="${X(x2)}" y2="${yy + 4}"/><text class="dt" x="${((X(x1) + X(x2)) / 2).toFixed(1)}" y="${up ? yy - 5 : yy + 13}" text-anchor="middle">${label}</text>`;
  };
  g += dim(0, t1.dike, cy, `${fx(t1.dike)} m`, true);
  if (t2) {
    g += dim(t1.dike + t1.D, t1.dike + t1.D + gap, cy, `${fx(gap)} m`, true);
    g += dim(t2.cx + t2.D / 2, Wd, cy, `${fx(t2.dike)} m`, true);
  } else {
    g += dim(t1.dike + t1.D, Wd, cy, `${fx(t1.dike)} m`, true);
  }
  // 1번 탱크 위쪽 방유제까지
  const topGap = Hd - (cy + t1.D / 2);
  if (topGap > 0) {
    const xx = X(t1.cx);
    g += `<line class="dimr" x1="${xx}" y1="${Y(Hd)}" x2="${xx}" y2="${Y(cy + t1.D / 2)}"/><text class="dt" x="${xx + 6}" y="${((Y(Hd) + Y(cy + t1.D / 2)) / 2 + 4).toFixed(1)}">${fx(topGap)} m</text>`;
  }
  g += `<text class="lk" x="${X(0) + 6}" y="${Y(Hd) + 16}">방유제 ${fx(Wd)} × ${fx(Hd)} m</text>`;
  const svg = `<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" role="img" aria-label="옥외탱크 배치도">${g}</svg>`;
  const tiles = [];
  tanks.forEach((t) => { tiles.push({ l: `${t.no}번 ~ 방유제`, v: v.hiFlash ? '기준 없음' : fx(t.dike), u: v.hiFlash ? '' : 'm' }, { l: `${t.no}번 보유공지`, v: fx(t.space), u: 'm' }); });
  if (t2) tiles.push({ l: '탱크 사이', v: fx(gap), u: 'm', tone: 'key' });
  tiles.push({ l: '방유제 최소 크기', v: `${fx(Wd)} × ${fx(Hd)}`, u: 'm' });
  return {
    title, tiles, warns,
    notes: ['탱크를 가로로 나란히 두고, 방유제는 기준 거리를 지키는 가장 작은 직사각형으로 그렸어요. 점선 원은 보유공지 범위예요.', '탱크 사이 최소 거리는 두 탱크 보유공지 중 큰 값이에요.'],
    extraTop: `<div class="drawing">${svg}</div><div class="legend"><span><i class="lg-dike"></i>방유제</span><span><i class="lg-tank"></i>탱크</span><span><i class="lg-space"></i>보유공지</span><span><i class="lg-dim"></i>최소 거리</span></div>`,
    steps,
  };
}

/* =========================================================
   ⑥ 계산 — 가스계 (+ 토너먼트 배관도)
   ========================================================= */
// 토너먼트 배치: [값, 헤드 수, 표시]
const GAS_LAYOUTS = [['2x1', 2, '2개 (2 × 1)'], ['2x2', 4, '4개 (2 × 2)'], ['4x2', 8, '8개 (4 × 2)'], ['4x4', 16, '16개 (4 × 4)'], ['8x4', 32, '32개 (8 × 4)'], ['8x8', 64, '64개 (8 × 8)']];
// 전역방출 기준 방사시간 (초)
function gasTime(v) {
  if (v.agent === 'co2') return v.co2fire === 'surface' ? { s: 60, why: '이산화탄소 표면화재 1분 (60초)' } : { s: 420, why: '이산화탄소 심부화재 7분 (420초)' };
  if (v.agent === 'halon') return { s: 10, why: '할론 10초' };
  if (v.agent === 'powder') return { s: 30, why: '분말 30초' };
  if (v.agent === 'halo') return { s: 10, why: '할로겐화합물 10초' };
  return v.cls === 'B' ? { s: 60, why: '불활성기체 B급 화재 1분 (60초)' } : { s: 120, why: '불활성기체 A·C급 화재 2분 (120초)' };
}
function halonFill(v) {
  const key = v.halonType === '2402' ? (v.halonPress === 'p' ? '2402p' : '2402s') : v.halonType;
  const [min, max, incl] = STD.halon.fill[key];
  const kind = v.halonType === '2402' ? (v.halonPress === 'p' ? ' 가압식' : ' 축압식') : '';
  return { min, max, incl, ok: (f) => f >= min && (incl ? f <= max : f < max), text: `할론 ${v.halonType}${kind}: ${min} 이상 ${max} ${incl ? '이하' : '미만'}` };
}
function isLocal(v) { return (v.agent === 'co2' || v.agent === 'powder') && v.method === 'local'; }

/* 국소방출 입면화재: 방호공간 (방호대상물 각 부분에서 0.6m로 둘러싼 공간) */
function localSpace(v) {
  const g = STD.co2.local.gap;
  if (bad(v.oL) || bad(v.oW) || bad(v.oH)) return { error: '방호대상물 가로·세로·높이에 0보다 큰 값을 넣어 주세요.' };
  const sides = [['dl', '왼쪽'], ['dr', '오른쪽'], ['df', '앞쪽'], ['db', '뒤쪽']];
  const e = {}, wall = {};
  sides.forEach(([k]) => {
    const d = v[k];
    wall[k] = typeof d === 'number' && Number.isFinite(d) && d >= 0 && d <= g;
    e[k] = wall[k] ? d : g;
  });
  const X = v.oL + e.dl + e.dr, Y = v.oW + e.df + e.db, Z = v.oH + g;
  const V = X * Y * Z, A = 2 * (X + Y) * Z;
  const wh = v.wallH > 0 ? Math.min(v.wallH, Z) : Z;
  const face = { dl: Y, dr: Y, df: X, db: X };
  const parts = sides.filter(([k]) => wall[k]).map(([k, nm]) => ({ nm, w: face[k] }));
  const a = parts.reduce((s, p) => s + p.w * wh, 0);
  const steps = [
    step({ t: '방호공간 크기', f: 'X = L + e<sub>좌</sub> + e<sub>우</sub><br>Y = W + e<sub>앞</sub> + e<sub>뒤</sub><br>Z = H + 0.6', sym: [['X', '방호공간 가로 (m)'], ['Y', '방호공간 세로 (m)'], ['Z', '방호공간 높이 (m)'], ['L', '방호대상물 가로 (m)'], ['W', '방호대상물 세로 (m)'], ['H', '방호대상물 높이 (m)'], ['e', '면마다 더하는 거리: 벽이 없으면 0.6m, 0.6m 안에 벽이 있으면 벽까지 거리']], sub: `X = ${fx(v.oL)} + ${fx(e.dl)} + ${fx(e.dr)} = ${fx(X)} m<br>Y = ${fx(v.oW)} + ${fx(e.df)} + ${fx(e.db)} = ${fx(Y)} m<br>Z = ${fx(v.oH)} + 0.6 = ${fx(Z)} m` }),
    step({ t: '방호공간 체적', f: 'V = X × Y × Z', sym: [['V', '방호공간 체적 (㎥)']], sub: `V = ${fx(X)} × ${fx(Y)} × ${fx(Z)}`, ans: `${fx(V)} ㎥` }),
    step({ t: '방호공간 벽 면적 합계', f: 'A = 2 × (X + Y) × Z', sym: [['A', '방호공간 네 옆면 면적 합계 (㎡). 실제로 벽이 없는 면도 벽이 있다고 보고 계산']], sub: `A = 2 × (${fx(X)} + ${fx(Y)}) × ${fx(Z)}`, ans: `${fx(A)} ㎡` }),
    step({ t: '실제 벽 면적 합계', f: 'a = Σ(벽 있는 면의 너비 × 벽 높이)', sym: [['a', '방호대상물에서 0.6m 안에 실제로 있는 벽 면적 합계 (㎡)']], sub: parts.length ? `a = ${parts.map((p) => `${fx(p.w)} × ${fx(wh)} (${p.nm})`).join(' + ')}` : 'a = 0 (0.6m 안에 벽 없음)', ans: `${fx(a)} ㎡` }),
  ];
  // 평면도
  const s = Math.min(520 / X, 300 / Y), pad = 56;
  const PX = (x) => +(pad + x * s).toFixed(1), PY = (y) => +(pad + (Y - y) * s).toFixed(1);
  let o = `<rect class="space" x="${PX(0)}" y="${PY(Y)}" width="${(X * s).toFixed(1)}" height="${(Y * s).toFixed(1)}"/>`;
  o += `<rect class="box" x="${PX(e.dl)}" y="${PY(e.df + v.oW)}" width="${(v.oL * s).toFixed(1)}" height="${(v.oW * s).toFixed(1)}"/>`;
  o += `<text class="lk" x="${PX(e.dl + v.oL / 2)}" y="${PY(e.df + v.oW / 2) + 4}" text-anchor="middle">방호대상물 ${fx(v.oL)} × ${fx(v.oW)}</text>`;
  if (wall.dl) o += `<line class="wall" x1="${PX(0)}" y1="${PY(0)}" x2="${PX(0)}" y2="${PY(Y)}"/>`;
  if (wall.dr) o += `<line class="wall" x1="${PX(X)}" y1="${PY(0)}" x2="${PX(X)}" y2="${PY(Y)}"/>`;
  if (wall.df) o += `<line class="wall" x1="${PX(0)}" y1="${PY(0)}" x2="${PX(X)}" y2="${PY(0)}"/>`;
  if (wall.db) o += `<line class="wall" x1="${PX(0)}" y1="${PY(Y)}" x2="${PX(X)}" y2="${PY(Y)}"/>`;
  const lbl = (x, y, d) => (d > 0 ? `<text class="dt" x="${x}" y="${y}" text-anchor="middle">${fx(d)}</text>` : '');
  o += lbl(PX(e.dl / 2), PY(Y / 2) + 4, e.dl) + lbl(PX(X - e.dr / 2), PY(Y / 2) + 4, e.dr);
  o += lbl(PX(X / 2), PY(e.df / 2) + 4, e.df) + lbl(PX(X / 2), PY(Y - e.db / 2) + 4, e.db);
  o += `<text class="lk" x="${PX(X / 2)}" y="${PY(Y) - 22}" text-anchor="middle">뒤쪽</text><text class="lk" x="${PX(X / 2)}" y="${PY(0) + 34}" text-anchor="middle">앞쪽</text>`;
  o += `<text class="lk" x="${PX(0) - 10}" y="${PY(Y / 2) + 4}" text-anchor="end">왼쪽</text><text class="lk" x="${PX(X) + 10}" y="${PY(Y / 2) + 4}">오른쪽</text>`;
  o += `<text x="${PX(X / 2)}" y="${PY(Y) - 8}" text-anchor="middle">방호공간 ${fx(X)} × ${fx(Y)} m, 높이 ${fx(Z)} m</text>`;
  const svg = `<svg viewBox="0 0 ${(X * s + 2 * pad).toFixed(0)} ${(Y * s + 2 * pad).toFixed(0)}" role="img" aria-label="국소방출 방호공간 평면도">${o}</svg>`;
  const card = {
    title: '방호공간 (위에서 본 평면)',
    tiles: [{ l: '방호공간 체적 V', v: fx(V), u: '㎥' }, { l: '벽 면적 합계 A', v: fx(A), u: '㎡' }, { l: '실제 벽 면적 a', v: fx(a), u: '㎡' }, { l: 'a ÷ A', v: fx(a / A, 3) }],
    notes: ['점선이 방호공간이고, 굵은 선이 실제 벽이에요. 숫자는 방호대상물에서 방호공간 경계(또는 벽)까지 거리(m)예요.'],
    extraTop: `<div class="drawing">${svg}</div><div class="legend"><span><i class="lg-space"></i>방호공간 (0.6m)</span><span><i class="lg-wall"></i>실제 벽</span></div>`,
  };
  return { X, Y, Z, V, A, a, steps, card };
}

function calcGas(v) {
  const local = isLocal(v), steps = [], warns = [], extraTiles = [];
  const err = (m) => ({ error: m });
  let V = 0, Wt, unit = 'kg', bottles = null, bottleNote = '', name = '';
  const Ao = n0(v.Ao);
  if (!local) {
    if (bad(v.L) || bad(v.W) || bad(v.H)) return err('방호구역 가로·세로·높이에 0보다 큰 값을 넣어 주세요.');
    V = v.L * v.W * v.H;
    steps.push(step({ t: '방호구역 체적', f: 'V = L × W × H', sym: [['V', '방호구역 체적 (㎥)'], ['L', '가로 (m)'], ['W', '세로 (m)'], ['H', '높이 (m)']], sub: `V = ${fx(v.L)} × ${fx(v.W)} × ${fx(v.H)}`, ans: `${fx(V)} ㎥` }));
  }
  let space = null;
  if (local && v.localFire === 'solid') {
    space = localSpace(v);
    if (space.error) return err(space.error);
    steps.push(...space.steps);
  }
  if (local && v.localFire === 'plane' && bad(v.As)) return err('방호대상물 표면적에 0보다 큰 값을 넣어 주세요.');

  // 1병당 충전량 = 내용적 ÷ 충전비
  const perBottle = (Vc, F, range, label) => {
    if (bad(Vc) || bad(F)) return null;
    const kg = Vc / F;
    steps.push(step({ t: '1병당 충전량', f: 'w = V<sub>c</sub> ÷ C', sym: [['w', '1병당 약제량 (kg)'], ['V<sub>c</sub>', '저장용기 내용적 (L)'], ['C', '충전비 (L/kg)']], sub: `w = ${fx(Vc)} ÷ ${fx(F)}`, ans: `${fx(kg)} kg` }));
    if (F < range[0] || F > range[1]) warns.push(`${label} 충전비는 ${range[0]} 이상 ${range[1]} 이하여야 해요. 지금 넣은 값: ${fx(F)}`);
    return kg;
  };
  const symOpen = [['A', '자동폐쇄장치 없는 개구부 면적 (㎡)'], ['K₂', '개구부 1㎡당 가산량 (kg/㎡)']];

  if (v.agent === 'co2') {
    const hi = v.co2Type !== 'low', typeName = hi ? '고압식' : '저압식';
    name = `이산화탄소 (${typeName})`;
    if (local) {
      const lc = STD.co2.local, k = lc.k[hi ? 'high' : 'low'];
      if (v.localFire === 'plane') {
        Wt = v.As * lc.surface * k;
        steps.push(step({ t: '약제량 (국소·평면화재)', f: `W = A<sub>s</sub> × ${lc.surface} × k`, sym: [['W', '약제량 (kg)'], ['A<sub>s</sub>', '방호대상물 표면적 (㎡)'], [String(lc.surface), '표면적 1㎡당 약제량 (kg/㎡)'], ['k', `고압식 ${lc.k.high}, 저압식 ${lc.k.low}`]], sub: `W = ${fx(v.As)} × ${lc.surface} × ${k}`, ans: `${fx(Wt)} kg` }));
      } else {
        const q = lc.X - lc.Y * space.a / space.A;
        steps.push(step({ t: '방호공간 1㎥당 약제량', f: `Q = ${lc.X} − ${lc.Y} × a ÷ A`, sym: [['Q', '방호공간 1㎥당 약제량 (kg/㎥)'], ['a', '실제 벽 면적 합계 (㎡)'], ['A', '방호공간 벽 면적 합계 (㎡)']], sub: `Q = ${lc.X} − ${lc.Y} × ${fx(space.a)} ÷ ${fx(space.A)}`, ans: `${fx(q, 3)} kg/㎥` }));
        Wt = space.V * q * k;
        steps.push(step({ t: '약제량 (국소·입면화재)', f: 'W = V × Q × k', sym: [['W', '약제량 (kg)'], ['V', '방호공간 체적 (㎥)'], ['Q', '방호공간 1㎥당 약제량 (kg/㎥)'], ['k', `고압식 ${lc.k.high}, 저압식 ${lc.k.low}`]], sub: `W = ${fx(space.V)} × ${fx(q, 3)} × ${k}`, ans: `${fx(Wt)} kg` }));
      }
    } else if (v.co2fire === 'surface') {
      const [, k, min] = pickLT(STD.co2.surface, V);
      const base0 = V * k, base = Math.max(base0, min), corr = v.corr > 0 ? v.corr : 1;
      steps.push(step({ t: '기본 약제량 (표면화재)', f: 'W₀ = V × K₁', sym: [['W₀', '기본 약제량 (kg)'], ['V', '방호구역 체적 (㎥)'], ['K₁', '체적 1㎥당 약제량 (kg/㎥)']], sub: `W₀ = ${fx(V)} × ${fx(k)} = ${fx(base0)}${base0 < min ? ` → 최저량 ${min} kg 적용` : ''}`, ans: `${fx(base)} kg`, note: `체적 구간에 따라 K₁ = ${k} kg/㎥, 최저량 ${min} kg` }));
      Wt = base * corr + Ao * STD.co2.surfaceOpen;
      steps.push(step({ t: '약제량 (전역·표면화재)', f: 'W = W₀ × N + A × K₂', sym: [['W', '약제량 (kg)'], ['W₀', '기본 약제량 (kg)'], ['N', '설계농도 보정계수'], ...symOpen], sub: `W = ${fx(base)} × ${fx(corr)} + ${fx(Ao)} × ${STD.co2.surfaceOpen}`, ans: `${fx(Wt)} kg` }));
    } else {
      const [k, label] = STD.co2.deep[v.co2deep];
      Wt = V * k + Ao * STD.co2.deepOpen;
      steps.push(step({ t: '약제량 (전역·심부화재)', f: 'W = V × K₁ + A × K₂', sym: [['W', '약제량 (kg)'], ['V', '방호구역 체적 (㎥)'], ['K₁', '체적 1㎥당 약제량 (kg/㎥)'], ...symOpen], sub: `W = ${fx(V)} × ${k} + ${fx(Ao)} × ${STD.co2.deepOpen}`, ans: `${fx(Wt)} kg`, note: label }));
    }
    const kg = perBottle(v.co2V, v.co2F, STD.co2.fill[hi ? 'high' : 'low'], typeName);
    if (kg === null) return err('저장용기 내용적과 충전비에 0보다 큰 값을 넣어 주세요.');
    bottles = up(Wt / kg); bottleNote = `${fx(Wt)} ÷ ${fx(kg)}`;
  } else if (v.agent === 'halon') {
    name = `할론 ${v.halonType}`;
    const [label, tbl] = STD.halon.kinds[v.halonKind];
    if (!tbl[v.halonType]) return err(`${label}에는 할론 ${v.halonType} 기준값이 없어요. 기준표에 있는 약제: ${Object.keys(tbl).map((x) => '할론 ' + x).join(', ')}`);
    const [k, kA] = tbl[v.halonType];
    Wt = V * k + Ao * kA;
    steps.push(step({ t: '약제량', f: 'W = V × K₁ + A × K₂', sym: [['W', '약제량 (kg)'], ['V', '방호구역 체적 (㎥)'], ['K₁', '체적 1㎥당 약제량 (kg/㎥)'], ...symOpen], sub: `W = ${fx(V)} × ${k} + ${fx(Ao)} × ${kA}`, ans: `${fx(Wt)} kg`, note: label }));
    const hf = halonFill(v);
    if (bad(v.halonKg)) return err('저장용기 1병 충전량(kg)에 0보다 큰 값을 넣어 주세요.');
    if (!hf.ok(v.halonF)) return err(`충전비를 범위 안으로 넣어 주세요. ${hf.text}`);
    const cvol = v.halonKg * v.halonF;
    steps.push(step({ t: '저장용기 내용적', f: 'V<sub>c</sub> = w × C', sym: [['V<sub>c</sub>', '저장용기 1병 내용적 (L)'], ['w', '1병당 충전량 (kg)'], ['C', `충전비 (L/kg), ${hf.text}`]], sub: `V<sub>c</sub> = ${fx(v.halonKg)} × ${fx(v.halonF)}`, ans: `${fx(cvol)} L` }));
    extraTiles.push({ l: '용기 1병 내용적', v: fx(cvol), u: 'L' });
    bottles = up(Wt / v.halonKg); bottleNote = `${fx(Wt)} ÷ ${fx(v.halonKg)}`;
  } else if (v.agent === 'halo' || v.agent === 'inert') {
    const isHalo = v.agent === 'halo', cl = STD.clean;
    const key = isHalo ? v.haloAgent : v.inertAgent;
    const [k1, k2] = (isHalo ? cl.halo : cl.inert)[key];
    name = `${isHalo ? '할로겐화합물' : '불활성기체'} ${key}`;
    if (bad(v.conc)) return err('소화농도에 0보다 큰 값을 넣어 주세요.');
    const t = n0(v.t), Ss = k1 + k2 * t, sf = cl.safety[v.cls], C = v.conc * sf;
    if (C >= 100) return err('설계농도가 100% 이상이 됐어요. 소화농도를 확인해 주세요.');
    steps.push(step({ t: '선형상수', f: 'S = K₁ + K₂ × t', sym: [['S', '소화약제별 선형상수 (㎥/kg)'], ['K₁', `약제 상수 (${key})`], ['K₂', `약제 상수 (${key})`], ['t', '방호구역 최소 예상온도 (℃)']], sub: `S = ${k1} + ${k2} × ${fx(t)}`, ans: `${fx(Ss, 4)} ㎥/kg` }));
    steps.push(step({ t: '설계농도', f: 'C = C₀ × 안전계수', sym: [['C', '설계농도 (%)'], ['C₀', '소화농도 (%)'], ['안전계수', `${v.cls === 'B' ? 'B급' : 'A·C급'} 화재 ${sf}`]], sub: `C = ${fx(v.conc)} × ${sf}`, ans: `${fx(C)} %` }));
    const C95 = C * cl.ratio95;
    if (isHalo) {
      Wt = V / Ss * C / (100 - C);
      steps.push(step({ t: '약제량', f: 'W = V ÷ S × C ÷ (100 − C)', sym: [['W', '약제량 (kg)'], ['V', '방호구역 체적 (㎥)'], ['S', '선형상수 (㎥/kg)'], ['C', '설계농도 (%)']], sub: `W = ${fx(V)} ÷ ${fx(Ss, 4)} × ${fx(C)} ÷ ${fx(100 - C)}`, ans: `${fx(Wt)} kg` }));
      const W95 = V / Ss * C95 / (100 - C95), tt = cl.timeHalo, q = W95 / tt;
      steps.push(step({ t: '95% 방출량', f: "W' = V ÷ S × 0.95C ÷ (100 − 0.95C)", sym: [["W'", '최소설계농도의 95%에 해당하는 약제량 (kg)'], ['0.95C', '설계농도의 95% (%)']], sub: `W' = ${fx(V)} ÷ ${fx(Ss, 4)} × ${fx(C95)} ÷ ${fx(100 - C95)}`, ans: `${fx(W95)} kg` }));
      steps.push(step({ t: '방사 유량', f: "q = W' ÷ t", sym: [['q', '방사 유량 (kg/s)'], ["W'", '95% 방출량 (kg)'], ['t', `방사시간: 할로겐화합물 ${tt}초 이내`]], sub: `q = ${fx(W95)} ÷ ${tt}`, ans: `${fx(q)} kg/s` }));
      extraTiles.push({ l: '방사 유량', v: fx(q), u: 'kg/s' });
      if (bad(v.haloB)) return err('저장용기 1병 충전량에 0보다 큰 값을 넣어 주세요.');
      bottles = up(Wt / v.haloB); bottleNote = `${fx(Wt)} ÷ ${fx(v.haloB)}`;
    } else {
      const Vs = k1 + k2 * cl.baseTemp;
      const X = 2.303 * (Vs / Ss) * Math.log10(100 / (100 - C));
      Wt = X * V; unit = '㎥';
      steps.push(step({ t: '20℃ 비체적', f: 'V<sub>s</sub> = K₁ + K₂ × 20', sym: [['V<sub>s</sub>', '20℃에서 소화약제의 비체적 (㎥/kg)']], sub: `V<sub>s</sub> = ${k1} + ${k2} × 20`, ans: `${fx(Vs, 4)} ㎥/kg` }));
      steps.push(step({ t: '1㎥당 약제량', f: 'X = 2.303 × (V<sub>s</sub> ÷ S) × log(100 ÷ (100 − C))', sym: [['X', '방호구역 1㎥당 약제 부피 (㎥/㎥)'], ['V<sub>s</sub>', '20℃ 비체적 (㎥/kg)'], ['S', '선형상수 (㎥/kg)'], ['C', '설계농도 (%)'], ['log', '상용로그']], sub: `X = 2.303 × (${fx(Vs, 4)} ÷ ${fx(Ss, 4)}) × log(100 ÷ ${fx(100 - C)})`, ans: `${fx(X, 4)} ㎥/㎥` }));
      steps.push(step({ t: '약제량', f: 'Q = X × V', sym: [['Q', '약제량 (㎥)'], ['X', '1㎥당 약제 부피 (㎥/㎥)'], ['V', '방호구역 체적 (㎥)']], sub: `Q = ${fx(X, 4)} × ${fx(V)}`, ans: `${fx(Wt)} ㎥` }));
      const X95 = 2.303 * (Vs / Ss) * Math.log10(100 / (100 - C95)), Q95 = X95 * V, tt = cl.timeInert[v.cls], q = Q95 / tt;
      steps.push(step({ t: '95% 방출량', f: "Q' = 2.303 × (V<sub>s</sub> ÷ S) × log(100 ÷ (100 − 0.95C)) × V", sym: [["Q'", '최소설계농도의 95%에 해당하는 약제량 (㎥)'], ['0.95C', '설계농도의 95% (%)']], sub: `Q' = 2.303 × (${fx(Vs, 4)} ÷ ${fx(Ss, 4)}) × log(100 ÷ ${fx(100 - C95)}) × ${fx(V)}`, ans: `${fx(Q95)} ㎥` }));
      steps.push(step({ t: '방사 유량', f: "q = Q' ÷ t", sym: [['q', '방사 유량 (㎥/s)'], ["Q'", '95% 방출량 (㎥)'], ['t', `방사시간: ${v.cls === 'B' ? 'B급 60초 (1분)' : 'A·C급 120초 (2분)'} 이내`]], sub: `q = ${fx(Q95)} ÷ ${tt}`, ans: `${fx(q, 3)} ㎥/s (${fx(q * 60)} ㎥/min)` }));
      extraTiles.push({ l: '방사 유량', v: fx(q * 60), u: '㎥/min' });
      if (bad(v.inertB)) return err('저장용기 1병 약제량에 0보다 큰 값을 넣어 주세요.');
      bottles = up(Wt / v.inertB); bottleNote = `${fx(Wt)} ÷ ${fx(v.inertB)}`;
    }
  } else {
    const ty = v.powderType, [kG, kA, fill] = STD.powder[ty], [kP, pX, pY] = STD.powderLocal[ty], k = STD.powderLocalK;
    name = `분말 제${ty}종`;
    if (local) {
      if (v.localFire === 'plane') {
        Wt = v.As * kP * k;
        steps.push(step({ t: '약제량 (국소·평면화재)', f: `W = A<sub>s</sub> × ${kP} × ${k}`, sym: [['W', '약제량 (kg)'], ['A<sub>s</sub>', '방호대상물 표면적 (㎡)'], [String(kP), `제${ty}종 표면적 1㎡당 약제량 (kg/㎡)`], [String(k), '할증 계수']], sub: `W = ${fx(v.As)} × ${kP} × ${k}`, ans: `${fx(Wt)} kg` }));
      } else {
        const q = pX - pY * space.a / space.A;
        steps.push(step({ t: '방호공간 1㎥당 약제량', f: `Q = ${pX} − ${pY} × a ÷ A`, sym: [['Q', '방호공간 1㎥당 약제량 (kg/㎥)'], [String(pX), `제${ty}종 X 값`], [String(pY), `제${ty}종 Y 값`], ['a', '실제 벽 면적 합계 (㎡)'], ['A', '방호공간 벽 면적 합계 (㎡)']], sub: `Q = ${pX} − ${pY} × ${fx(space.a)} ÷ ${fx(space.A)}`, ans: `${fx(q, 3)} kg/㎥` }));
        Wt = space.V * q * k;
        steps.push(step({ t: '약제량 (국소·입면화재)', f: `W = V × Q × ${k}`, sym: [['W', '약제량 (kg)'], ['V', '방호공간 체적 (㎥)'], ['Q', '방호공간 1㎥당 약제량 (kg/㎥)'], [String(k), '할증 계수']], sub: `W = ${fx(space.V)} × ${fx(q, 3)} × ${k}`, ans: `${fx(Wt)} kg` }));
      }
    } else {
      Wt = V * kG + Ao * kA;
      steps.push(step({ t: '약제량 (전역)', f: 'W = V × K₁ + A × K₂', sym: [['W', '약제량 (kg)'], ['V', '방호구역 체적 (㎥)'], ['K₁', '체적 1㎥당 약제량 (kg/㎥)'], ...symOpen], sub: `W = ${fx(V)} × ${kG} + ${fx(Ao)} × ${kA}`, ans: `${fx(Wt)} kg` }));
    }
    const vol = Wt * fill;
    steps.push(step({ t: '저장용기 내용적', f: 'V<sub>c</sub> = W × C', sym: [['V<sub>c</sub>', '저장용기 내용적 (L)'], ['W', '약제량 (kg)'], ['C', '충전비 (L/kg)']], sub: `V<sub>c</sub> = ${fx(Wt)} × ${fill}`, ans: `${fx(vol)} L` }));
    extraTiles.push({ l: '저장용기 내용적', v: fx(vol), u: 'L', tone: 'key' });
  }
  if (bottles !== null) steps.push(step({ t: '저장용기 수', f: 'n = ⌈W ÷ w⌉', sym: [['n', '저장용기 수 (병)'], ['W', `약제량 (${unit})`], ['w', `1병당 약제량 (${unit})`], ['⌈ ⌉', '올림']], sub: `n = ⌈${bottleNote}⌉`, ans: `${bottles}병` }));

  const cards = [];
  const head = { title: `${name} 소화설비 (${local ? '국소방출' : '전역방출'})`, steps, warns };
  const tiles = [];
  if (local) tiles.push(v.localFire === 'plane' ? { l: '방호대상물 표면적', v: fx(v.As), u: '㎡' } : { l: '방호공간 체적', v: fx(space.V), u: '㎥' });
  else tiles.push({ l: '방호구역 체적', v: fx(V), u: '㎥' });
  tiles.push({ l: '약제량', v: fx(Wt), u: unit, tone: 'key' });
  if (bottles !== null) tiles.push({ l: '저장용기', v: fx(bottles), u: '병', tone: 'key' });
  tiles.push(...extraTiles);
  if (!local) {
    let [hx, hy] = v.layout.split('x').map(Number), heads = hx * hy, drawNote = '';
    if (v.headMode === 'calc') {
      const tm = gasTime(v), ts = v.hT > 0 ? v.hT : tm.s, tmin = ts / 60;
      steps.push(step({ t: '방사시간', sub: `${v.hT > 0 ? `직접 입력 ${fx(ts)}초` : `기준값: ${tm.why}`} → 식에는 분 단위로 t = ${fx(tmin, 3)}분을 넣어요` }));
      if (bad(v.hA) || bad(v.hQ)) {
        heads = NaN;
        warns.push('헤드 1개 분구면적과 방출률을 넣으면 분사헤드 수가 나와요.');
      } else {
        const per = v.hA * v.hQ * tmin;
        heads = up(Wt / per);
        steps.push(step({ t: '분사헤드 수', f: 'n<sub>h</sub> = ⌈W ÷ (a × q × t)⌉', sym: [['n<sub>h</sub>', '분사헤드 수 (개)'], ['W', `약제량 (${unit})`], ['a', '헤드 1개 분구면적 (㎟)'], ['q', `방출률 (${unit}/㎟·min)`], ['t', '방사시간 (min)'], ['⌈ ⌉', '올림']], sub: `n<sub>h</sub> = ⌈${fx(Wt)} ÷ (${fx(v.hA)} × ${fx(v.hQ)} × ${fx(tmin, 3)})⌉ = ⌈${fx(Wt)} ÷ ${fx(per)}⌉`, ans: `${heads}개` }));
        const lay = GAS_LAYOUTS.find(([, n]) => n >= heads);
        if (lay) {
          [hx, hy] = lay[0].split('x').map(Number);
          if (lay[1] !== heads) drawNote = `토너먼트 배관은 헤드 수가 2, 4, 8, 16…개여야 고르게 나뉘어서, 배관도는 ${heads}개 이상인 가장 작은 배치인 ${lay[1]}개(가로 ${hx} × 세로 ${hy})로 그렸어요.`;
        } else { hx = hy = 0; drawNote = '헤드가 64개를 넘으면 배관도는 그리지 않아요.'; }
      }
    }
    const perHead = Wt / heads;
    if (Number.isFinite(perHead)) steps.push(step({ t: '헤드 1개당 방사량', f: 'w<sub>h</sub> = W ÷ n<sub>h</sub>', sym: [['w<sub>h</sub>', `헤드 1개당 방사량 (${unit})`], ['W', `약제량 (${unit})`], ['n<sub>h</sub>', '분사헤드 수 (개)']], sub: `w<sub>h</sub> = ${fx(Wt)} ÷ ${heads}`, ans: `${fx(perHead)} ${unit}` }));
    tiles.push({ l: '분사헤드', v: fx(heads), u: '개' }, { l: '헤드 1개당', v: fx(perHead), u: unit });
    head.tiles = tiles;
    cards.push(head);
    if (hx > 0 && Number.isFinite(heads)) {
      const dc = gasDrawingCard(v.L, v.W, hx, hy);
      if (drawNote) dc.notes = [drawNote, ...(dc.notes || [])];
      cards.push(dc);
    } else if (drawNote) cards.push({ title: '분사헤드 배관도 (토너먼트)', notes: [drawNote] });
  } else {
    head.tiles = tiles;
    cards.push(head);
    if (space) cards.push(space.card);
  }
  return { cards };
}

function gasDrawingCard(L, W, nx, ny) {
  const s = Math.min(720 / L, 430 / W);
  const pad = { l: 46, r: 24, t: 44, b: 70 };
  const w = L * s, h = W * s, VW = w + pad.l + pad.r, VH = h + pad.t + pad.b;
  const X = (x) => +(pad.l + x * s).toFixed(1), Y = (y) => +(pad.t + (W - y) * s).toFixed(1);
  const segs = [], heads = [];
  let first = null;
  // H자 모양으로 가로·세로 번갈아 둘로 나눠서, 모든 헤드까지 배관 길이가 같게 해요
  (function rec(x0, y0, x1, y1, cx, cy, prev) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    if (cx === 1 && cy === 1) { heads.push([mx, my]); return; }
    const dir = cx > cy ? 'h' : cy > cx ? 'v' : (prev === 'h' ? 'v' : 'h');
    if (!first) first = dir;
    if (dir === 'h') {
      segs.push({ a: [(x0 + mx) / 2, my], b: [(mx + x1) / 2, my], n: cx * cy });
      rec(x0, y0, mx, y1, cx / 2, cy, 'h'); rec(mx, y0, x1, y1, cx / 2, cy, 'h');
    } else {
      segs.push({ a: [mx, (y0 + my) / 2], b: [mx, (my + y1) / 2], n: cx * cy });
      rec(x0, y0, x1, my, cx, cy / 2, 'v'); rec(x0, my, x1, y1, cx, cy / 2, 'v');
    }
  })(0, 0, L, W, nx, ny, null);
  const r = Math.max(4, Math.min(7, s * 0.15));
  let o = `<rect class="room" x="${X(0)}" y="${Y(W)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
  // 저장용기실에서 들어오는 주배관
  const feedFrom = first === 'v' ? [0, W / 2] : [L / 2, 0];
  const boxY = Y(0) + 14;
  o += `<line class="feed" x1="${X(feedFrom[0])}" y1="${first === 'v' ? Y(feedFrom[1]) : boxY}" x2="${X(L / 2)}" y2="${Y(W / 2)}"/>`;
  if (first !== 'v') {
    o += `<rect class="box" x="${X(L / 2) - 46}" y="${boxY}" width="92" height="26" rx="4"/><text class="lk" x="${X(L / 2)}" y="${boxY + 17}" text-anchor="middle" style="stroke:none">저장용기실</text>`;
  }
  segs.forEach((g, k) => {
    o += `<line class="${k === 0 ? 'cross' : 'branch'}" x1="${X(g.a[0])}" y1="${Y(g.a[1])}" x2="${X(g.b[0])}" y2="${Y(g.b[1])}"/>`;
    const mxp = (X(g.a[0]) + X(g.b[0])) / 2, myp = (Y(g.a[1]) + Y(g.b[1])) / 2;
    const horiz = g.a[1] === g.b[1];
    [[(X(g.a[0]) + mxp) / 2, (Y(g.a[1]) + myp) / 2], [(X(g.b[0]) + mxp) / 2, (Y(g.b[1]) + myp) / 2]].forEach(([tx, ty]) => {
      o += `<text class="lb" x="${tx.toFixed(1)}" y="${(horiz ? ty - 5 : ty + 3).toFixed(1)}" ${horiz ? 'text-anchor="middle"' : `dx="6"`}>${g.n / 2}</text>`;
    });
  });
  heads.forEach(([hx_, hy_], i) => {
    o += `<circle class="head" cx="${X(hx_)}" cy="${Y(hy_)}" r="${r}"/>`;
    if (heads.length <= 64) o += `<text class="hn" x="${(X(hx_) + r + 1).toFixed(1)}" y="${(Y(hy_) + r + 8).toFixed(1)}">${i + 1}</text>`;
  });
  const yd = pad.t - 22, xd = pad.l - 22;
  o += `<line class="dim" x1="${X(0)}" y1="${yd}" x2="${X(L)}" y2="${yd}"/><text class="lk" x="${X(L / 2)}" y="${yd - 6}" text-anchor="middle">가로 ${fx(L)} m</text>`;
  o += `<line class="dim" x1="${xd}" y1="${Y(0)}" x2="${xd}" y2="${Y(W)}"/><text class="lk" x="${xd - 6}" y="${Y(W / 2)}" text-anchor="middle" transform="rotate(-90 ${xd - 6} ${Y(W / 2)})">세로 ${fx(W)} m</text>`;
  const svg = `<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" role="img" aria-label="가스계 분사헤드 토너먼트 배관도">${o}</svg>`;
  return {
    title: '분사헤드 배관도 (토너먼트)',
    notes: [`헤드 ${nx * ny}개를 가로 ${nx}열 × 세로 ${ny}행으로 균등 배치했어요. 갈라질 때마다 양쪽으로 같은 수의 헤드가 가도록 배관했어요.`, '배관 옆 숫자는 그 가지가 맡는 헤드 수예요. 배관 구경은 아직 계산하지 않아요.'],
    extraTop: `<div class="drawing">${svg}</div><div class="legend"><span><i class="lg-cross"></i>주배관</span><span><i class="lg-branch"></i>분기배관</span><span><i class="lg-head"></i>분사헤드</span></div>`,
  };
}

/* =========================================================
   ⑦ 계산 — 포소화설비 (헤드식)
   ========================================================= */
function calcFoam(v) {
  if (bad(v.L) || bad(v.W)) return { error: '가로와 세로에 0보다 큰 값을 넣어 주세요.' };
  const c = STD.foam, A = v.L * v.W, S = Number(v.S) / 100, steps = [], tiles = [], notes = [];
  const placeName = { parking: '차고·주차장', hangar: '항공기 격납고', special: '특수가연물 저장·취급 공장·창고' }[v.place];
  steps.push(step({ t: '바닥면적', f: 'A = L × W', sym: [['A', '바닥면적 (㎡)'], ['L', '가로 (m)'], ['W', '세로 (m)']], sub: `A = ${fx(v.L)} × ${fx(v.W)}`, ans: `${fx(A)} ㎡` }));
  let heads, headName, flowHead, solHead, sysName;

  if (v.sys === 'caf') {
    sysName = '압축공기포소화설비'; headName = '분사헤드';
    const per = v.cafArea === 'tank' ? c.caf.perTank : c.caf.perSpecial;
    heads = up(A / per);
    steps.push(step({ t: '분사헤드 개수', f: `n = ⌈A ÷ ${per}⌉`, sym: [['n', '분사헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(per), `${v.cafArea === 'tank' ? '유류탱크 주위' : '특수가연물 저장소'} 헤드 1개당 바닥면적 (㎡)`], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${per}⌉`, ans: `${heads}개` }));
    const q = c.caf.density[v.cafDensity], Az = v.zone > 0 ? v.zone : A;
    flowHead = Az * q; solHead = flowHead * c.time;
    steps.push(step({ t: '방출량', f: 'Q₁ = A<sub>z</sub> × q', sym: [['Q₁', '포수용액 방출량 (L/min)'], ['A<sub>z</sub>', '방호구역 면적 (㎡)'], ['q', `설계방출밀도: ${v.cafDensity === 'special' ? '특수가연물·알코올류·케톤류' : '일반가연물·탄화수소류'} (L/min·㎡)`]], sub: `Q₁ = ${fx(Az)} × ${q}`, ans: `${fx(flowHead)} L/min` }));
  } else {
    const capped = v.place !== 'hangar';
    const Az = capped ? Math.min(A, c.zoneMax) : A;
    steps.push(step({ t: '동시 방사 면적', sub: capped ? `바닥면적 ${fx(A)}㎡ → ${c.zoneMax}㎡를 넘으면 ${c.zoneMax}㎡ 안의 헤드만 동시에 방사` : '항공기 격납고: 헤드가 가장 많이 설치된 격납고의 헤드 전체가 동시에 방사 (격납고가 여러 동이면 그 격납고 크기를 넣으세요)', ans: `${fx(Az)} ㎡` }));
    if (v.sys === 'fw') {
      sysName = '포워터스프링클러설비'; headName = '포워터스프링클러헤드';
      heads = up(A / c.perHeadFW);
      const Nz = up(Az / c.perHeadFW);
      steps.push(step({ t: '헤드 개수', f: `n = ⌈A ÷ ${c.perHeadFW}⌉`, sym: [['n', '포워터스프링클러헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.perHeadFW), '헤드 1개당 바닥면적 (㎡)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${c.perHeadFW}⌉`, ans: `${heads}개` }));
      steps.push(step({ t: '동시 방사 헤드 수', f: `N = ⌈A<sub>z</sub> ÷ ${c.perHeadFW}⌉`, sym: [['N', '동시 방사 헤드 수 (개)'], ['A<sub>z</sub>', '동시 방사 면적 (㎡)']], sub: `N = ⌈${fx(Az)} ÷ ${c.perHeadFW}⌉`, ans: `${Nz}개` }));
      flowHead = Nz * c.fwQ; solHead = flowHead * c.time;
      steps.push(step({ t: '방사량', f: `Q₁ = N × ${c.fwQ}`, sym: [['Q₁', '포수용액 방사량 (L/min)'], ['N', '동시 방사 헤드 수 (개)'], [String(c.fwQ), '헤드 1개당 표준방사량 (L/min)']], sub: `Q₁ = ${Nz} × ${c.fwQ}`, ans: `${fx(flowHead)} L/min` }));
    } else {
      sysName = '포헤드설비'; headName = '포헤드';
      heads = up(A / c.perHead);
      steps.push(step({ t: '헤드 개수', f: `n = ⌈A ÷ ${c.perHead}⌉`, sym: [['n', '포헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.perHead), '헤드 1개당 바닥면적 (㎡)'], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(A)} ÷ ${c.perHead}⌉`, ans: `${heads}개` }));
      const rate = v.place === 'special' ? c.rateSpecial : c.rate[v.agentType];
      const rateWhy = v.place === 'special' ? '특수가연물 저장·취급: 약제 종류와 관계없이' : { protein: '단백포', synthetic: '합성계면활성제포', afff: '수성막포' }[v.agentType];
      flowHead = Az * rate; solHead = flowHead * c.time;
      steps.push(step({ t: '방사량', f: 'Q₁ = A<sub>z</sub> × q', sym: [['Q₁', '포수용액 방사량 (L/min)'], ['A<sub>z</sub>', '동시 방사 면적 (㎡)'], ['q', `바닥 1㎡당 방사량: ${rateWhy} (L/min·㎡)`]], sub: `Q₁ = ${fx(Az)} × ${rate}`, ans: `${fx(flowHead)} L/min` }));
    }
  }
  steps.push(step({ t: `${sysName} 포수용액량`, f: `V₁ = Q₁ × ${c.time}`, sym: [['V₁', '포수용액량 (L)'], ['Q₁', '방사량 (L/min)'], [String(c.time), '방사시간 (min)']], sub: `V₁ = ${fx(flowHead)} × ${c.time}`, ans: `${fx(solHead)} L` }));
  tiles.push({ l: '바닥면적', v: fx(A), u: '㎡' }, { l: headName, v: fx(heads), u: '개' });

  if (v.sensor && v.sys !== 'caf') {
    const ns = up(A / c.sensorArea);
    steps.push(step({ t: '감지용 스프링클러헤드', f: `n<sub>s</sub> = ⌈A ÷ ${c.sensorArea}⌉`, sym: [['n<sub>s</sub>', '자동기동용 감지 스프링클러헤드 개수 (개)'], ['A', '바닥면적 (㎡)'], [String(c.sensorArea), '헤드 1개당 경계면적 (㎡)']], sub: `n<sub>s</sub> = ⌈${fx(A)} ÷ ${c.sensorArea}⌉`, ans: `${ns}개` }));
    tiles.push({ l: '감지용 헤드', v: fx(ns), u: '개' });
  }

  let flowReel = 0, solReel = 0;
  if (v.place !== 'special' && n0(v.reelN) > 0) {
    const Nr = Math.min(n0(v.reelN), c.reelMax);
    const small = v.place === 'parking' && A <= c.zoneMax, qr = small ? c.reelQsmall : c.reelQ;
    flowReel = Nr * qr; solReel = flowReel * c.reelT;
    if (v.place === 'hangar') steps.push(step({ t: '호스릴포·포소화전 포수용액량', f: `V₂ = N × ${fx(qr * c.reelT / 1000)}`, sym: [['V₂', '호스릴포 포수용액량 (㎥)'], ['N', `호스릴포방수구가 가장 많은 격납고의 방수구 수 (최대 ${c.reelMax}개)`], [fx(qr * c.reelT / 1000), `방수구 1개당 수원 = ${qr} L/min × ${c.reelT}분 (㎥)`]], sub: `V₂ = ${Nr} × ${fx(qr * c.reelT / 1000)}`, ans: `${fx(solReel / 1000)} ㎥ (${fx(solReel)} L)` }));
    else steps.push(step({ t: '호스릴포·포소화전 포수용액량', f: `V₂ = N × ${qr} × ${c.reelT}`, sym: [['V₂', '호스릴포·포소화전 포수용액량 (L)'], ['N', `방수구 수 (최대 ${c.reelMax}개)`], [String(qr), `방수구 1개당 방사량 (L/min)${small ? ', 1개층 바닥면적 200㎡ 이하' : ''}`], [String(c.reelT), '방사시간 (min)']], sub: `V₂ = ${Nr} × ${qr} × ${c.reelT}`, ans: `${fx(solReel)} L` }));
  }
  let sol, flow;
  if (v.place === 'parking' && solReel > 0) {
    sol = Math.max(solHead, solReel); flow = Math.max(flowHead, flowReel);
    steps.push(step({ t: '포수용액량 (차고·주차장)', f: 'V = max(V₁, V₂)', sym: [['V', '포수용액량 (L)'], ['V₁', `${sysName} (L)`], ['V₂', '호스릴포·포소화전 (L)']], sub: `V = max(${fx(solHead)}, ${fx(solReel)})`, ans: `${fx(sol)} L`, note: '차고·주차장에 여러 설비를 같이 두면 설비별 수원 중 큰 값을 써요.' }));
  } else {
    sol = solHead + solReel; flow = flowHead + flowReel;
    if (solReel > 0) steps.push(step({ t: '포수용액량 합계', f: 'V = V₁ + V₂', sym: [['V', '포수용액량 합계 (L)']], sub: `V = ${fx(solHead)} + ${fx(solReel)}`, ans: `${fx(sol)} L`, note: v.place === 'hangar' ? '항공기 격납고: 헤드(또는 고정포방출구)가 가장 많은 격납고의 10분 방사량에 호스릴포 수원을 더해요.' : '' }));
  }
  const agent = sol * S, water = sol * (1 - S);
  steps.push(step({ t: '포 약제량', f: 'W = V × S', sym: [['W', '포 약제량 (L)'], ['V', '포수용액량 (L)'], ['S', '포 약제 농도']], sub: `W = ${fx(sol)} × ${fx(S)}`, ans: `${fx(agent)} L` }));
  steps.push(step({ t: '물 (약제 제외)', f: 'Q<sub>w</sub> = V × (1 − S)', sym: [['Q<sub>w</sub>', '약제를 뺀 물의 양 (L)']], sub: `Q<sub>w</sub> = ${fx(sol)} × ${fx(1 - S)}`, ans: `${fx(water)} L` }));
  steps.push(step({ t: '펌프 토출량', sub: v.place === 'parking' && solReel > 0 ? `큰 쪽 설비 기준: max(${fx(flowHead)}, ${fx(flowReel)})` : `${fx(flowHead)}${flowReel ? ` + ${fx(flowReel)}` : ''}`, ans: `${fx(flow)} L/min` }));
  const p = pump('fh', v, flow, null, '방출구 설계압력 환산수두');
  tiles.push({ l: '포수용액량', v: fx(sol / 1000), u: '㎥', tone: 'key' }, { l: '포 약제량', v: fx(agent), u: 'L', tone: 'key' }, { l: '물 (약제 제외)', v: fx(water / 1000), u: '㎥' }, ...pumpTiles(flow, p));
  if (n0(v.reelN) > c.reelMax && v.place !== 'special') notes.push(`호스릴포·포소화전 방수구는 최대 ${c.reelMax}개까지만 계산에 넣었어요.`);
  return { cards: [{ title: `${placeName} ${sysName}`, tiles, warns: [p.warn].filter(Boolean), notes, steps: [...steps, ...p.steps] }] };
}

/* =========================================================
   ⑧ 계산 — 물분무, 소화수조, 피난기구, 소화기구
   ========================================================= */
function calcSpray(v) {
  const k = STD.spray.kinds[v.kind], steps = [];
  let A;
  if (v.kind === 'transformer') {
    if (bad(v.tL) || bad(v.tW) || bad(v.tH)) return { error: '변압기 가로·세로·높이에 0보다 큰 값을 넣어 주세요.' };
    A = v.tL * v.tW + 2 * (v.tL + v.tW) * v.tH;
    steps.push(step({ t: '바닥을 뺀 표면적', f: 'A = a × b + 2 × (a + b) × h', sym: [['A', '바닥을 뺀 표면적 (㎡)'], ['a', '가로 (m)'], ['b', '세로 (m)'], ['h', '높이 (m)']], sub: `A = ${fx(v.tL)} × ${fx(v.tW)} + 2 × (${fx(v.tL)} + ${fx(v.tW)}) × ${fx(v.tH)}`, ans: `${fx(A)} ㎡` }));
  } else {
    if (bad(v.A)) return { error: '면적에 0보다 큰 값을 넣어 주세요.' };
    A = v.A;
  }
  const Aeff = Math.max(A, k.min), flow = Aeff * k.q, vol = flow * STD.spray.time / 1000;
  steps.push(step({ t: '펌프 토출량', f: `Q = A × ${k.q}`, sym: [['Q', '펌프 토출량 (L/min)'], ['A', k.min ? `면적 (㎡, 최소 ${k.min}㎡)` : '면적 (㎡)'], [String(k.q), '1㎡당 방사량 (L/min·㎡)']], sub: `Q = ${fx(Aeff)} × ${k.q}`, ans: `${fx(flow)} L/min`, note: A < k.min ? `면적이 ${k.min}㎡보다 작아서 ${k.min}㎡로 계산했어요.` : '' }));
  steps.push(step({ t: '수원', f: `V = Q × ${STD.spray.time} ÷ 1000`, sym: [['V', '수원 (㎥)'], ['Q', '토출량 (L/min)'], [String(STD.spray.time), '방사시간 (min)'], ['1000', 'L → ㎥ 환산']], sub: `V = ${fx(flow)} × ${STD.spray.time} ÷ 1000`, ans: `${fx(vol)} ㎥` }));
  const p = pump('ws', v, flow);
  return { cards: [{
    title: '물분무소화설비',
    tiles: [{ l: '면적', v: fx(Aeff), u: '㎡' }, { l: '수원', v: fx(vol), u: '㎥', tone: 'key' }, ...pumpTiles(flow, p)],
    warns: [p.warn].filter(Boolean),
    notes: [k.label],
    steps: [...steps, ...p.steps],
  }] };
}

function calcCistern(v) {
  if (bad(v.total)) return { error: '연면적에 0보다 큰 값을 넣어 주세요.' };
  const c = STD.cistern, f12 = n0(v.f12);
  const base = f12 >= c.bigArea ? c.baseBig : c.baseNormal;
  const units = up(v.total / base), Q = units * c.unit;
  const suction = pickLT(c.suction, Q)[1], intake = pickLT(c.intake, Q)[1], pumpQ = pickLT(c.pump, Q)[1];
  const steps = [
    step({ t: '기준면적', sub: `1층과 2층 바닥면적 합계 ${fx(f12)}㎡ → ${f12 >= c.bigArea ? `${fx(c.bigArea)}㎡ 이상` : `${fx(c.bigArea)}㎡ 미만`}`, ans: `${fx(base)} ㎡` }),
    step({ t: '저수량', f: `Q = ⌈A ÷ B⌉ × ${c.unit}`, sym: [['Q', '저수량 (㎥)'], ['A', '연면적 (㎡)'], ['B', '기준면적 (㎡)'], [String(c.unit), '기준면적당 저수량 (㎥)'], ['⌈ ⌉', '올림']], sub: `Q = ⌈${fx(v.total)} ÷ ${fx(base)}⌉ × ${c.unit} = ${units} × ${c.unit}`, ans: `${fx(Q)} ㎥` }),
    step({ t: '흡수관투입구', sub: `저수량 ${fx(Q)}㎥ → ${Q < 80 ? '80㎥ 미만' : '80㎥ 이상'}`, ans: `${suction}개` }),
    step({ t: '채수구', sub: `저수량 ${fx(Q)}㎥ → ${Q < 40 ? '40㎥ 미만' : Q < 100 ? '40㎥ 이상 100㎥ 미만' : '100㎥ 이상'}`, ans: `${intake}개` }),
  ];
  if (v.deep) steps.push(step({ t: '가압송수장치 양수량', sub: `지표면에서 ${c.deep}m 이상 깊은 지하 → 저수량 ${fx(Q)}㎥`, ans: `${fx(pumpQ)} L/min 이상` }));
  return { cards: [{
    title: '소화수조·저수조',
    tiles: [{ l: '저수량', v: fx(Q), u: '㎥', tone: 'key' }, { l: '흡수관투입구', v: suction, u: '개' }, { l: '채수구', v: intake, u: '개' }, { l: '가압송수장치 양수량', v: v.deep ? fx(pumpQ) : '해당 없음', u: v.deep ? 'L/min' : '' }],
    steps,
  }] };
}

function calcEvac(v) {
  const [base, label] = STD.evac.kinds[v.kind], steps = [];
  if (!(v.floors >= 1)) return { error: '설치 대상 층수를 1 이상으로 넣어 주세요.' };
  let perFloor;
  if (v.kind === 'apt') {
    if (bad(v.units)) return { error: '층당 세대 수를 넣어 주세요.' };
    perFloor = v.units;
    steps.push(step({ t: '층당 설치개수', sub: `계단실형 아파트: 각 세대마다 1개 → ${fx(v.units)}세대`, ans: `${perFloor}개` }));
  } else {
    if (bad(v.area)) return { error: '층 바닥면적에 0보다 큰 값을 넣어 주세요.' };
    perFloor = up(v.area / base);
    steps.push(step({ t: '층당 설치개수', f: `n = ⌈A ÷ ${base}⌉`, sym: [['n', '층당 피난기구 개수 (개)'], ['A', '층 바닥면적 (㎡)'], [String(base), `${label}의 기준면적 (㎡)`], ['⌈ ⌉', '올림']], sub: `n = ⌈${fx(v.area)} ÷ ${base}⌉`, ans: `${perFloor}개` }));
  }
  const rooms = v.kind === 'lodging' ? n0(v.rooms) : 0;
  const total = perFloor * v.floors + rooms;
  steps.push(step({ t: '전체 설치개수', f: 'n<sub>T</sub> = n × F + R', sym: [['n<sub>T</sub>', '전체 피난기구 개수 (개)'], ['n', '층당 개수 (개)'], ['F', '설치 대상 층수 (층)'], ['R', '숙박시설 객실마다 추가하는 완강기 (개)']], sub: `n<sub>T</sub> = ${perFloor} × ${fx(v.floors)} + ${rooms}`, ans: `${fx(total)}개` }));
  return { cards: [{
    title: '피난기구',
    tiles: [{ l: '층당 개수', v: fx(perFloor), u: '개' }, { l: '추가 완강기', v: fx(rooms), u: '개' }, { l: '전체 개수', v: fx(total), u: '개', tone: 'key' }],
    notes: [label],
    steps,
  }] };
}

function calcExt(v) {
  if (bad(v.area)) return { error: '층 바닥면적에 0보다 큰 값을 넣어 주세요.' };
  if (!(v.floors >= 1)) return { error: '층수를 1 이상으로 넣어 주세요.' };
  if (bad(v.unit)) return { error: '소화기 1개 능력단위에 0보다 큰 값을 넣어 주세요.' };
  const [base0, label] = STD.ext.kinds[v.kind];
  const mul = v.fireproof ? STD.ext.fireproofMul : 1, base = base0 * mul;
  const units = up(v.area / base), perFloor = up(units / v.unit), rooms = n0(v.rooms), total = perFloor * v.floors + rooms;
  const steps = [
    step({ t: '능력단위 기준면적', f: 'B = B₀ × m', sym: [['B', '능력단위 1당 바닥면적 (㎡)'], ['B₀', `${label} 기준 (㎡)`], ['m', v.fireproof ? '내화구조·불연재료 마감 배수' : '배수 (해당 없음)']], sub: `B = ${base0} × ${mul}`, ans: `${fx(base)} ㎡` }),
    step({ t: '층당 필요 능력단위', f: 'U = ⌈A ÷ B⌉', sym: [['U', '층당 필요 능력단위'], ['A', '층 바닥면적 (㎡)'], ['B', '능력단위 1당 바닥면적 (㎡)'], ['⌈ ⌉', '올림']], sub: `U = ⌈${fx(v.area)} ÷ ${fx(base)}⌉`, ans: `${units}단위` }),
    step({ t: '층당 소화기 개수', f: 'n = ⌈U ÷ u⌉', sym: [['n', '층당 소화기 개수 (개)'], ['U', '필요 능력단위'], ['u', '소화기 1개 능력단위']], sub: `n = ⌈${units} ÷ ${fx(v.unit)}⌉`, ans: `${perFloor}개` }),
    step({ t: '전체 소화기 개수', f: 'n<sub>T</sub> = n × F + R', sym: [['n<sub>T</sub>', '전체 소화기 개수 (개)'], ['n', '층당 개수 (개)'], ['F', '층수 (층)'], ['R', '33㎡ 이상 구획된 실마다 추가 (개)']], sub: `n<sub>T</sub> = ${perFloor} × ${fx(v.floors)} + ${rooms}`, ans: `${fx(total)}개` }),
  ];
  return { cards: [{
    title: '소화기구',
    tiles: [{ l: '층당 능력단위', v: fx(units), u: '단위' }, { l: '층당 소화기', v: fx(perFloor), u: '개' }, { l: '전체 소화기', v: fx(total), u: '개', tone: 'key' }],
    notes: ['보행거리(소형 20m, 대형 30m) 안에 들어오는지는 평면을 보고 따로 확인해야 해요.'],
    steps,
  }] };
}

/* =========================================================
   ⑨ 화면 그리기
   ========================================================= */
const state = {};
const openSteps = new Set();   // 사용자가 펼친 '계산 과정' (값을 바꿔도 펼친 채로 유지)
let current = TARGETS[0].id;
const target = () => TARGETS.find((t) => t.id === current);
const optsOf = (f) => (typeof f.opts === 'function' ? f.opts() : f.opts);

function defaults(t) {
  const v = {};
  t.sections.forEach((s) => {
    if (s.toggle) v[s.toggle] = s.toggleDef !== undefined ? s.toggleDef : true;
    s.fields.forEach((f) => { v[f.id] = f.def; });
  });
  return v;
}
TARGETS.forEach((t) => { state[t.id] = defaults(t); });

function fieldHTML(f, val) {
  const id = 'f_' + f.id;
  const hintText = typeof f.hint === 'function' ? f.hint() : f.hint;
  const hint = hintText ? `<span class="hint">${hintText}</span>` : '';
  if (f.type === 'chk') return `<label class="chk wide" for="${id}"><input type="checkbox" id="${id}" data-k="${f.id}" ${val ? 'checked' : ''}><span>${f.label}${hintText ? `<br><span class="hint">${hintText}</span>` : ''}</span></label>`;
  if (f.type === 'sel') return `<label class="fld${f.wide ? ' wide' : ''}" for="${id}"><span class="fl">${f.label}</span><select id="${id}" data-k="${f.id}">${optsOf(f).map(([k, l]) => `<option value="${k}"${String(val) === String(k) ? ' selected' : ''}>${l}</option>`).join('')}</select>${hint}</label>`;
  const val_ = (x) => (typeof x === 'function' ? x() : x);
  const lim = `${f.min != null ? ` min="${val_(f.min)}"` : ''}${f.max != null ? ` max="${val_(f.max)}"` : ''} step="${f.step || 'any'}"`;
  const list = f.list ? `<datalist id="dl_${f.id}">${val_(f.list).map((o) => `<option value="${o}"></option>`).join('')}</datalist>` : '';
  return `<label class="fld${f.wide ? ' wide' : ''}" for="${id}"><span class="fl">${f.label}</span><span class="iw"><input type="number"${lim} inputmode="decimal" id="${id}" data-k="${f.id}" value="${val ?? ''}" placeholder="${f.ph || ''}"${f.list ? ` list="dl_${f.id}"` : ''}>${f.unit ? `<span class="u">${val_(f.unit)}</span>` : ''}</span>${list}${hint}</label>`;
}

function renderTargets() {
  $('#targets').innerHTML = TARGETS.map((t) => `<button type="button" data-t="${t.id}" aria-pressed="${t.id === current}"><b>${t.name}</b><small>${t.desc}</small></button>`).join('');
}

// 지금 화면에 보이는 입력칸 목록 (바뀌었는지 비교용)
function layoutKey() {
  const t = target(), v = state[t.id];
  return t.sections.map((s) => {
    if (s.show && !s.show(v)) return '-';
    if (s.toggle && !v[s.toggle]) return 'off';
    return s.fields.filter((f) => !f.show || f.show(v)).map((f) => f.id + (f.opts && typeof f.opts === 'function' ? optsOf(f).length : '') + (f.dep ? ':' + f.dep(v) : '')).join(',');
  }).join('|');
}

function renderInputs() {
  const t = target(), v = state[t.id];
  $('#form').innerHTML = t.sections.map((s) => {
    if (s.show && !s.show(v)) return '';
    const on = !s.toggle || v[s.toggle];
    const legend = s.toggle
      ? `<legend><input type="checkbox" id="f_${s.toggle}" data-k="${s.toggle}" ${on ? 'checked' : ''} aria-label="${s.title} 계산하기"><label for="f_${s.toggle}">${s.title}</label></legend>`
      : `<legend>${s.title}</legend>`;
    if (!on) return `<fieldset class="sec off">${legend}</fieldset>`;
    const fields = s.fields.filter((f) => !f.show || f.show(v)).map((f) => fieldHTML(f, v[f.id])).join('');
    return `<fieldset class="sec">${legend}${s.note ? `<p class="sec-note">${s.note}</p>` : ''}<div class="fields">${fields}</div></fieldset>`;
  }).join('');
}

const hit = (m, s) => (typeof m === 'string' ? s === m : m.test(s));
function chainOf(label) {
  const n = label.match(/^(\d)번 (~ 방유제|보유공지)$/);
  if (n) return [n[2] === '보유공지' ? `${n[1]}번 탱크 보유공지` : `${n[1]}번 탱크 ~ 방유제 거리`];
  return CHAIN[label];
}
function stepIdx(card, label) {
  const ts = (card.steps || []).map((s) => (s && s.t) || '');
  // 마지막 단계가 없으면(예: 간이스프링클러는 옥상수조 단계가 없음) 뒤에서부터 하나씩 줄여 가며 찾아요
  for (let ch = chainOf(label); ch && ch.length; ch = ch.slice(0, -1)) {
    const last = ch[ch.length - 1];
    const end = ts.reduce((a, s, i) => (hit(last, s) ? i : a), -1);
    if (end >= 0) return ts.map((s, i) => i).filter((i) => i <= end && ch.some((m) => hit(m, ts[i])));
  }
  for (const f of [(s) => s === label, (s) => s.startsWith(label), (s) => s.includes(label)]) {
    const r = ts.map((s, i) => (f(s) ? i : -1)).filter((i) => i >= 0);
    if (r.length) return r;
  }
  return [];
}
function groupTiles(c) {
  const tiles = (c.tiles || []).filter((x) => x && x.l);
  if (c.flat) return [{ g: '', items: tiles }];
  const used = new Set(), rows = [];
  const tank = {};
  tiles.forEach((x) => { const m = x.l.match(/^(\d)번 (.+)$/); if (m) { (tank[m[1]] = tank[m[1]] || []).push({ ...x, dl: m[2] === '~ 방유제' ? '방유제까지' : m[2] }); used.add(x); } });
  for (const G of GROUPS) {
    const main = tiles.find((x) => !used.has(x) && G.main.includes(x.l));
    if (main) used.add(main);
    const subs = tiles.filter((x) => !used.has(x) && G.sub.includes(x.l)).sort((a, b) => G.sub.indexOf(a.l) - G.sub.indexOf(b.l));
    subs.forEach((x) => used.add(x));
    if (main || subs.length) rows.push({ g: G.g, main, items: subs });
  }
  Object.keys(tank).sort().forEach((k) => rows.push({ g: `${k}번 탱크`, items: tank[k] }));
  const rest = tiles.filter((x) => !used.has(x));
  if (rest.length) rows.push({ g: '기초 수치', items: rest });
  // '배치' 묶음은 탱크별 묶음 뒤로
  const i = rows.findIndex((r) => r.g === '배치');
  if (i >= 0) rows.push(rows.splice(i, 1)[0]);
  return rows;
}
const openVal = new Map();   // 카드 제목 → 펼친 값 이름
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
function valHTML(c, x, cls) {
  const inner = `<span class="vl">${x.dl || x.l}</span><span class="vv">${x.v}${x.u ? `<small>${x.u}</small>` : ''}</span>`;
  const tone = x.tone === 'key' ? ' key' : '';
  if (!stepIdx(c, x.l).length) return `<div class="val ${cls}${tone}">${inner}</div>`;
  const on = openVal.get(c.title) === x.l;
  return `<button type="button" class="val ${cls}${tone} has${on ? ' on' : ''}" data-card="${esc(c.title)}" data-l="${esc(x.l)}" aria-expanded="${on}">${inner}</button>`;
}
function explainHTML(c, label) {
  const idx = stepIdx(c, label);
  if (!idx.length) return '';
  const name = (c.tiles.find((x) => x.l === label) || {}).dl || label;
  return `<div class="explain"><div class="ex-h"><span><b>${name}</b> 계산 과정${idx.length > 1 ? ` · ${idx.length}단계` : ''}</span><button type="button" class="ex-x" data-card="${esc(c.title)}" aria-label="계산 과정 닫기">닫기</button></div><div class="step-list chain">${idx.map((i) => c.steps[i]).join('')}</div></div>`;
}
function rowsHTML(c) {
  const open = openVal.get(c.title);
  return `<div class="rows${c.flat ? ' flat' : ''}">${groupTiles(c).map((r) => {
    const items = [r.main, ...r.items].filter(Boolean);
    const isOpen = open && items.some((x) => x.l === open);
    return `<div class="rrow${r.main ? '' : ' nomain'}">
      ${r.g ? `<div class="rg">${r.g}</div>` : ''}
      ${r.main ? valHTML(c, r.main, 'main') : ''}
      ${r.items.length ? `<div class="subs">${r.items.map((x) => valHTML(c, x, r.main ? 'sub' : 'mid')).join('')}</div>` : ''}
    </div>${isOpen ? explainHTML(c, open) : ''}`;
  }).join('')}</div>`;
}
function cardHTML(c) {
  const badge = c.badge ? `<span class="badge${c.badge === '겸용' || c.badgeOn ? ' on' : ''}">${c.badge}</span>` : '';
  const hasTiles = c.tiles && c.tiles.length;
  return `<article class="card ${c.kind || ''}">
    <header class="card-h"><h3>${c.title}</h3>${badge}</header>
    ${c.error ? `<p class="err">${c.error}</p>` : ''}
    ${hasTiles ? rowsHTML(c) : ''}
    ${c.warns && c.warns.length ? `<ul class="warns">${c.warns.map((w) => `<li>${w}</li>`).join('')}</ul>` : ''}
    ${c.extraTop || ''}
    ${c.notes && c.notes.length ? `<ul class="notes">${c.notes.map((w) => `<li>${w}</li>`).join('')}</ul>` : ''}
    ${c.steps && c.steps.length ? `<details class="steps" data-card="${esc(c.title)}"${openSteps.has(c.title) ? ' open' : ''}><summary>전체 계산 과정 (${c.steps.length}단계)</summary><div class="step-list">${c.steps.join('')}</div></details>` : ''}
    ${c.extra || ''}
  </article>`;
}

function renderResults() {
